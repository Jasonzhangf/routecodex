version = 3

[pipelines.hub_v1]
skeleton = "hub_v1"

[features]
tool_thinking = false
toolreason_client_projection = false
responses_direct_stopless_center = false
responses_direct = true
debug_events = true
strip_client_response_id = true
responses_continuation_disabled = true

[error]
provider_error_default_path = [
  { step = "wait_retry", retry_mode = "retry_same", max_attempts = 3, backoff_ms = 0 },
  { step = "cooldown", scope = "provider_model", duration_ms = 900000, provider_global_failure = false },
  { step = "project", status = 503, reason_code = "provider_failure", message_mode = "code_only" },
]

[[error.provider_error_action_policy]]
policy_id = "account_http_401_two_errors"
[error.provider_error_action_policy.match]
http_status = 401
[[error.provider_error_action_policy.path]]
step = "wait_retry"
retry_mode = "reselect_before_client_projection"
max_attempts = 2
backoff_ms = 1000
[[error.provider_error_action_policy.path]]
step = "cooldown"
scope = "auth_key"
duration_ms = 3600000
[[error.provider_error_action_policy.path]]
step = "project"
status = 502
reason_code = "provider_account_http_401"
message_mode = "code_only"

[[error.provider_error_action_policy]]
policy_id = "account_http_403_two_errors"
[error.provider_error_action_policy.match]
http_status = 403
[[error.provider_error_action_policy.path]]
step = "wait_retry"
retry_mode = "reselect_before_client_projection"
max_attempts = 2
backoff_ms = 1000
[[error.provider_error_action_policy.path]]
step = "cooldown"
scope = "auth_key"
duration_ms = 3600000
[[error.provider_error_action_policy.path]]
step = "project"
status = 502
reason_code = "provider_account_http_403"
message_mode = "code_only"

[[error.provider_error_action_policy]]
policy_id = "glmrelay_openai_cpu_overloaded_200"
[error.provider_error_action_policy.scope]
provider_id = "glmrelay_openai"
[error.provider_error_action_policy.match]
http_status = 200
content_contains_any = ["system cpu overloaded"]
[[error.provider_error_action_policy.path]]
step = "wait_retry"
retry_mode = "reselect_before_client_projection"
max_attempts = 2
backoff_ms = 1000
[[error.provider_error_action_policy.path]]
step = "project"
status = 502
reason_code = "provider_system_cpu_overloaded"
public_code = "upstream_overloaded"
message_mode = "code_only"

[[error.provider_error_action_policy]]
policy_id = "glmrelay_openai_invalid_field_type_200"
[error.provider_error_action_policy.scope]
provider_id = "glmrelay_openai"
[error.provider_error_action_policy.match]
http_status = 200
content_contains_any = ["Type invalid, should be set"]
[[error.provider_error_action_policy.path]]
step = "project"
status = 400
reason_code = "provider_invalid_field_type"
public_code = "provider_invalid_field_type"
message_mode = "code_only"

# === 4444 compact 独立池：MiniMax primary；OpenCode Go DeepSeek V4 Flash backup ===
[route_groups.routecodex_v3_4444]
compact_route_object = "compact-default"

[[route_groups.routecodex_v3_4444.route_policies]]
id = "compact-purpose"
precedence = 10
condition = { kind = "current_compaction" }
action = { select_route_pool = "compact" }





[route_groups.routecodex_v3_4444.pools.default]
selection = { strategy = "priority" }
targets = [
  { kind = "provider_model", provider = "qwen-q4-huihui-local", model = "Huihui-Qwen3.8-27B-abliterated-oQ4e-mtp", priority = 100 },
  { kind = "provider_model", provider = "deepseek-v4-local", model = "DeepSeek-V4-Flash-0731-oQ4e-mtp", priority = 90 },
  { kind = "provider_model", provider = "opencode-go", model = "deepseek-v4-flash", priority = 80 },
  { kind = "provider_model", provider = "minimax_anthropic", model = "MiniMax-M3", priority = 70 },
]

[route_groups.routecodex_v3_4444.pools.compact]
route_object = "compact-default"
selection = { strategy = "priority" }
match = { precedence = 10, entry_protocol = "responses" }
targets = [
  { kind = "provider_model", provider = "minimax_anthropic", model = "MiniMax-M3", priority = 100 },
  { kind = "provider_model", provider = "opencode-go", model = "deepseek-v4-flash", priority = 90 },
]

# multimodal / web_search 请求最高优先级路由到 MiniMax-M3（支持
# multimodal + hosted web search；web_search 官方仅 Anthropic Messages API）。
# 不限制 entry_protocol：openai_chat / anthropic / responses 入口都覆盖
# （对齐 anthropic_v3_10000 已验证做法；能力信号与入口协议无关）。
[route_groups.routecodex_v3_4444.pools.multimodal]
selection = { strategy = "priority" }
match = { precedence = 0, required_capabilities = ["multimodal"] }
targets = [
  { kind = "provider_model", provider = "qwen-q4-huihui-local", model = "Huihui-Qwen3.8-27B-abliterated-oQ4e-mtp", priority = 100 },
  { kind = "provider_model", provider = "minimax_anthropic", model = "MiniMax-M3", priority = 90 },
]

[route_groups.routecodex_v3_4444.pools.web_search]
selection = { strategy = "priority" }
match = { precedence = 20, required_capabilities = ["web_search"] }
targets = [
  { kind = "provider_model", provider = "opencode-go", model = "deepseek-v4-flash", priority = 100 },
  { kind = "provider_model", provider = "minimax_anthropic", model = "MiniMax-M3", priority = 90 },
]

[route_groups.routecodex_v3_4444.pools.search]
selection = { strategy = "priority" }
match = { precedence = 21, entry_protocol = "responses" }
targets = [
  { kind = "provider_model", provider = "qwen-q4-huihui-local", model = "Huihui-Qwen3.8-27B-abliterated-oQ4e-mtp", priority = 100 },
  { kind = "provider_model", provider = "deepseek-v4-local", model = "DeepSeek-V4-Flash-0731-oQ4e-mtp", priority = 90 },
