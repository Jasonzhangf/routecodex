name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Repo sanity (no root junk)
        run: npm run verify:repo-sanity
      - name: V3 architecture CI umbrella
        run: npm run verify:v3-architecture-ci
      - name: V3 Responses session admission
        run: npm run verify:v3-responses-session-admission
      - name: V3 Responses session admission red fixtures
        run: npm run test:v3-responses-session-admission-red-fixtures
      - name: V3 Responses session admission behavior
        run: npm run test:v3-responses-session-admission
      - name: File line-limit gate (<500)
        run: npm run verify:file-line-limit
      - name: V3 file-size ratchet gate (<=1500)
        run: npm run verify:v3-file-size
      - name: V3 and shared classifier file-size red fixtures
        run: npm run test:v3-file-size-red-fixtures
      - name: V3 provider action gate
        run: npm run test:v3-provider-action-gate
      - name: V3 provider action architecture gate
        run: npm run verify:v3-provider-action-gate
      - name: V3 provider action red fixtures
        run: npm run test:v3-provider-action-gate-red-fixtures
      - name: V3 5520 duplicate response tool identity
        run: npm run test:v3-5520-duplicate-tool-identity
      - name: V3 Runtime timing observability
        run: npm run verify:v3-runtime-timing-observability
      - name: V3 Runtime timing red fixtures
        run: npm run test:v3-runtime-timing-observability-red-fixtures
      - name: V3 debug side-channel contract
        run: npm run test:v3-debug-contract
      - name: V3 debug payload budget
        run: npm run verify:v3-debug-payload-budget
      - name: V3 debug payload budget red fixtures
        run: npm run test:v3-debug-payload-budget-red-fixtures
      - name: V3 console request count visibility
        run: npm run verify:v3-console-request-count-visibility
      - name: V3 console request count red fixtures
        run: npm run test:v3-console-request-count-visibility-red-fixtures
      - name: V2 and V3 route-classifier semantic gate
        run: npm run test:route-classifier-semantics
      - name: V4 frozen foundation regression
        run: cargo test --workspace --manifest-path v4/Cargo.toml
      - name: Servertool Rust-only gate
        run: npm run verify:servertool-rust-only
      - name: Fetch Rust dependencies for offline builds
        run: cargo fetch --manifest-path v3/Cargo.toml
      - name: Build (release)
        env:
          BUILD_MODE: release
          # Prevent build scripts from mutating version files in CI.
          ROUTECODEX_SKIP_AUTO_BUMP: "1"
        run: npm run build:min
      - name: Install direct V3 CLI binary
        run: ROUTECODEX_SKIP_AUTO_BUMP=1 RUSTUP_TOOLCHAIN=stable npm run install:v3
      - name: Install built V3 CLI shim
        run: npm run fix:cli-shim
      - name: Run host tests
        env:
          ROUTECODEX_SKIP_AUTO_BUMP: "1"
        run: npm run test:v3-workspace

  v4-appsdk-admission:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install global AppSDK from release artifact
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/appsdk" \
            https://github.com/Jasonzhangf/appsdk/releases/download/v0.1.2/appsdk-0.1.2-macos-arm64
          chmod +x "$HOME/.local/bin/appsdk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: V4 AppSDK admission
        run: |
          command -v appsdk
          appsdk version
          test -x "$(command -v appsdk)"
          test "sha256:$(shasum -a 256 "$(command -v appsdk)" | cut -d ' ' -f 1)" = "$(jq -r .digest v4/.appsdk/sdk.lock)"
          appsdk verify --admission v4

  v4-active-link:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: V4 Active-link resolver regression
        run: cargo test -p routecodex-v4-build-link --manifest-path v4/Cargo.toml
      - name: V4 workspace release build
        run: cargo build --release --manifest-path v4/Cargo.toml
      - name: V4 workspace tests
        run: cargo test --workspace --manifest-path v4/Cargo.toml
      - name: Restore frozen Active artifacts from hermetic fixture
        run: mkdir -p v4/active/lib && cp -R v4/tests/resources/active-link-fixture/active/lib/. v4/active/lib/
      - name: V4 edge regression through Active surface
        run: >-
          cargo run --quiet --release --manifest-path v4/Cargo.toml
          -p routecodex-v4-build-link --
          test-consumer --root v4 --consumer routecodex-v4-edge
          --deps routecodex-v4-base-node
      - name: V4 config regression through resolver
        run: >-
          cargo run --quiet --release --manifest-path v4/Cargo.toml
          -p routecodex-v4-build-link --
          test-consumer --root v4 --consumer routecodex-v4-config
          --deps routecodex-v4-base-node,routecodex-v4-edge
      - name: V4 control regression through resolver
        run: >-
          cargo run --quiet --release --manifest-path v4/Cargo.toml
          -p routecodex-v4-build-link --
          test-consumer --root v4 --consumer routecodex-v4-control
          --deps routecodex-v4-base-node
      - name: V4 error regression through resolver
        run: >-
          cargo run --quiet --release --manifest-path v4/Cargo.toml
          -p routecodex-v4-build-link --
          test-consumer --root v4 --consumer routecodex-v4-error
          --deps routecodex-v4-base-node
      - name: V4 deterministic Active index
        run: >-
          cargo run --quiet --release --manifest-path v4/Cargo.toml
          -p routecodex-v4-build-link -- gen-index --root v4 &&
          cargo run --quiet --release --manifest-path v4/Cargo.toml
          -p routecodex-v4-build-link -- verify-index --root v4
      - name: V4 frozen-source edge gate
        run: node scripts/architecture/verify-v4-active-link.mjs
