name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      v3: ${{ steps.changed.outputs.v3 }}
      v4: ${{ steps.changed.outputs.v4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install scope dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Changed-path fast gate and scope classification
        id: changed
        env:
          ROUTECODEX_GATE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ROUTECODEX_GATE_DIFF_HEAD: ${{ github.sha }}
          ROUTECODEX_GATE_REMOTE_NAME: origin
          ROUTECODEX_GATE_SCOPE_ONLY: '1'
        run: |
          ROUTECODEX_GATE_SCOPE_OUTPUT="$GITHUB_OUTPUT" npm run --silent verify:fast
      - name: Scope classifier regression
        run: npm run test:verify-fast-scope
      - name: Scope decision
        run: |
          echo "[verify:scope] false scope outputs are SKIPPED_OUT_OF_SCOPE, never PASS"

  repo-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repo sanity dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repo sanity (no root junk)
        run: npm run verify:repo-sanity

  test:
    needs: scope
    if: needs.scope.outputs.v3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v3/package-lock.json
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install V3 dependencies
        run: npm ci --prefix v3 --ignore-scripts --no-audit --no-fund
      - name: Fetch Rust dependencies for V3 checks
        run: cargo fetch --locked --manifest-path v3/Cargo.toml
      - name: Fallback and internal policy hardcode gate
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run verify:fallback-hardcode
      - name: V3 Responses session admission
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run verify:v3-responses-session-admission
      - name: V3 Responses session admission red fixtures
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run test:v3-responses-session-admission-red-fixtures
      - name: V3 Responses session admission behavior
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run test:v3-responses-session-admission
      - name: File line-limit gate (<500)
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run verify:file-line-limit
      - name: V3 file-size ratchet gate (<=1500)
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run verify:v3-file-size
      - name: V3 and shared classifier file-size red fixtures
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run test:v3-file-size-red-fixtures
      - name: V3 provider action gate
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run test:v3-provider-action-gate
      - name: V3 provider action architecture gate
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run verify:v3-provider-action-gate
      - name: V3 provider action red fixtures
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run test:v3-provider-action-gate-red-fixtures
      - name: V3 5520 duplicate response tool identity
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run test:v3-5520-duplicate-tool-identity
      - name: V3 Runtime timing observability
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run verify:v3-runtime-timing-observability
      - name: V3 Runtime timing red fixtures
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run test:v3-runtime-timing-observability-red-fixtures
      - name: V3 debug side-channel contract
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run test:v3-debug-contract
      - name: V3 debug payload budget
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run verify:v3-debug-payload-budget
      - name: V3 debug payload budget red fixtures
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run test:v3-debug-payload-budget-red-fixtures
      - name: V3 canonical verification stack
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm --prefix v3 run verify:ci
      - name: V3 console request count red fixtures
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm --prefix v3 run test:v3-console-request-count-visibility-red-fixtures
      - name: V3 route-classifier semantic gate
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run test:route-classifier-semantics
      - name: Servertool Rust-only gate
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: node scripts/verify-servertool-rust-only.mjs
      - name: Build (release)
        if: needs.scope.outputs.v3 == 'true'
        env:
          BUILD_MODE: release
          # Prevent build scripts from mutating version files in CI.
        run: npm run build:min
      - name: Install direct V3 CLI binary
        if: needs.scope.outputs.v3 == 'true'
        run: RUSTUP_TOOLCHAIN=stable npm run install:v3
      - name: Install built V3 CLI shim
        if: needs.scope.outputs.v3 == 'true'
        run: npm run fix:cli-shim
      - name: Run host tests
        if: needs.scope.outputs.v3 == 'true'
        run: npm run test:v3-workspace

  v4-build:
    needs: scope
    if: needs.scope.outputs.v4 == 'true'
    # GitHub-hosted macos-14 is ARM64 (2025-09-19 hosted-runner label change);
    # matches the aarch64-apple-darwin Active fixtures. Intel labels such as
    # macos-14-large/macos-15-intel are rejected by the isolation gate.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: v4
      - name: V4 install local build dependencies
        run: npm ci --prefix v4 --ignore-scripts
      - name: V4 canonical verification (build/test/gates/red/isolation)
        env:
          RCCV4_REAL_RUNTIME_ADMISSION_MODE: contract
        run: npm --prefix v4 run verify:ci

  v4-appsdk-admission:
    needs: scope
    if: needs.scope.outputs.v4 == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build global AppSDK from locked release source
        run: |
          git clone --depth 1 --branch v0.1.5 \
            https://github.com/Jasonzhangf/appsdk.git "$RUNNER_TEMP/appsdk-src"
          cargo build --release --locked \
            --manifest-path "$RUNNER_TEMP/appsdk-src/rust/Cargo.toml"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 \
            "$RUNNER_TEMP/appsdk-src/rust/target/release/appsdk" \
            "$HOME/.local/bin/appsdk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: V4 AppSDK admission
        run: |
          command -v appsdk
          appsdk version
          test -x "$(command -v appsdk)"
          appsdk verify --admission v4
