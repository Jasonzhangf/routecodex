name: test

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      v3: ${{ steps.changed.outputs.v3 }}
      v3_architecture: ${{ steps.changed.outputs.v3_architecture }}
      v3_build: ${{ steps.changed.outputs.v3_build }}
      v3_provider: ${{ steps.changed.outputs.v3_provider }}
      v3_session: ${{ steps.changed.outputs.v3_session }}
      v3_debug: ${{ steps.changed.outputs.v3_debug }}
      v3_router: ${{ steps.changed.outputs.v3_router }}
      v3_tool: ${{ steps.changed.outputs.v3_tool }}
      v4: ${{ steps.changed.outputs.v4 }}
      v4_full: ${{ steps.changed.outputs.v4_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install scope dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Git hook behavior regression
        run: npm run --silent test:git-hooks
      - name: Changed-path fast gate and scope classification
        id: changed
        env:
          ROUTECODEX_GATE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ROUTECODEX_GATE_DIFF_HEAD: ${{ github.sha }}
          ROUTECODEX_GATE_REMOTE_NAME: origin
          ROUTECODEX_GATE_SCOPE_ONLY: '1'
        run: |
          ROUTECODEX_GATE_SCOPE_OUTPUT="$GITHUB_OUTPUT" npm run --silent verify:fast
      - name: Scope classifier regression
        run: npm run test:verify-fast-scope
      - name: Scope decision
        run: |
          echo "[verify:scope] false scope outputs are SKIPPED_OUT_OF_SCOPE, never PASS"

  repo-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repo sanity dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repo sanity (no root junk)
        run: npm run verify:repo-sanity

  test:
    needs: scope
    if: needs.scope.outputs.v3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v3/package-lock.json
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install V3 dependencies
        run: npm ci --prefix v3 --ignore-scripts --no-audit --no-fund
      - name: Fetch Rust dependencies for V3 checks
        run: cargo fetch --locked --manifest-path v3/Cargo.toml
      - name: Prepare native previous-release migration fixture
        if: ${{ !cancelled() && (needs.scope.outputs.v3_architecture == 'true' || needs.scope.outputs.v3_build == 'true') }}
        run: node v3/scripts/prepare-v3-previous-release-fixture.mjs
      - name: Install pinned DAGPipe graph CLI
        if: ${{ !cancelled() && needs.scope.outputs.v3_architecture == 'true' }}
        run: cargo install --git https://github.com/Jasonzhangf/DAGpipe.git --rev 8cb59fb5262b5e1e440638faf3b04e06a2762cfb --locked pipeline_runtime
      - name: Fallback and internal policy hardcode gate
        if: ${{ !cancelled() && needs.scope.outputs.v3 == 'true' }}
        run: npm run verify:fallback-hardcode
      - name: V3 Responses session admission behavior
        if: ${{ !cancelled() && needs.scope.outputs.v3_session == 'true' }}
        run: npm run test:v3-responses-session-admission
      - name: V3 provider action gate
        if: ${{ !cancelled() && needs.scope.outputs.v3_provider == 'true' }}
        run: npm run test:v3-provider-action-gate
      - name: V3 provider action architecture gate
        if: ${{ !cancelled() && needs.scope.outputs.v3_provider == 'true' }}
        run: npm run verify:v3-provider-action-gate
      - name: V3 provider action red fixtures
        if: ${{ !cancelled() && needs.scope.outputs.v3_provider == 'true' }}
        run: npm run test:v3-provider-action-gate-red-fixtures
      - name: V3 5520 duplicate response tool identity
        if: ${{ !cancelled() && needs.scope.outputs.v3_tool == 'true' }}
        run: npm run test:v3-5520-duplicate-tool-identity
      - name: V3 debug side-channel contract
        if: ${{ !cancelled() && needs.scope.outputs.v3_debug == 'true' }}
        run: npm run test:v3-debug-contract
      - name: V3 debug payload budget
        if: ${{ !cancelled() && needs.scope.outputs.v3_debug == 'true' }}
        run: npm run verify:v3-debug-payload-budget
      - name: V3 debug payload budget red fixtures
        if: ${{ !cancelled() && needs.scope.outputs.v3_debug == 'true' }}
        run: npm run test:v3-debug-payload-budget-red-fixtures
      - name: V3 canonical verification stack
        id: v3_canonical
        if: ${{ !cancelled() && needs.scope.outputs.v3_architecture == 'true' }}
        run: npm --prefix v3 run verify:ci
      - name: V3 DAGPipe graph governance
        if: ${{ !cancelled() && needs.scope.outputs.v3_architecture == 'true' }}
        run: npm run verify:v3-dagpipe-governance
      - name: V3 non-proxy feature DAG graph governance
        if: ${{ !cancelled() && needs.scope.outputs.v3_architecture == 'true' }}
        run: npm run verify:v3-dagpipe-feature-graphs
      - name: V3 route-classifier semantic gate
        if: ${{ !cancelled() && needs.scope.outputs.v3_router == 'true' }}
        run: npm run test:route-classifier-semantics
      - name: Build (release)
        if: needs.scope.outputs.v3_build == 'true'
        env:
          BUILD_MODE: release
          # Prevent build scripts from mutating version files in CI.
        run: npm run build:min
      - name: Install direct V3 CLI binary
        if: needs.scope.outputs.v3_build == 'true'
        run: npm run install:v3
      - name: Install built V3 CLI shim
        if: needs.scope.outputs.v3_build == 'true'
        run: npm run fix:cli-shim
      - name: Prepare pinned Codex consumer
        if: needs.scope.outputs.v3_build == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/rcc-codex-consumer" \
            --no-save --no-package-lock --no-audit --no-fund \
            "@openai/codex@0.163.0-alpha.10.2"
          echo "CODEX_CLI_PATH=$RUNNER_TEMP/rcc-codex-consumer/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - name: Verify pinned Codex consumer prerequisite
        if: needs.scope.outputs.v3_build == 'true'
        run: |
          "$CODEX_CLI_PATH" --version
      - name: Installed V3 protocol live-mock matrix
        id: v3_protocol_matrix
        if: needs.scope.outputs.v3_build == 'true'
        run: |
          node v3/scripts/tests/v3-protocol-live-mock-matrix.mjs \
            --binary "$HOME/.local/bin/rccv3" \
            --binary-kind installed \
            --evidence "$RUNNER_TEMP/v3-installed-protocol-matrix" \
            --allow-capability-skips
      - name: Upload V3 protocol matrix evidence
        if: ${{ !cancelled() && (steps.v3_protocol_matrix.outcome == 'success' || steps.v3_protocol_matrix.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: v3-installed-protocol-matrix
          path: ${{ runner.temp }}/v3-installed-protocol-matrix
          if-no-files-found: warn
      - name: Run host tests after install
        if: needs.scope.outputs.v3_build == 'true'
        run: |
          if [[ '${{ needs.scope.outputs.v3_architecture }}' == 'true' && '${{ steps.v3_canonical.outcome }}' == 'success' ]]; then
            node v3/scripts/run-v3-cargo-test.mjs -p routecodex-v3-cli -p routecodex-v3-lifecycle -- --nocapture
          else
            node v3/scripts/run-v3-cargo-test.mjs --workspace -- --nocapture
          fi

  v4-build:
    needs: scope
    if: needs.scope.outputs.v4_full == 'true'
    # GitHub-hosted macos-14 is ARM64 (2025-09-19 hosted-runner label change);
    # matches the aarch64-apple-darwin Active fixtures. Intel labels such as
    # macos-14-large/macos-15-intel are rejected by the isolation gate.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: v4
      - name: V4 install local build dependencies
        run: npm ci --prefix v4 --ignore-scripts
      - name: V4 canonical verification (build/test/gates/red/isolation)
        env:
          RCCV4_REAL_RUNTIME_ADMISSION_MODE: contract
        run: npm --prefix v4 run verify:ci

  v4-scoped:
    needs: scope
    if: needs.scope.outputs.v4 == 'true' && needs.scope.outputs.v4_full != 'true'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: v4
      - name: V4 install local build dependencies
        run: npm ci --prefix v4 --ignore-scripts
      - name: V4 scoped owner and contract checks
        env:
          ROUTECODEX_GATE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ROUTECODEX_GATE_DIFF_HEAD: ${{ github.sha }}
          ROUTECODEX_GATE_REMOTE_NAME: origin
        run: npm --prefix v4 run verify:scoped
