name: H2 startup file trace

on:
  push:
    branches:
      - codex/4da2a38-h2-startup-trace-20261004

permissions:
  contents: read

jobs:
  linux-file-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install file access tracer
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Restore the failed gate dependency context
        run: |
          npm ci --ignore-scripts
          npm --prefix v3 ci --ignore-scripts
          cargo fetch --locked --manifest-path v3/Cargo.toml
      - name: Install the same pinned DAGPipe graph CLI
        run: cargo install --git https://github.com/Jasonzhangf/DAGpipe.git --rev 8cb59fb5262b5e1e440638faf3b04e06a2762cfb --locked pipeline_runtime
      - name: Restore canonical verification and filesystem context
        run: npm --prefix v3 run verify:ci
      - name: Build and install the same V3 binaries as the failed host gate
        run: |
          BUILD_MODE=release npm run build:min
          npm run install:v3
          npm run fix:cli-shim
      - name: Compile the unchanged public H2 consumer
        run: |
          mkdir -p v3/build-control/h2-startup-trace
          node v3/scripts/run-v3-cargo-test.mjs -p routecodex-v3-cli --test h2_p6_controlled_replay --no-run > v3/build-control/h2-startup-trace/compile.log 2>&1
      - name: Reproduce the complete installed workspace context
        id: workspace
        run: strace -f -tt -e trace=%file,bind,connect -o v3/build-control/h2-startup-trace/workspace-files.log node v3/scripts/run-v3-cargo-test.mjs --workspace -- --nocapture > v3/build-control/h2-startup-trace/workspace.log 2>&1
      - name: Trace default parallel startup without suppressing failures
        if: ${{ !cancelled() && (steps.workspace.outcome == 'success' || steps.workspace.outcome == 'failure') }}
        run: |
          strace -f -tt -e trace=%file,bind,connect -o v3/build-control/h2-startup-trace/files.log node v3/scripts/run-v3-cargo-test.mjs -p routecodex-v3-cli --test h2_p6_controlled_replay -- --nocapture > v3/build-control/h2-startup-trace/replay.log 2>&1
      - name: Preserve file trace and original test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-startup-file-trace
          path: v3/build-control/h2-startup-trace/
          retention-days: 7
