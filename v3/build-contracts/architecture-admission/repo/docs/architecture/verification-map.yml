- feature_id: vr.route_classifier
  change_risk: high
  unit:
  - v3/crates/routecodex-v3-route-classifier/src/tests.rs
  - v3/crates/routecodex-v3-virtual-router/src/lib.rs
  - v3/crates/routecodex-v3-runtime/src/nodes.rs
  contract:
  - docs/goals/v3-v2-route-classifier-parity-test-design.md
  integration:
  - v3/crates/routecodex-v3-virtual-router/src/lib.rs
  smoke:
  - npm run test:route-classifier-semantics
  - npm run verify:route-classifier-core-file-size
  - npm run test:route-classifier-core-file-size-red-fixtures
  build:
  - npm run build:v3-cli
  notes:
  - Positive cases lock active-turn coding/thinking/search/tools/web_search and typed
    attachment metadata; negative cases lock declared tools, tool_choice, descriptions,
    schemas, reasoning fields, history, payload images, and stringified JSON at zero
    signal.
  - The same gate must run in CI, build:v3-cli, and global installation before binaries
    are published.
- feature_id: server.response_inspection_helpers
- feature_id: v3.sse_transport_core_independent
  change_risk: high
  unit:
  - v3/crates/routecodex-v3-sse/src/lib.rs
  contract:
  - docs/architecture/function-map.yml
  - docs/architecture/verification-map.yml
  integration:
  - v3/crates/routecodex-v3-provider-responses/src/shared.rs
  - v3/crates/routecodex-v3-runtime/src/shared.rs
  - v3/crates/routecodex-v3-server/src/lib.rs
  smoke:
  - npm run test:v3-sse-transport-core
  - npm run test:v3-sse-transport-adapter
  - npm run verify:sse-transport-core-shared
  - npm run verify:sse-architecture-boundary
  - npm run verify:v3-cargo-fmt
  - npm run verify:v3-clippy
  - npm run verify:function-map-compile-gate
  - npm run verify:architecture-mainline-call-map
  build:
  - cargo test --workspace --manifest-path v3/Cargo.toml
  notes:
  - Positive tests lock arbitrary UTF-8/chunk boundaries, multiline data, comment/id/retry,
    CRLF/LF, unknown fields, opaque `[DONE]`, and normal close inside the V3 workspace.
  - Negative tests lock invalid UTF-8, unterminated EOF, frame/buffer limits, cancellation/upstream
    failure mapping, and no synthetic terminal success.
  - V3 crates must import the V3-local `routecodex-v3-sse`; no external workspace SSE crate is permitted.
  - Server closeout wrappers must not parse SSE event names or data JSON to decide
    terminal, required_action, continuation, tool, servertool, or provider
    failure semantics.
- feature_id: v3.provider_compat_profile_loading
  change_risk: high
  unit:
  - v3/crates/provider-compat-core/src/lib.rs
  - v3/crates/routecodex-v3-runtime/src/hub_v1.rs
  contract:
  - v3/crates/provider-compat-core/src/lib.rs
  - v3/crates/routecodex-v3-runtime/tests/hub_relay_runtime_closeout.rs
  - v3/crates/routecodex-v3-runtime/tests/openai_chat_relay_runtime_integration.rs
  - v3/crates/routecodex-v3-runtime/tests/anthropic_relay_runtime_integration.rs
  - v3/crates/routecodex-v3-runtime/tests/gemini_relay_runtime_integration.rs
  - docs/architecture/v3-resource-operation-map.yml
  - docs/architecture/v3-function-map.yml
  - docs/architecture/v3-mainline-call-map.yml
  integration:
  - npm run test:v3-workspace
  smoke:
  - npm run test:v3-provider-compat-profile-loading
  - npm run verify:v3-architecture-docs
  - npm run verify:v3-resource-map
  - npm run verify:v3-module-boundaries
  - npm run verify:function-map-compile-gate
  - npm run verify:architecture-mainline-call-map
  build:
  - cargo test --workspace --manifest-path v3/Cargo.toml
  notes:
  - 'This verification entry exists because provider-compat-core declares feature_id:
    v3.provider_compat_profile_loading.'
  - Positive coverage must prove profile loading/application at ProviderReqCompat06ProviderCompat
    and ProviderRespCompat02ProviderCompat, including chat:minimax Anthropic hosted
    web-search projection to matching ordinary tool_use/tool_result blocks.
  - Negative coverage must reject missing, duplicate, orphan, and malformed hosted
    web-search identities/fields and prove provider compat does not own routing or tool
    governance, fallback, continuation, or SSE semantics.
  - Paired request/response negative coverage rejects top-level semantics, processed,
    and processingMetadata before provider/client payload projection; positive coverage
    preserves ordinary protocol and business fields.
- feature_id: v3.runtime_timing_observability
  change_risk: medium
  unit:
  - v3/crates/routecodex-v3-runtime/src/runtime_timing.rs
  contract:
  - docs/goals/v3-runtime-timing-observability-test-design.md
  - docs/goals/v3-runtime-timing-observability-debug-contract.json
  - docs/architecture/function-map.yml
  - docs/architecture/resource-operation-map.yml
  integration:
  - cargo +stable test --manifest-path v3/Cargo.toml -p routecodex-v3-runtime runtime_timing
    --lib
  smoke:
  - npm run verify:v3-runtime-timing-observability
  - npm run verify:function-map-compile-gate
  build:
  - npm run build:min
  notes:
  - Runtime owns responses timing observability; Server may only project it into console/debug
    output.
  - Direct and Relay protocol handoffs carry one opaque Runtime-owned timing and provider-attempt
    accumulator; Server only moves the typed carrier.
  - A successful human response headline requires typed response status, finish reason,
    and Runtime timing; missing usage is omitted from the human line and retained
    only in dim diagnostics.
  mainline_bindings:
  - v3-runtime-timing-01
  - v3-runtime-timing-02
  - v3-runtime-timing-03
  - v3-runtime-timing-04
  - v3-runtime-timing-05
  - v3-runtime-timing-06
  - v3-runtime-timing-07
  - v3-runtime-timing-08
  - v3-runtime-timing-09
  - v3-runtime-timing-10
  - v3-runtime-timing-11
  - v3-runtime-timing-12
  - v3-runtime-timing-13
  - v3-runtime-timing-14
- feature_id: v3.console_request_count_visibility
  change_risk: low
  unit:
  - v3/crates/routecodex-v3-server/src/lib.rs
  contract:
  - docs/goals/v3-console-request-count-visibility-test-design.md
  - docs/architecture/function-map.yml
  - docs/architecture/resource-operation-map.yml
  integration:
  - cargo +stable test --manifest-path v3/Cargo.toml -p routecodex-v3-server request_identity
    --lib -- --nocapture
  smoke:
  - npm run verify:v3-architecture-docs
  - npm run verify:function-map-compile-gate
  build:
  - npm run build:min
  notes:
  - Server owns one aggregate-shared request counter, the typed V3AllocatedRequestIdentity
    allocation extension, and request-count projection; listeners must not create
    independent locks for the shared persisted file, and console must not parse request
    ids, create a second counter, emit a duplicate pre-route placeholder block, or
    mutate request/response payloads.
  mainline_bindings:
  - v3-console-count-01
  - v3-console-count-02
  - v3-console-count-03
  - v3-console-count-04
- feature_id: v3.console_human_readable_layering
  change_risk: low
  unit:
  - v3/crates/routecodex-v3-server/src/lib.rs
  contract:
  - docs/goals/v3-console-human-readable-layering-test-design.md
  - docs/architecture/function-map.yml
  - docs/architecture/mainline-call-map.yml
  integration:
  - cargo +stable test --manifest-path v3/Cargo.toml -p routecodex-v3-server --lib
  - cargo +stable test --manifest-path v3/Cargo.toml -p routecodex-v3-error --lib
  smoke:
  - cargo +stable test --manifest-path v3/Cargo.toml -p routecodex-v3-server console
    --lib
  - cargo +stable check --manifest-path v3/Cargo.toml -p routecodex-v3-server
  - npm run verify:v3-rust-only
  - npm run verify:v3-module-boundaries
  - npm run verify:function-map-compile-gate
  - npm run verify:architecture-mainline-call-map
  - git diff --check
  build:
  - npm run install:v3
  notes:
  - Positive tests lock one Responses Direct/Relay routed request block and one terminal
    response block when runtime observability is present, exact 24/20/36 human columns
    including oversized ASCII/CJK, fixed 52-column diagnostic scope, bright headline
    color, blank separator, complete diagnostics, plain output, and preservation of
    the original Direct SSE Error01 kind/stage/code/message.
  - Positive disconnect coverage locks source stage V3ServerRespOutbound06ClientFrame,
    console status 499, and health-neutral post-commit handling.
  - Positive terminal-observation coverage locks Direct and Relay body Drop after
    completed as success, and Drop without terminal observation as typed health-neutral
    499.
  - Negative terminal-observation coverage locks Direct and Relay body Drop after
    failed as provider terminal failure 502, never success or client_disconnect.
  - Negative tests lock no fabricated post-commit Error06 for client disconnect or
    clean EOF; provider Error01 is projected once through the shared Error01-06
    terminal SSE event path, with no typed Error01-to-text reconstruction, no
    provider-stage attribution for client disconnect, no pre-route
    pending duplicate, no ANSI dim on the human line, no ANSI in plain mode, no diagnostic
    loss, stable machine-field alignment for oversized sessions, no synthesized internal/external
    timing, no Server-built dry-run runtime observability, fail-fast retired dry-run
    and missing route truth, no fabricated OpenAI Chat/Anthropic/Gemini Relay success
    observability, and no request/response/routing/error semantic mutation.
- feature_id: v3.codex_sample_retention_snap_scope
  change_risk: medium
  unit:
  - v3/crates/routecodex-v3-config/tests/config_v3_contract.rs
  - v3/crates/routecodex-v3-cli/tests/foundation_cli.rs
  - v3/crates/routecodex-v3-debug/tests/debug_runtime_contract.rs
  - v3/crates/routecodex-v3-server/src/lib.rs
  contract:
  - docs/goals/v3-codex-sample-retention-snap-scope-test-design.md
  - docs/architecture/v3-function-map.yml
  - docs/architecture/v3-mainline-call-map.yml
  - docs/architecture/v3-resource-operation-map.yml
  - docs/architecture/v3-verification-map.yml
  integration:
  - cargo +stable test --manifest-path v3/Cargo.toml -p routecodex-v3-cli --test managed_lifecycle
  - cargo +stable test --manifest-path v3/Cargo.toml -p routecodex-v3-server --test
    multi_listener_server responses_direct_full_snap_scope_persists_live_json_and_sse_responses
  - cargo +stable test --manifest-path v3/Cargo.toml -p routecodex-v3-server --test
    multi_listener_server responses_direct_relay_only_snap_scope_writes_no_codex_sample
  smoke:
  - npm run verify:v3-debug-payload-budget
  - npm run test:v3-debug-payload-budget-red-fixtures
  - npm run verify:v3-resource-map
  - npm run verify:v3-mainline-caller-flow
  - npm run verify:function-map-compile-gate
  - npm run verify:architecture-mainline-call-map
  - npm run verify:v3-rust-only
  - npm run verify:v3-module-boundaries
  build:
  - npm run install:v3
  notes:
  - No flag enables only error samples; --snap and --snapall authorize full Direct
    and Relay samples; blank stage selectors are rejected.
  - Server persists only Debug-redacted/budgeted copies, captures live Direct JSON/SSE
    without changing transport semantics, propagates filesystem scan/write/eviction
    failures, and retains at most 100 request directories per endpoint/port.
  - Live closure requires final no-flag restart after controlled --snap and --snapall
    replays.
