  - docs/architecture/v3-resource-operation-map.yml
  - docs/architecture/v3-function-map.yml
  - docs/architecture/v3-mainline-call-map.yml
  - docs/architecture/v3-verification-map.yml
  - docs/architecture/manifests/architecture.v3_contract_maps.mainline.yml
  - docs/goals/root-generated-artifacts-governance-plan.md
  - docs/goals/repository-root-retirement-v4-v3-integration-plan.md
  integration:
  - .gitignore
  - scripts/ci/repo-sanity.mjs
  - docs/architecture/mainline-call-map.yml
  - docs/architecture/manifests/architecture.repository_filesystem.mainline.yml
