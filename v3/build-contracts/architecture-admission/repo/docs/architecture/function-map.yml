    - config.provider_config_text_codec@V2ProviderConfigFile
    forbidden:
    - provider.wire_payload@V3ProviderReqOutbound08WirePayload
    - response.client_payload@V3ServerRespOutbound06ClientFrame
    - route.selection@V3HubReqTarget06Resolved
  canonical_types:
  - V2RootConfig
  - V2ProviderConfigFile
  - V3Config02AuthoringParsed
  - V3Config05ManifestPublished
  canonical_builders:
  - compile_v2_config_02_authoring_from_file
  - compile_v2_root
  - compile_v2_providers
  - discover_v3_secret_file_auth_handles
  - compile_v2_route_groups
  allowed_paths:
  - v3/crates/routecodex-v3-config/src/lib.rs
  - v3/crates/routecodex-v3-config/src/defaults.rs
  - v3/crates/routecodex-v3-config/src/store.rs
  - v3/crates/routecodex-v3-config/src/v2_compat.rs
  - v3/crates/routecodex-v3-config/src/validate.rs
  - v3/crates/routecodex-v3-config/tests/config_v3_contract.rs
  - docs/architecture
  - docs/design/v3-routecodex-rust-module-boundaries.md
  - docs/goals/v3-provider-auth-key-file-expansion-test-design.md
  - package.json
  forbidden_paths:
  - v3/crates/routecodex-v3-runtime
  - v3/crates/routecodex-v3-server
  - v3/crates/routecodex-v3-provider-responses
  - src/server/runtime/http-server
  - src/providers
  forbidden_mentions_allowlist:
  - V3Config05ManifestPublished
  required_tests:
  - v3/crates/routecodex-v3-config/tests/config_v3_contract.rs
  required_gates:
  - npm run test:v3-config-v2-compat-5555
  - npm run verify:v3-cargo-fmt
  - npm run verify:v3-clippy
  - npm run test:v3-workspace
  - npm run verify:v3-resource-map
  migration_target: rust
  notes:
  - V2 compatibility is an explicit input format branch in V3ConfigStore, not a fallback
    after V3 parse failure. Invalid V2 source fails fast.
  - V2 literal apiKey values remain apiKey/auth-handle declarations in the V3 manifest
    and are resolved only at provider transport send time; V3 must not materialize
    them into .routecodex-v3-secret-handles or a second secret truth.
  - Provider auth may reference one top-level secretFile; routecodex-v3-config enumerates
    its key names into existing secret_file + secret_key handles while values remain
    transport-resolved. Mixing auto-discovery with explicit auth entries fails fast.
  - 'The 5555 route contract is locked by config_store_compiles_v2_root_and_provider_toml_for_5555_contract:
    thinking/coding/longcontext = GLM 5.2 primary, GPT free backup, GPT paid backup;
    tools/search/web_search = MiniMax M3 primary, GLM 5.2 backup; multimodal = MiniMax
    M3 primary, GPT free backup, GPT paid gpt-5.4 fallback; default = de-duplicated
    ordered union of those targets and must stay non-empty.'
  - 'V2 provider `[provider.responses]` transport/websocket endpoint declarations
    are projected into the V3 provider manifest: omitted transport stays HTTP; `transport
    = "websocket_v2"` requires a `websocket_v2_url`/`websocketV2Url`; V2 model `remote_continuation`
    still requires `tool_outputs` and WebSocket v2 at compile time.'
