  notes:
  - The typed scoped formatter owns headline/detail structure; rendered console text
    is never reparsed to recover scope truth.
  - Pre-route pending request output is forbidden; one routed observability emission
    owns each Responses Direct/Relay request block when runtime observability is present.
  - Server-side provider-request dry-run observability synthesis is physically absent;
    retired dry-run observability fails fast before projection; OpenAI Chat, Anthropic,
    and Gemini Relay remain unconnected until their runtime owners publish real observability.
  - Human prefix and headline consume the same fail-fast V3ConsoleRouteProjection;
    route:selected is forbidden.
  - Relay/Direct SSE closeout failures retain typed Error01 and cannot fabricate Error06
    after response commit; terminal Error06 requires Runtime-owned route/default exhaustion
    proof.
  - Direct SSE failures retain their original typed Error01 kind, stage, code, message,
    and links; client disconnect is sourced at V3ServerRespOutbound06ClientFrame and
    remains health-neutral.
  - HTTP body Drop first enters the Direct/Relay finalizer and consumes Runtime-owned
    V3RuntimeStreamObservation; terminal success remains success, terminal failure
    remains provider failure, and only a missing terminal observation raises client_disconnect.
  - The call map explicitly separates post-commit Error01 console output from non-stream
    and pre-commit terminal Error06 projection.
  - Authoritative elapsed and usage facts are merged into the one success response
    block; Responses terminal success requires Runtime-owned internal/external timing
    and missing timing is an explicit observability contract failure.
  - Bright human response headlines require typed response status and finish reason,
    include only published numeric usage/timing fields, and never display unreported
    placeholders; unavailable usage remains diagnostic-only.
