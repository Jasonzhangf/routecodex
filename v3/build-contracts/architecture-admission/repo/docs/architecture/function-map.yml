    files into an executable V3 manifest with Hub V1 endpoint bindings for the 5555
    routing contract
  owner_kind: rust_ssot
  owner_scope: routecodex-v3-config owns V2 root/provider TOML detection, V2-to-V3
    authoring projection, shared Hub V1 endpoint/server execution defaults, provider
    auth-handle publication, and manifest publication for V3 runtime consumption;
    runtime/server/CLI only consume V3Config05ManifestPublished
  owner_module: v3/crates/routecodex-v3-config/src/v2_compat.rs
  resource_bindings:
    writes:
