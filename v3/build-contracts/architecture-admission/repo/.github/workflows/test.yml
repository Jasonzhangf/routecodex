name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            v3/package-lock.json
            v4/package-lock.json
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            v3
            v4
      - name: Install V3 local build dependencies
        run: npm ci --prefix v3 --ignore-scripts
      - name: Repo sanity (no root junk)
        run: node scripts/ci/repo-sanity.mjs
      - name: V3 admission snapshot lockstep
        run: node scripts/architecture/compile-v3-build-admission.mjs --check
      - name: V3 canonical verification (build/test/gates/red/isolation)
        run: npm --prefix v3 run verify:ci
      - name: V4 install local build dependencies
        run: npm ci --prefix v4 --ignore-scripts
      - name: V4 canonical verification (build/test/gates/red/isolation)
        run: npm --prefix v4 run verify:ci

  v4-appsdk-admission:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install global AppSDK from release artifact
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/appsdk" \
            https://github.com/Jasonzhangf/appsdk/releases/download/v0.1.2/appsdk-0.1.2-macos-arm64
          chmod +x "$HOME/.local/bin/appsdk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: V4 AppSDK admission
        run: |
          command -v appsdk
          appsdk version
          test -x "$(command -v appsdk)"
          test "sha256:$(shasum -a 256 "$(command -v appsdk)" | cut -d ' ' -f 1)" = "$(jq -r .digest v4/.appsdk/sdk.lock)"
          appsdk verify --admission v4
