[package]
name = "routecodex-v3-config"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
routecodex-v3-oauth = { path = "../routecodex-v3-oauth" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[features]
# Test-only hooks (refill-limit injection). Requested only from dev-dependencies
# so production builds keep the single compiled policy source.
test-hooks = []

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
