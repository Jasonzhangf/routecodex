# RouteCodex 内部配置层（internal）：内部控制特判与内部模型清单。
#
# 分层约束：
# - 本文件是代码编译期嵌入资产（include_str!），随包发布；运行时判定全部查表。
# - 用户配置面（路由池 / provider / 模型）不承载任何特判，用户无需关心本文件。
# - 路由层（target）、流水线 compat（runtime）、能力面（server models catalog）、
#   配置校验面（validate）只消费本文件的判定结果，禁止内联具体模型名。
# - 修改本文件即修改 RouteCodex 内部行为（属发布级变更）。

# 用户 config.toml 之外的产品拓扑与策略。它先解析为既有
# V3Config02AuthoringParsed；用户路由选择只替换 pool targets，随后仍进入唯一
# Config03-05 编译链。这里禁止 provider/auth/model 真相。
user_config_base_toml = '''
version = 3

[pipelines.hub_v1]
skeleton = "hub_v1"

[features]
tool_thinking = false
toolreason_client_projection = false
responses_direct_stopless_center = false
responses_direct = true
debug_events = true
strip_client_response_id = true
responses_continuation_disabled = true

[error]
provider_error_default_path = [
  { step = "wait_retry", retry_mode = "retry_same", max_attempts = 3, backoff_ms = 0 },
  { step = "cooldown", scope = "provider_model", duration_ms = 900000, provider_global_failure = false },
  { step = "project", status = 503, reason_code = "provider_failure", message_mode = "code_only" },
]

[[error.provider_error_action_policy]]
policy_id = "account_http_401_two_errors"
match = { http_status = 401 }
path = [
  { step = "wait_retry", retry_mode = "reselect_before_client_projection", max_attempts = 2, backoff_ms = 1000 },
  { step = "cooldown", scope = "auth_key", duration_ms = 3600000 },
  { step = "project", status = 502, reason_code = "provider_account_http_401", message_mode = "code_only" },
]

[[error.provider_error_action_policy]]
policy_id = "account_http_403_two_errors"
match = { http_status = 403 }
path = [
  { step = "wait_retry", retry_mode = "reselect_before_client_projection", max_attempts = 2, backoff_ms = 1000 },
  { step = "cooldown", scope = "auth_key", duration_ms = 3600000 },
  { step = "project", status = 502, reason_code = "provider_account_http_403", message_mode = "code_only" },
]

[[error.provider_error_action_policy]]
policy_id = "glmrelay_openai_cpu_overloaded_200"
scope = { provider_id = "glmrelay_openai" }
match = { http_status = 200, content_contains_any = ["system cpu overloaded"] }
path = [
  { step = "wait_retry", retry_mode = "reselect_before_client_projection", max_attempts = 2, backoff_ms = 1000 },
  { step = "project", status = 502, reason_code = "provider_system_cpu_overloaded", public_code = "upstream_overloaded", message_mode = "code_only" },
]

[[error.provider_error_action_policy]]
policy_id = "glmrelay_openai_invalid_field_type_200"
scope = { provider_id = "glmrelay_openai" }
match = { http_status = 200, content_contains_any = ["Type invalid, should be set"] }
path = [
  { step = "project", status = 400, reason_code = "provider_invalid_field_type", public_code = "provider_invalid_field_type", message_mode = "code_only" },
]

[route_groups.routecodex_v3_4444]
compact_route_object = "compact-default"
route_policies = [
  { id = "compact-purpose", precedence = 10, condition = { kind = "current_compaction" }, action = { select_route_pool = "compact" } },
]

[route_groups.routecodex_v3_4444.pools.default]
targets = []

[route_groups.routecodex_v3_4444.pools.compact]
route_object = "compact-default"
match = { precedence = 10, entry_protocol = "responses" }
targets = []

[route_groups.routecodex_v3_4444.pools.multimodal]
match = { precedence = 0, required_capabilities = ["multimodal"] }
targets = []

[route_groups.routecodex_v3_4444.pools.web_search]
match = { precedence = 20, required_capabilities = ["web_search"] }
targets = []

[route_groups.routecodex_v3_4444.pools.search]
match = { precedence = 21, entry_protocol = "responses" }
targets = []

[route_groups.routecodex_v3_4444.pools.thinking]
match = { precedence = 2, entry_protocol = "responses" }
targets = []

[route_groups.routecodex_v3_4444.pools.coding]
match = { precedence = 3, entry_protocol = "responses" }
targets = []

[route_groups.routecodex_v3_4444.pools.tools]
match = { precedence = 30, required_capabilities = ["tools"] }
targets = []

[route_groups.routecodex_v3_4444.pools.longcontext]
match = { precedence = 1, min_input_tokens = 180000 }
targets = []

[route_groups.responses_v3_7777.pools.thinking]
match = { precedence = 2, required_capabilities = ["thinking"] }
targets = []

[route_groups.responses_v3_7777.pools.coding]
match = { precedence = 3, required_capabilities = ["coding"] }
targets = []

[route_groups.responses_v3_7777.pools.search]
match = { precedence = 21, required_capabilities = ["web_search"] }
targets = []

[route_groups.responses_v3_7777.pools.tools]
match = { precedence = 30, required_capabilities = ["tools"] }
targets = []

[route_groups.responses_v3_7777.pools.multimodal]
match = { precedence = 0, required_capabilities = ["multimodal"] }
targets = []

[route_groups.responses_v3_7777.pools.longcontext]
match = { precedence = 1, min_input_tokens = 180000 }
targets = []

[route_groups.responses_v3_7777.pools.default]
targets = []

[debug]
log_console = true
log_file = "logs/server-v3-7777.log"
snapshots = true
dry_run = true
retention = { raw_requests = 16, raw_responses = 16, events = 256 }

[admin_webui]
enabled = true
bind = "127.0.0.1"
port = 8777
'''

# 模型家族判定表：key 是家族名（内部标识），消费方只调用具名判定函数，
# 不感知家族名与匹配规则。
[model_families]
  # gpt 家族：OpenAI 官方 gpt 系列模型（Codex 客户端主模型族）。
  # 用途：路由层 requested-model 过滤豁免；compat 面 hosted web_search 保留、
  # 响应密文保留；配置校验面 gpt 系列自动补 text 能力。
  [model_families.gpt]
    prefix = "gpt-"
    exact = ["gpt"]

  # deepseek 家族：DeepSeek 模型族。用途：能力面（/v1/models catalog）判定
  # 独立单 provider 路由目标时是否打开高级有状态能力（如 WebSocket）。
  [model_families.deepseek]
    prefix = "deepseek-"

# 内置 Codex 目录模型清单与默认元数据：路由组内存在对应模型引用时以
# builtin 目录入口暴露（能力面用 defaults 构建内置条目的能力 / 上下文窗口 /
# 描述 / reasoning 预设）；路由候选展开对 builtin 模型跳过 requested-model
# 过滤（target 层按模型家族豁免，不依赖 manifest 声明）。
[builtin_catalog_models]
  ids = ["gpt-5.5"]

  [[builtin_catalog_models.defaults]]
  model_id = "gpt-5.5"
  capabilities = ["text", "reasoning", "tools", "web_search", "multimodal"]
  context_window = 272000
  description = "Frontier model for complex coding, research, and real-world work."
  default_reasoning_level = "medium"
  reasoning_efforts = ["low", "medium", "high", "xhigh"]
  minimal_client_version = "0.124.0"

  [[builtin_catalog_models.defaults]]
  model_id = "gpt-5.6-sol"
  capabilities = ["text", "reasoning", "tools", "web_search", "multimodal"]
  context_window = 372000
  description = "Latest frontier agentic coding model."
  default_reasoning_level = "low"
  reasoning_efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
  minimal_client_version = "0.144.0"

  [[builtin_catalog_models.defaults]]
  model_id = "gpt-5.6-terra"
  capabilities = ["text", "reasoning", "tools", "web_search", "multimodal"]
  context_window = 372000
  description = "Balanced agentic coding model for everyday work."
  default_reasoning_level = "medium"
  reasoning_efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
  minimal_client_version = "0.144.0"

  [[builtin_catalog_models.defaults]]
  model_id = "gpt-5.6-luna"
  capabilities = ["text", "reasoning", "tools", "web_search", "multimodal"]
  context_window = 372000
  description = "Fast and affordable agentic coding model."
  default_reasoning_level = "medium"
  reasoning_efforts = ["low", "medium", "high", "xhigh", "max"]
  minimal_client_version = "0.144.0"

# 隐藏的 Codex 未来模型：不在任何模型目录 / 能力面暴露。
[hidden_models]
  exact = ["gpt-5.6"]
  prefixes = ["gpt-5.6-"]

# 内部 debug 样本策略：不暴露在用户 config manifest；显式 --snap/--snap-stages
# 仍由 lifecycle 授权覆盖为全量样本。
[debug_samples]
  error_samples_only = true
  error_sample_skip_statuses = [401, 402, 403, 429, 503]

# 全局错误处理策略：只消费 provider mapping 产出的 typed error；不负责原始
# provider error mapping。runtime 通过 internal.rs 查表，禁止在代码内硬编码。
[error_handling]
  transient_stages = ["provider.sse_decode", "provider.sse_stream", "provider.transport_transient", "V3ProviderResp14Raw", "V3ProviderRespInbound01Raw", "V3ProviderReqOutbound09TransportRequest", "V3Transport13ResponsesHttpRequest"]
  transient_wait_ms = [1000, 3000, 5000]
  recoverable_http_statuses = [429, 500, 502]
  recoverable_failure_threshold = 3
  recoverable_cooldown_ms = 900000
  recoverable_probe_interval_ms = 900000
  unrecoverable_http_statuses = [401, 402, 403, 503]
  unrecoverable_failure_threshold = 2
  unrecoverable_cooldown_ms = 3600000
  unrecoverable_probe_interval_ms = 3600000

# WebUI observability persistence guard: one persisted row must stay bounded.
[observability]
  max_record_bytes = 104857600
