<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/vendor/ambient.css">
<link rel="stylesheet" href="/styles.css">
<title>Routes — RouteCodex</title>
</head>
<body class="ambient">
<aside id="sidebar" class="sidebar" aria-label="Primary"></aside>
<div class="shell">
  <header class="page-header">
    <div class="page-header-inner">
      <div class="page-heading">
        <p class="eyebrow">Setup</p>
        <h1 id="page-title">Routes</h1>
        <p id="page-sub" class="sub">Tier 1 is tried first. Put alternatives in the same tier to share traffic; add lower tiers as backups.</p>
      </div>
      <div class="page-actions">
        <span class="route-save-state" id="save-state">Saved</span>
        <button class="btn" id="validate-btn">Validate</button>
        <button class="btn" id="discard-btn" disabled>Discard</button>
        <button class="btn primary" id="save-btn" disabled>Save routes</button>
      </div>
    </div>
  </header>

  <main>
    <div class="status-bar info" id="status-bar" role="status" aria-live="polite">Loading routes…</div>

    <div class="routes-toolbar" aria-label="Route filters">
      <label for="search-filter">Find a pool or model</label>
      <input id="search-filter" type="search" placeholder="Search pools, providers, or models" autocomplete="off">
      <span class="spacer"></span>
      <label for="server-selector">Server</label>
      <select id="server-selector" aria-label="Server"></select>
    </div>

    <section id="route-tree" class="route-editor" aria-busy="true"></section>
  </main>
</div>

<dialog id="provider-picker" class="route-picker" aria-labelledby="picker-title">
  <form method="dialog" class="route-picker-shell">
    <div class="route-picker-head">
      <div>
        <p class="eyebrow">Provider pool</p>
        <h2 id="picker-title">Add a provider and model</h2>
      </div>
      <button class="icon-btn" value="cancel" aria-label="Close provider picker">×</button>
    </div>
    <label class="route-picker-search" for="picker-filter">Search providers and models</label>
    <input id="picker-filter" type="search" autocomplete="off" placeholder="e.g. opencode or gpt-5">
    <div id="picker-list" class="route-picker-list" role="radiogroup" aria-label="Available provider models"></div>
    <div class="actions">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn primary" id="picker-confirm" value="default" disabled>Add model</button>
    </div>
  </form>
</dialog>

<script type="module" src="/app/views/routes.js"></script>
</body>
</html>
