<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RouteCodex — Providers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111827'/%3E%3Cpath d='M9 23 23 9M9 9l14 14' stroke='%235b8cff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/ambient.css">
<link rel="stylesheet" href="/styles.css">

<body class="ambient">
<aside id="sidebar" class="sidebar amb-surface amb-elevation-1 amb-chamfer" aria-label="Primary"></aside>
<div class="shell">
  <div class="topbar">
    <div class="spacer"></div>
    <button class="btn amb-button amb-button-cap" id="refresh-btn" type="button">Refresh</button>
    <button class="btn primary amb-button amb-button-cap amb-light-tl" id="reload-btn" type="button">Reload</button>
  </div>
  <main>
    <h1 id="page-title">Providers</h1>
    <div id="page-sub" class="sub">Provider inventory, health and route references</div>
    <div id="status-bar" class="status-bar" role="status" aria-live="polite" style="display:none"></div>
    <div class="cards" id="summary-cards"></div>
    <div class="layout">
      <div class="section">
        <h2>Providers</h2>
        <div class="panel amb-surface amb-elevation-1" id="providers-panel"><div class="loading">loading…</div></div>
      </div>
      <div class="section">
        <h2>Health mix</h2>
        <div class="panel amb-surface amb-elevation-1" id="health-donut"></div>
      </div>
    </div>
  </main>
</div>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="drawer amb-surface amb-elevation-2" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <button class="btn close" id="drawer-close" type="button" aria-label="Close provider details">&#10005;</button>
  <h2 id="drawer-title">Provider</h2>
  <div id="drawer-body"></div>
</div>

<script type="module" src="/app/views/providers.js"></script>
