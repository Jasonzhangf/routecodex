notes: |
  V3/V4 semantic truth closure：每条 V3 semantic stage 必须映射到唯一的 V4
  container（node family/role）、V4 plugin（operator kind）、checkpoint（node id +
  语义）、resource（v4-resource-operation-map.yml 的 resource_id）与 verification
  gate。coverage=100%、GAP=0 是进入下一阶段的硬门槛；checkpoint_evidence 为
  pending_skeleton_vslice 的条目由 Phase 4/5 提供实现证据，证据落地前
  v4_parity_gate_semantic_parity 保持红。
coverage:
  v3_resources: {total: 103, mapped: 103, gap: 0}
  stages: {total: 26, mapped: 26, gap: 0}
  request: {total: 9, mapped: 9}
  response: {total: 6, mapped: 6}
  error: {total: 6, mapped: 6}
  config: {total: 5, mapped: 5}
chains:
  request:
    - v3_stage: request.inbound_normalize
      v3_semantic: raw entry capture -> protocol parse -> normalized request identity
      container: {family: RequestChainNode, role: request_inbound}
      plugins: [entry_capture, protocol_parse, normalize]
      checkpoint: {node_id: V4ReqInbound02Normalized, semantic: normalized_request_identity_locked}
      resource: v4.request.normal_payload
      verification_gates: [v4_parity_gate_skeleton_topology, v4_parity_gate_semantic_parity, v4_parity_gate_plane_isolation, v4_parity_gate_execution_binding]
      checkpoint_evidence: "implemented: routecodex-v4-runtime ProtocolParse/Normalize/InputValidate (request chain, runtime test-consumer 9)"
    - v3_stage: request.continuation_classify
      v3_semantic: classify entry protocol/continuation owner/scope; never restore history in inbound
