notes: |
  V4 Relay + Continuation compatibility evidence slice. Relay and Direct share
  the same Hub chain and differ only in typed-facts operator selection
  (entry_protocol / provider_wire_protocol / continuation_owner /
  execution_mode; provider_id / model_prefix / payload_shape_guess forbidden).
  Continuation save occurs only at V4HubRespChatProcess03Governed and restore
  only at the next request ChatProcess continuation node; the interval between
  save and restore is immutable (no semantic transformation, no history/tool
  patch, no provider/client body rebuild). Every V3 semantic stage across the
  six required surfaces maps to exactly one V4 container + checkpoint +
  resource + verification gate with evidence. Any entry with
  diff_status=unexplained is RED (unexplained_diff must be 0).
unexplained_diff: 0
