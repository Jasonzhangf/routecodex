forbidden_direct_edges:
  - from: v4.config.manifest
    to: v4.request.normal_payload
    reason: config fields must not leak into business payload
  - from: v4.config.manifest
    to: v4.request.provider_wire_payload
    reason: runtime consumes manifest through typed config resource, never through payload
  - from: v4.control.metadata_center
    to: v4.request.provider_wire_payload
    reason: control signals must never enter provider body
  - from: v4.control.metadata_center
    to: v4.response.client_wire_payload
    reason: control signals must never enter client body
  - from: v4.control.side_channel
    to: v4.request.provider_wire_payload
    reason: typed carrier must stay out of provider wire
  - from: v4.control.side_channel
    to: v4.response.client_wire_payload
    reason: typed carrier must stay out of client wire
  - from: v4.control.stopless_state
    to: v4.response.client_wire_payload
    reason: stopless control state must not project into normal client payload
  - from: v4.control.stopless_state
    to: v4.request.provider_wire_payload
    reason: only registered Req04 current-turn projection may carry stopless guidance to provider
  - from: v4.scope.session
    to: v4.request.provider_wire_payload
    reason: scope keys must not become provider body fields
  - from: v4.scope.session
    to: v4.response.client_wire_payload
    reason: scope keys must not become client body fields
  - from: v4.control.route_facts
    to: v4.request.normal_payload
    reason: router must not patch or annotate payload
  - from: v4.control.target_selection
    to: v4.request.normal_payload
    reason: opaque target selection must not modify payload
  - from: v4.control.route_exit
    to: v4.request.normal_payload
    reason: route decision output must not modify payload
  - from: v4.control.route_exit
    to: v4.request.provider_wire_payload
    reason: route decision is a typed control resource, never a wire field
  - from: v4.control.route_exit
    to: v4.response.client_wire_payload
    reason: route decision must never project into client body
  - from: v4.control.route_policy_live
    to: v4.request.normal_payload
    reason: live route policy override must not patch payload
  - from: v4.control.route_policy_live
    to: v4.request.provider_wire_payload
    reason: live route policy is control-only
  - from: v4.control.route_policy_live
    to: v4.response.client_wire_payload
    reason: live route policy is control-only
  - from: v4.control.error_center
    to: v4.request.normal_payload
    reason: error center classifies and audits typed error facts; it must not rewrite the original request payload
