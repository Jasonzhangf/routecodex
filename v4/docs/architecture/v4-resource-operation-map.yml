version: 2
status: active
scope: routecodex-v4-foundation
owner_feature_id: v4.resource_registry
canonical_docs:
  - v4/docs/architecture/v4-data-control-plane-boundary.md
  - v4/contracts/data-control-boundary.contract.json
  - v4/docs/goals/v4-foundation-framework-plan.md
  - docs/architecture/v3-resource-operation-map.yml
notes: |
  本注册表是 V4 真源资源图，binding_status 已按机器 gate
  （v4_parity_gate_resource_binding）收敛：anchored 表示对应实现已落地、
  机器 gate 绿且 .appsdk resource-map.json 双源 status=active；design 表示
  计划 owner 尚未生效，不得作为真源引用。anchored 准入条件：对应 V4 实现、
  机器 gate 与资源关系测试全部落地。
  Phase 2 追加：每个 resource 必须声明 axis（data/control/information/
  diagnostic 之一）与 verification_gate（v4/.appsdk/maps/verification-map.json
  中的 gate_id 或 v4_parity_gate_* 系列）；存在 resource 但无 owner 或无 gate
  视为注册表缺陷。binding_status 只在对应 gate 绿且实现落地后改为 anchored。
resources:
  # ---------------- data plane ----------------
  - resource_id: v4.request.normal_payload
    axis: data
    verification_gate: [v4_parity_gate_plane_isolation, v4_parity_gate_execution_binding]
    resource_kind: normal_payload
    lifecycle: v4.pipeline.mainline
    owner_crate: routecodex-v4-runtime
    owner_node: V4HubReqInbound03Normalized
    owner_symbols: [ProtocolParse, Normalize, InputValidate, Governance]
    identity: [requestId, endpoint]
    allowed_writers: [V4HubReqInbound03Normalized, V4HubReqChatProcess04Governed]
    allowed_readers: [V4HubReqChatProcess04Governed, V4HubReqOutbound05ProviderSemantic]
    forbidden_writers: [V4ControlMetadataCenter, V4DebugSnapshotLedger, V4HubRespOutbound04ClientSemantic, V4ServerFrame]
    may_enter_provider_body: true
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.request.provider_semantic
    axis: data
    verification_gate: [v4_parity_gate_plane_isolation]
    resource_kind: provider_semantic
    lifecycle: v4.pipeline.mainline
    owner_crate: routecodex-v4-runtime
    owner_node: V4HubReqOutbound05ProviderSemantic
    owner_symbols: [SemanticProjection]
    identity: [requestId, targetId, providerId, modelId]
    allowed_writers: [V4HubReqOutbound05ProviderSemantic]
    allowed_readers: [V4ProviderReqCompat06Compat]
    forbidden_writers: [V4ControlMetadataCenter, V4Router, V4DebugSnapshotLedger]
    may_enter_provider_body: true
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.request.provider_wire_payload
    axis: data
    verification_gate: [v4_parity_gate_plane_isolation]
    resource_kind: provider_wire
    lifecycle: v4.pipeline.mainline
    owner_crate: routecodex-v4-runtime
    owner_node: V4ProviderReqCompat06Compat
    owner_symbols: [WireBuild]
    identity: [requestId, providerId, providerType, modelId]
    semantic_contract:
      control_fields_forbidden: true
      protocol_metadata_forbidden: true
      secret_handle_only: true
    allowed_writers: [V4ProviderReqCompat06Compat]
    allowed_readers: [V4ProviderSseOut07WireBoundary]
    forbidden_writers: [V4ControlMetadataCenter, V4HubReqChatProcess04Governed, V4Router, V4DebugSnapshotLedger, V4ScopeRegistry]
    may_enter_provider_body: true
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.response.provider_raw
    axis: data
    verification_gate: [v4_parity_gate_plane_isolation]
    resource_kind: provider_response
    lifecycle: v4.pipeline.mainline
    owner_crate: routecodex-v4-runtime
    owner_node: V4ProviderSseIn01FrameBoundary
    owner_symbols: [RawParse]
    identity: [requestId, providerId, statusCode]
    allowed_writers: [V4ProviderSseIn01FrameBoundary]
    allowed_readers: [V4HubRespInbound02Parsed, V4Error01SourceRaised]
    forbidden_writers: [V4ControlMetadataCenter, V4HubRespOutbound04ClientSemantic, V4DebugSnapshotLedger]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.response.normal_payload
    axis: data
    verification_gate: [v4_parity_gate_plane_isolation]
    resource_kind: normal_payload
    lifecycle: v4.pipeline.mainline
    owner_crate: routecodex-v4-runtime
    owner_node: V4HubRespInbound02Parsed
    owner_symbols: [ProtocolDecode]
    identity: [requestId, endpoint]
    allowed_writers: [V4HubRespInbound02Parsed, V4HubRespChatProcess03Governed]
    allowed_readers: [V4HubRespChatProcess03Governed, V4HubRespOutbound04ClientSemantic]
    forbidden_writers: [V4ControlMetadataCenter, V4DebugSnapshotLedger, V4ProviderReqCompat06Compat]
    may_enter_provider_body: false
    may_enter_client_body: true
    binding_status: anchored
  - resource_id: v4.response.client_wire_payload
    axis: data
    verification_gate: [v4_parity_gate_plane_isolation]
    resource_kind: client_wire
    lifecycle: v4.pipeline.mainline
    owner_crate: routecodex-v4-runtime
    owner_node: V4HubRespOutbound04ClientSemantic
    owner_symbols: [FrameBuild]
    identity: [requestId, endpoint, streamIntent]
    semantic_contract:
      control_fields_forbidden: true
      error_projection_only: V4Error06ClientProjected
    allowed_writers: [V4HubRespOutbound04ClientSemantic, V4ServerRespOutbound06ClientFrame]
    allowed_readers: [V4ServerFrame]
    forbidden_writers: [V4ControlMetadataCenter, V4DebugSnapshotLedger, V4ProviderReqCompat06Compat]
    may_enter_provider_body: false
    may_enter_client_body: true
    binding_status: anchored
  # ---------------- control plane ----------------
  - resource_id: v4.control.side_channel
    axis: control
    verification_gate: [v4_parity_gate_plane_isolation, v4_control_l2_regression]
    resource_kind: control_carrier
    lifecycle: v4.pipeline.mainline
    owner_crate: routecodex-v4-control
    owner_node: V4Control01ScopeBoundCarrier
    owner_symbols: [ControlSignal, PayloadGate]
    identity: [requestId, pipelineId, port, sessionScope]
    semantic_contract:
      carrier_fields: [requestId, pipelineId, port, sessionScope]
      never_normal_payload: true
      never_provider_wire: true
      never_client_wire: true
    allowed_writers: [V4Control01ScopeBoundCarrier, V4ControlMetadataCenter, V4Router, V4ErrorChain]
    allowed_readers: [V4HubReqChatProcess04Governed, V4Router, V4ErrorChain, V4ScopeRegistry]
    forbidden_writers: [V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic, V4ServerFrame, V4DebugSnapshotLedger]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.control.metadata_center
    axis: control
    verification_gate: [v4_control_l2_regression, v4_parity_gate_plane_isolation]
    resource_kind: metadata_center_control_signal
    lifecycle: v4.control.metadata_center
    owner_crate: routecodex-v4-control
    owner_node: V4MetadataCenter01ScopeRegistry
    owner_symbols: [MetadataCenter, ControlSignal]
    identity: [requestId, pipelineId, port, sessionScope, controlKey]
    state_machine_required: true
    semantic_contract:
      register_consume_release: required
      scope_isolation: request/pipeline/port/session/conversation
      control_signals_only: true
      client_protocol_metadata_passthrough: true
      cross_closed_loop_reuse: forbidden
    allowed_writers: ["V4MetadataCenter01ScopeRegistry::register", "V4MetadataCenter01ScopeRegistry::consume", "V4MetadataCenter01ScopeRegistry::release"]
    allowed_readers: [V4HubReqChatProcess04Governed, V4Router, V4ErrorChain, V4StoplessControlState, V4ScopeRegistry]
    forbidden_writers: [V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic, V4ServerFrame, V4DebugSnapshotLedger]
    forbidden_readers: [V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic, V4DebugSnapshotRestore]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.control.route_facts
    axis: control
    verification_gate: [v4_parity_gate_plane_isolation]
    resource_kind: control_contract
    lifecycle: v4.router.mainline
    owner_crate: routecodex-v4-runtime
    owner_node: V4Router05RequestClassified
    owner_symbols: [ExecutionPlan]
    identity: [serverId, entryProtocol, clientModel, capabilities, inputTokens]
    semantic_contract:
      route_signals_only: true
      payload_patch: forbidden
      capability_mismatch_projection: forbidden
    allowed_writers: [V4Router05RequestClassified]
    allowed_readers: [V4Router06SelectionPlan]
    forbidden_writers: [V4HubReqChatProcess04Governed, V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic, V4DebugSnapshotLedger]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.control.target_selection
    axis: control
    verification_gate: [v4_parity_gate_plane_isolation]
    resource_kind: control_contract
    lifecycle: v4.router.mainline
    owner_crate: routecodex-v4-runtime
    owner_node: V4Router06SelectionPlan
    owner_symbols: [ExecutionPlan]
    identity: [requestId, serverId, routeGroupId, poolId, orderedOpaqueTargets]
    semantic_contract:
      opaque_target: true
      health_mutation: forbidden
      provider_specific_branch: forbidden
    allowed_writers: [V4Router06SelectionPlan, V4Target07OpaqueTarget]
    allowed_readers: [V4HubReqOutbound05ProviderSemantic, V4Error04RouterPolicyApplied]
    forbidden_writers: [V4HubReqChatProcess04Governed, V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.control.route_exit
    axis: control
    verification_gate: [v4_parity_gate_plane_isolation]
    resource_kind: control_contract
    lifecycle: v4.router.mainline
    owner_crate: routecodex-v4-runtime
    owner_node: V4Router07RouteDecisionExit
    owner_symbols: [ExecutionPlan]
    identity: [requestId, serverId, decision, targetId, poolId, reason]
    semantic_contract:
      vr_decision_owner_only: true
      error_center_route_operation: forbidden
      payload_patch: forbidden
      original_payload_immutable: true
      switch_cooldown_reroute_same_cycle: true
    allowed_writers: [V4Router07RouteDecisionExit]
    allowed_readers: [V4HubReqOutbound05ProviderSemantic, V4Error04RouterPolicyApplied]
    forbidden_writers: [V4HubReqChatProcess04Governed, V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.control.route_policy_live
    axis: control
    verification_gate: [v4_parity_gate_plane_isolation]
    resource_kind: control_contract
    lifecycle: v4.router.mainline
    owner_crate: routecodex-v4-router
    owner_node: V4Router08LivePolicyOverride
    owner_symbols: [V4Router08LivePolicyOverride, LivePolicyOverride, PolicyVersion]
    identity: [serverId, routeGroupId, policyVersion, scope]
    semantic_contract:
      live_update_allowed: true
      baseline_from_manifest: true
      audit_required: true
      payload_patch: forbidden
      immutable_history: true
    allowed_writers: [V4Router08LivePolicyOverride]
    allowed_readers: [V4Router06SelectionPlan]
    forbidden_writers: [V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic, V4HubReqChatProcess04Governed]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.control.availability
    axis: control
    verification_gate: [v4_parity_gate_plane_isolation]
    resource_kind: control_state
    lifecycle: v4.provider.availability
    owner_crate: routecodex-v4-provider
    owner_node: V4Availability01SessionScoped
    owner_symbols: [V4Availability01SessionScoped, AvailabilityRecord, AvailabilityState]
    identity: [serverId, routingGroup, sessionId, providerRuntimeIdentity]
    semantic_contract:
      session_scoped: true
      process_global_cooldown_truth: forbidden
      router_health_write: forbidden
    allowed_writers: ["V4Availability01SessionScoped::record"]
    allowed_readers: [V4Target07OpaqueTarget, V4Error04RouterPolicyApplied]
    forbidden_writers: [V4Router, V4HubReqChatProcess04Governed, V4ServerFrame]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.control.error_chain
    axis: control
    verification_gate: [v4_error_l2_regression, v4_parity_gate_plane_isolation]
    resource_kind: side_channel
    lifecycle: v4.error.mainline
    owner_crate: routecodex-v4-error
    owner_node: V4Error01SourceRaised
    owner_symbols: [ErrorChain]
    identity: [requestId, targetId, providerId, errorStage]
    chain: [V4Error01SourceRaised, V4Error02HostCaptured, V4Error03RuntimeClassified, V4Error04RouterPolicyApplied, V4Error05ExecutionDecision, V4Error06ClientProjected]
    semantic_contract:
      single_direction: true
      message_only_projection: forbidden
      provider_local_retry_policy: forbidden
      fallback: forbidden
    allowed_writers: [V4Error01SourceRaised, V4Error02HostCaptured, V4Error03RuntimeClassified, V4Error04RouterPolicyApplied, V4Error05ExecutionDecision, V4Error06ClientProjected]
    allowed_readers: [V4Target07OpaqueTarget, V4ServerFrame, V4Error06ClientProjected]
    forbidden_writers: [V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic, V4HubReqChatProcess04Governed]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.control.error_center
    axis: control
    verification_gate: [v4_error_l2_regression, v4_error_compile_fail_regression]
    resource_kind: control_contract
    lifecycle: v4.error.mainline
    owner_crate: routecodex-v4-error
    owner_node: V4ErrorCenter02ClassifyAudit
    owner_symbols: [ErrorCenter]
    identity: [requestId, pipelineId, errorStage, errorCode]
    semantic_contract:
      intake_only: true
      classify_and_audit: true
      route_decision_owner: v4.control.route_exit
      provider_local_retry_policy: forbidden
      fallback: forbidden
      original_payload_immutable: true
      payload_hash_and_typed_context_only: true
      intake_stage: V4Error02HostCaptured
      intake_fields_non_empty: [payload_hash, typed_context]
      classification_witness: opaque_fact_lineage_bound_single_use
    allowed_writers: [V4Error01SourceRaised, V4ErrorCenter02ClassifyAudit]
    allowed_readers: [V4Router07RouteDecisionExit, V4Error04RouterPolicyApplied]
    forbidden_writers: [V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic, V4ServerFrame]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.lifecycle.payload_cycle
    axis: control
    verification_gate: [v4_parity_gate_plane_isolation]
    resource_kind: control_contract
    lifecycle: v4.pipeline.request_cycle
    owner_crate: routecodex-v4-runtime
    owner_node: V4PayloadCycleRegistry
    owner_symbols: [PayloadCycleRegistry, PayloadCycle]
    identity: [requestId, pipelineId, originalRequestHash]
    semantic_contract:
      cycle_start: request_sent
      cycle_success_terminal: response_entered_client
      cycle_success_terminal_boundary: next_request_sent
      cycle_error_terminal: error_terminal_only
      switch_cooldown_reroute: same_cycle_merged
      original_payload_mutation: forbidden
    allowed_writers: ["V4PayloadCycleRegistry::open", "V4PayloadCycleRegistry::merge_retry", "V4PayloadCycleRegistry::close_success", "V4PayloadCycleRegistry::close_error"]
    allowed_readers: [V4Router07RouteDecisionExit, V4ErrorCenter02ClassifyAudit]
    forbidden_writers: [V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.pipeline.mainline
    axis: control
    verification_gate: [v4_parity_gate_plane_isolation, v4_parity_gate_execution_binding]
    resource_kind: runtime_execution_locus
    lifecycle: v4.pipeline.mainline
    owner_crate: routecodex-v4-runtime
    owner_node: V4Runtime01MainlineKernel
    owner_symbols: [SkeletonRuntime, ExecutionContext, NodePluginPlan]
    identity: [requestId, pipelineId, skeletonVersion, planHash]
    semantic_contract:
      live_runtime_input_only: true
      debug_module_switch_input: forbidden
      dry_run_input: forbidden
      snapshot_replay_input: forbidden
    allowed_writers: [V4Runtime01MainlineKernel]
    allowed_readers: [V4Runtime01MainlineKernel]
    forbidden_writers: [V4Debug12ModuleSwitch, V4Debug13DryRunChain, V4Debug01SnapshotLedger, V4Debug02BusSubscription, V4Debug03SnapshotSubscription]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.error.client_projection
    axis: control
    verification_gate: [v4_error_l2_regression, v4_parity_gate_plane_isolation]
    resource_kind: side_channel
    lifecycle: v4.error.mainline
    owner_crate: routecodex-v4-error
    owner_node: V4Error06ClientProjected
    owner_symbols: [ClientProjection]
    identity: [status, code, message]
    semantic_contract:
      client_visible_fields: [code, message]
      internal_control_fields: forbidden
    allowed_writers: [V4Error06ClientProjected]
    allowed_readers: [V4ServerFrame]
    forbidden_writers: [V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic]
    may_enter_provider_body: false
    may_enter_client_body: true
    binding_status: anchored
  - resource_id: v4.control.retry_policy
    axis: control
    verification_gate: [v4_error_l2_regression]
    resource_kind: control_contract
    lifecycle: v4.error.mainline
    owner_crate: routecodex-v4-error
    owner_node: V4Error04RouterPolicyApplied
    owner_symbols: [RetryPolicy]
    identity: [policyId, providerScope, matcher, actionClass, reasonCode]
    semantic_contract:
      consumed_by_execution_decision_only: true
      provider_local_retry: forbidden
      cooldown_persistence: forbidden
    allowed_writers: [V4Error04RouterPolicyApplied]
    allowed_readers: [V4Error05ExecutionDecision]
    forbidden_writers: [V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic, V4HubReqChatProcess04Governed]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.scope.session
    axis: control
    verification_gate: [v4_parity_gate_execution_binding, v4_parity_gate_plane_isolation]
    resource_kind: control_scope
    lifecycle: v4.control.scope
    owner_crate: routecodex-v4-runtime
    owner_node: V4ScopeRegistry
    owner_symbols: [ScopeRegistry]
    identity: [requestId, pipelineId, port, sessionScope, conversationScope]
    semantic_contract:
      bind_release_required: true
      cross_session_reuse: forbidden
      entry_protocol_locked: true
      continuation_owner_locked: true
    allowed_writers: ["V4ScopeRegistry::bind", "V4ScopeRegistry::release"]
    allowed_readers: [V4Control01ScopeBoundCarrier, V4ControlMetadataCenter, V4StoplessControlState]
    forbidden_writers: [V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic, V4ServerFrame, V4DebugSnapshotLedger]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.control.stopless_state
    axis: control
    verification_gate: [v4_parity_gate_plane_isolation, v4_parity_gate_capability_isolation]
    resource_kind: metadata_center_control_signal
    lifecycle: v4.control.stopless
    owner_crate: routecodex-v4-runtime
    owner_node: V4StoplessControlState
    owner_symbols: [V4StoplessControlState, StoplessFacts, StoplessError]
    identity: [entryEndpoint, sessionId, conversationId, port, routingGroup]
    state_machine_required: true
    semantic_contract:
      current_turn_protocol_projection: { req04_injection: allowed_registered_only, resp03_stripping: allowed_matching_provenance_only }
      history_mutation: forbidden
      continuation_immutable_interval_semantics: forbidden
    allowed_writers: ["V4StoplessControlState::store_for_scope", "V4StoplessControlState::clear_for_scope"]
    allowed_readers: [V4HubReqChatProcess04Governed, V4HubRespChatProcess03Governed]
    forbidden_writers: [V4ProviderReqCompat06Compat, V4HubRespOutbound04ClientSemantic, V4ServerFrame, V4DebugSnapshotLedger]
    forbidden_readers: [V4HubRespOutbound04ClientSemantic, V4ServerFrame, V4DebugSnapshotRestore]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  # ---------------- config / artifact / secret / debug ----------------
  - resource_id: v4.config.authoring
    axis: information
    verification_gate: [v4_config_l2_regression]
    resource_kind: config_authoring
    lifecycle: v4.config.compile
    owner_crate: routecodex-v4-config
    owner_node: V4Config01AuthoringFileSource
    owner_symbols: [V4Config01AuthoringFileSource]
    identity: [configPath, configVersion]
    allowed_writers: [V4Config01AuthoringFileSource]
    allowed_readers: [V4Config02AuthoringParsed]
    forbidden_writers: [routecodex-v4-runtime, routecodex-v4-server, routecodex-v4-provider, routecodex-v4-router]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.config.parsed
    axis: information
    verification_gate: [v4_config_l2_regression]
    resource_kind: config_information
    lifecycle: v4.config.compile
    owner_crate: routecodex-v4-config
    owner_node: V4Config02AuthoringParsed
    owner_symbols: [V4Config02AuthoringParsed, parse_v4_config_02_from_v4_config_01]
    identity: [configVersion, sourceHash]
    allowed_writers: [parse_v4_config_02_from_v4_config_01]
    allowed_readers: [validate_v4_config_03_from_v4_config_02]
    forbidden_writers: [routecodex-v4-runtime, routecodex-v4-server, routecodex-v4-provider]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.config.schema_validated
    axis: information
    verification_gate: [v4_config_l2_regression]
    resource_kind: config_information
    lifecycle: v4.config.compile
    owner_crate: routecodex-v4-config
    owner_node: V4Config03SchemaValidated
    owner_symbols: [V4Config03SchemaValidated, validate_v4_config_03_from_v4_config_02]
    identity: [configVersion, scopeHash]
    allowed_writers: [validate_v4_config_03_from_v4_config_02]
    allowed_readers: [build_v4_config_04_from_v4_config_03]
    forbidden_writers: [routecodex-v4-runtime, routecodex-v4-server, routecodex-v4-provider]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.config.resource_registry
    axis: information
    verification_gate: [v4_config_l2_regression]
    resource_kind: config_information
    lifecycle: v4.config.compile
    owner_crate: routecodex-v4-config
    owner_node: V4Config04ResourceRegistryBuilt
    owner_symbols: [V4Config04ResourceRegistryBuilt, build_v4_config_04_from_v4_config_03]
    identity: [configVersion, resourceIds]
    allowed_writers: [build_v4_config_04_from_v4_config_03]
    allowed_readers: [publish_v4_config_05_from_v4_config_04]
    forbidden_writers: [routecodex-v4-runtime, routecodex-v4-server, routecodex-v4-provider]
    may_enter_provider_body: false
    may_enter_client_body: false
    binding_status: anchored
  - resource_id: v4.config.manifest
    axis: information
    verification_gate: [v4_config_l2_regression]
    resource_kind: config_manifest
    lifecycle: v4.config.compile
    owner_crate: routecodex-v4-config
