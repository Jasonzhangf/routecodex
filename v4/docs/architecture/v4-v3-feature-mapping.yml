  - v4/docs/architecture/v4-v3-abstraction-coverage.yml
  - v4/docs/architecture/v3-v4-semantic-parity-map.yml
  - v4/contracts/pipeline-abstraction.contract.json
notes: |
  特征级抽象覆盖（machine truth）：V3 function map 的全部 feature（当前 64 条）
  必须逐条映射到六轴模型的至少一个 operator_kind 与一条 chain（节点 slot），
  GAP=0 才能进入实现（v4-pipeline-abstraction-model.md 完整性门槛 2）。
  operator_kind 词汇表唯一来自 v4-v3-abstraction-coverage.yml 的 kind_rules；
  chain 唯一来自 pipeline-abstraction.contract.json operator_schema.chains
  （request/response/error/config/lifecycle/diagnostic）。
  status=mapped 表示抽象层 operator 注册已建立（不表示 V4 已实现）；
  status=gap 表示尚无 operator 映射，机器 gate 禁止 gap>0。
  `v3-feature-baseline.json` 是独立冻结锚：v3 function map 的 feature 集合
  必须与基线全等；四源一致删 feature 而不改基线会触发 gate FAIL
  （协调塌缩盲区已由红测 11/11 锁定）。
coverage:
  features: {total: 64, mapped: 64, gap: 0}
