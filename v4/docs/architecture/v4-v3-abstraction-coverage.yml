  operator_kind。axis 分类规则见 v4-pipeline-abstraction-model.md；本文件是
  ABS-GATE-01（v3_resource_coverage）的唯一真源，由
  v4_parity_gate_v3_resource_coverage 机器 gate 校验：
  - 覆盖 V3 resource map 全部 103 条，无缺失、无额外、无重复；
  - 每条 axis ∈ {information, data, control, diagnostic}，operator_kind 非空，
    status 不等于 unclassified；
  - 每条 axis/operator_kind 必须命中 kind_rules 的 kind 级规则；
  - 轴计数必须与 pipeline-abstraction.contract.json evaluation 声明一致
    （information 23 / data 22 / control 44 / diagnostic 14 = 103）。
