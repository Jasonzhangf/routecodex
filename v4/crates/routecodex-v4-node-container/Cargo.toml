[package]
name = "routecodex-v4-node-container"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "routecodex-v4-node-container-host"
path = "src/bin/host_binding.rs"

[dependencies]
routecodex-v4-cordis-bridge = { path = "../routecodex-v4-cordis-bridge" }
routecodex-v4-plugin-plan = { path = "../routecodex-v4-plugin-plan" }
routecodex-v4-plugin-contract = { path = "../routecodex-v4-plugin-contract" }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[dev-dependencies]
routecodex-v4-plugin-contract = { path = "../routecodex-v4-plugin-contract" }
