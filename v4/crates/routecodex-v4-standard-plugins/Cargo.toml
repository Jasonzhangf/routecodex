[package]
name = "routecodex-v4-standard-plugins"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
routecodex-v4-cordis-bridge = { path = "../routecodex-v4-cordis-bridge" }
routecodex-v4-plugin-catalog = { path = "../routecodex-v4-plugin-catalog" }
routecodex-v4-plugin-contract = { path = "../routecodex-v4-plugin-contract" }
routecodex-v4-plugin-plan = { path = "../routecodex-v4-plugin-plan" }
routecodex-v4-provider = { path = "../routecodex-v4-provider" }
routecodex-v4-skeleton = { path = "../routecodex-v4-skeleton" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
routecodex-v4-node-container = { path = "../routecodex-v4-node-container" }

[[test]]
name = "l2_all_plugin_catalog_red"
path = "tests/l2_all_plugin_catalog_red.rs"
