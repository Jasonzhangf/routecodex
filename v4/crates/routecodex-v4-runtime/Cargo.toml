[package]
name = "routecodex-v4-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
routecodex-v4-base-node = { path = "../routecodex-v4-base-node" }
routecodex-v4-control = { path = "../routecodex-v4-control" }
routecodex-v4-error = { path = "../routecodex-v4-error" }
routecodex-v4-plugin-contract = { path = "../routecodex-v4-plugin-contract" }
routecodex-v4-skeleton = { path = "../routecodex-v4-skeleton" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
