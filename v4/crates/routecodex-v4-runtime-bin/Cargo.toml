[package]
name = "routecodex-v4-runtime-bin"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "rccv4"
path = "src/main.rs"

[dependencies]
routecodex-v4-base-node = { path = "../routecodex-v4-base-node" }
routecodex-v4-error = { path = "../routecodex-v4-error" }
routecodex-v4-provider = { path = "../routecodex-v4-provider" }
routecodex-v4-router = { path = "../routecodex-v4-router" }
routecodex-v4-runtime = { path = "../routecodex-v4-runtime" }
routecodex-v4-server = { path = "../routecodex-v4-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
