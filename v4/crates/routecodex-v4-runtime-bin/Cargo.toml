[package]
name = "routecodex-v4-runtime-bin"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "rccv4"
path = "src/main.rs"

[dependencies]
routecodex-v4-base-node = { path = "../routecodex-v4-base-node" }
routecodex-v4-cli = { path = "../routecodex-v4-cli" }
routecodex-v4-cordis-bridge = { path = "../routecodex-v4-cordis-bridge" }
routecodex-v4-config = { path = "../routecodex-v4-config" }
routecodex-v4-error = { path = "../routecodex-v4-error" }
routecodex-v4-lifecycle = { path = "../routecodex-v4-lifecycle" }
routecodex-v4-node-container = { path = "../routecodex-v4-node-container" }
routecodex-v4-plugin-plan = { path = "../routecodex-v4-plugin-plan" }
routecodex-v4-provider = { path = "../routecodex-v4-provider" }
routecodex-v4-router = { path = "../routecodex-v4-router" }
routecodex-v4-runtime = { path = "../routecodex-v4-runtime" }
routecodex-v4-skeleton = { path = "../routecodex-v4-skeleton" }
routecodex-v4-server = { path = "../routecodex-v4-server" }
routecodex-v4-servertool = { path = "../routecodex-v4-servertool" }
routecodex-v4-standard-plugins = { path = "../routecodex-v4-standard-plugins" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
