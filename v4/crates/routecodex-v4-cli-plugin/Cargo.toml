[package]
name = "routecodex-v4-cli-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rccv4-plugin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
routecodex-v4-standard-plugins = { path = "../routecodex-v4-standard-plugins" }
