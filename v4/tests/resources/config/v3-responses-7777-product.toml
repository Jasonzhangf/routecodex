source = "v3-baseline:responses_v3_7777"

default_error_path = [
  { step = "wait_retry", retry_mode = "retry_same", max_attempts = 3, backoff_ms = 0 },
  { step = "cooldown", scope = "provider_model", duration_ms = 900000, provider_global_failure = false },
  { step = "project", status = 503, reason_code = "provider_failure", message_mode = "code_only" },
]

[[error_policies]]
policy_id = "account_http_401_two_errors"
match_status = 401
reason_code = "provider_account_http_401"
[[error_policies.actions]]
step = "wait_retry"
retry_mode = "reselect_before_client_projection"
max_attempts = 2
backoff_ms = 1000
[[error_policies.actions]]
step = "cooldown"
scope = "auth_key"
duration_ms = 3600000
[[error_policies.actions]]
step = "project"
status = 502
message_mode = "code_only"

[[error_policies]]
policy_id = "account_http_403_two_errors"
match_status = 403
reason_code = "provider_account_http_403"
[[error_policies.actions]]
step = "wait_retry"
retry_mode = "reselect_before_client_projection"
max_attempts = 2
backoff_ms = 1000
[[error_policies.actions]]
step = "cooldown"
scope = "auth_key"
duration_ms = 3600000
[[error_policies.actions]]
step = "project"
status = 502
message_mode = "code_only"

[[error_policies]]
policy_id = "glmrelay_openai_cpu_overloaded_200"
scope_provider_id = "glmrelay_anthropic"
match_status = 200
match_content_contains_any = ["system cpu overloaded"]
reason_code = "provider_system_cpu_overloaded"
[[error_policies.actions]]
step = "wait_retry"
retry_mode = "reselect_before_client_projection"
max_attempts = 2
backoff_ms = 1000
[[error_policies.actions]]
step = "project"
status = 502
public_code = "upstream_overloaded"
message_mode = "code_only"

[[error_policies]]
policy_id = "glmrelay_openai_invalid_field_type_200"
scope_provider_id = "glmrelay_anthropic"
match_status = 200
match_content_contains_any = ["Type invalid, should be set"]
reason_code = "provider_invalid_field_type"
[[error_policies.actions]]
step = "project"
status = 400
public_code = "provider_invalid_field_type"
message_mode = "code_only"

