version = "2.0.0"
providerId = "glmrelay_anthropic"

[provider]
id = "glmrelay_anthropic"
enabled = true
type = "anthropic"
baseURL = "https://open.bigmodel.cn/api/anthropic"
defaultModel = "glm-5.2"
compatibilityProfile = "chat:anthropic"

[provider.auth]
type = "apikey"
entries = [{ alias = "key1", secretFile = "/Volumes/extension/.rcc/secrets/v3/opencode-go.conf", secretKey = "glmrelay.key1" }]

[provider.models."glm-5.2"]
supportsStreaming = true
supportsThinking = true
capabilities = ["text", "reasoning", "tools", "web_search", "longcontext"]
