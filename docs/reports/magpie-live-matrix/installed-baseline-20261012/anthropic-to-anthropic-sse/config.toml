version = 3

[servers.loopback]
bind = "127.0.0.1"
port = 56745
endpoints = ["openai_chat", "responses", "anthropic", "gemini"]

[servers.loopback.execution]
allowed_modes = ["direct"]
allowed_invocation_sources = ["client", "servertool_followup", "dry_run"]
allowed_transports = ["json", "sse"]


[servers.loopback.routes.default]
tiers = [[{ use = "mock-anthropic/mock.anthropic-model" }]]
