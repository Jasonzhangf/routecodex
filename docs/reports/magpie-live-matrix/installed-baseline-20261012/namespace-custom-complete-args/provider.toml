version = "2.0.0"
providerId = "mock-openai_chat"

[provider]
id = "mock-openai_chat"
enabled = true
type = "openai_chat"
baseURL = "http://127.0.0.1:57089/v1"
defaultModel = "chat-model"

[provider.auth]
type = "apikey"
apiKey = "fake-loopback-token"

[provider.models."mock.chat-model"]
wireName = "chat-model"
capabilities = ["text", "tools", "reasoning", "multimodal"]
supportsStreaming = true
