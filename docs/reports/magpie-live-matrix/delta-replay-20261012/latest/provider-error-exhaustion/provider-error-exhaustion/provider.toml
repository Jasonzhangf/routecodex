version = "2.0.0"
providerId = "mock-chat"

[provider]
id = "mock-chat"
enabled = true
type = "openai_chat"
baseURL = "http://127.0.0.1:57321/v1"
defaultModel = "unavailable-model"

[provider.auth]
type = "apikey"
apiKey = "fake-loopback-token"

[provider.models."mock.unavailable-model"]
wireName = "unavailable-model"
capabilities = ["text", "tools", "reasoning", "multimodal"]
supportsStreaming = true
