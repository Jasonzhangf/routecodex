- chain_id: v3.global_binary_install
  owner_feature_id: v3.global_binary_install
  summary: The isolated Cargo build embeds the RouteCodex version, atomically publishes one Rust binary to the user bin directory, then creates same-directory command aliases without release snapshots.
  edges:
  - step_id: v3-install-01
    from_node: V3Install01SourceVersionResolved
    to_node: V3Install02RustBinaryBuilt
    caller_symbol: buildV3Cli
    caller_file: scripts/install-v3-cli.mjs
    callee_symbol: runInterruptibleCommand
    callee_file: scripts/install-v3-cli.mjs
    status: anchored
    owner_feature_id: v3.global_binary_install
    semantic_contract:
      - buildV3Cli passes ROUTECODEX_BUILD_VERSION into the Cargo invocation through runInterruptibleCommand.
      - The compiled Rust CLI resolves that embedded value at runtime without requiring adjacent package.json.
    resource_flow:
      consumes: []
      produces: [v3.global_binary_install]
      side_channel_reads: []
      side_channel_writes: []
  - step_id: v3-install-02
    from_node: V3Install02RustBinaryBuilt
    to_node: V3Install03DirectBinaryPublished
    caller_symbol: main
    caller_file: scripts/install-v3-cli.mjs
    callee_symbol: copyExecutableAtomic
    callee_file: scripts/install-v3-cli.mjs
    status: anchored
    owner_feature_id: v3.global_binary_install
    semantic_contract:
      - Exactly one executable is atomically published to ~/.local/bin/rccv3 and hash-verified.
      - No install/current or install/releases tree is created.
    resource_flow:
      consumes: [v3.global_binary_install]
      produces: [v3.global_binary_install]
      side_channel_reads: []
      side_channel_writes: []
  - step_id: v3-install-03
    from_node: V3Install03DirectBinaryPublished
    to_node: V3Install04CommandAliasesPublished
    caller_symbol: main
    caller_file: scripts/ensure-cli-command-shim.mjs
    callee_symbol: installDirectNativeCommand
    callee_file: scripts/ensure-cli-command-shim.mjs
    status: anchored
    owner_feature_id: v3.global_binary_install
    semantic_contract:
      - routecodex and rcc resolve only to the same-directory direct rccv3 executable.
      - Command resolution has no release-snapshot or repository fallback.
    resource_flow:
      consumes: [v3.global_binary_install]
      produces: [v3.global_binary_install]
      side_channel_reads: []
      side_channel_writes: []
- chain_id: v3.target.session_global_selection
  owner_feature_id: v3.virtual_router_target_interpreter
  summary: Target09 candidate sets become Target10 concrete providers through one session-first selection owner shared by Direct planning, Direct pre-send revalidation, initial Relay resolution, and Relay failure reselection.
  edges:
  - step_id: v3-rd-target-select-direct-plan
    from_node: V3Target09CandidateSetExpanded
    to_node: V3Target10ConcreteProviderSelected
    caller_symbol: plan_v3_responses_protocol_execution_with_provider_health
    caller_file: v3/crates/routecodex-v3-runtime/src/kernel/direct_protocol_plan.rs
    callee_symbol: select_v3_target_with_session_then_global
    callee_file: v3/crates/routecodex-v3-runtime/src/provider_failure_runtime_policy.rs
    status: anchored
    owner_feature_id: v3.virtual_router_target_interpreter
    semantic_contract:
      - Initial Direct planning selects from the captured Target09 set using session availability before global availability.
      - Request-local exclusions are empty before the first provider attempt.
    resource_flow:
      consumes: [v3.target.candidate_set, v3.provider.availability_projection]
      produces: [v3.target.concrete_provider]
      side_channel_reads: [v3.provider.availability_projection]
      side_channel_writes: [v3.target.concrete_provider]
  - step_id: v3-rd-target-select-direct-kernel
    from_node: V3Target09CandidateSetExpanded
    to_node: V3Target10ConcreteProviderSelected
    caller_symbol: execute_v3_responses_direct_runtime_kernel_core
    caller_file: v3/crates/routecodex-v3-runtime/src/kernel.rs
    callee_symbol: select_v3_target_with_session_then_global
    callee_file: v3/crates/routecodex-v3-runtime/src/provider_failure_runtime_policy.rs
    status: anchored
    owner_feature_id: v3.virtual_router_target_interpreter
    semantic_contract:
      - Direct kernel revalidates a preplanned target and every request-local reselection against current session availability before provider transport.
      - Global availability is selectable only when no nonfailed session alternative remains; failed candidate identities come from the request-local Error03 action state.
    resource_flow:
      consumes: [v3.target.candidate_set, v3.provider.availability_projection, v3.error.action_plan]
      produces: [v3.target.concrete_provider]
      side_channel_reads: [v3.provider.availability_projection, v3.error.action_plan]
      side_channel_writes: [v3.target.concrete_provider]
  - step_id: v3-rd-target-select-relay-initial
    from_node: V3Target09CandidateSetExpanded
    to_node: V3Target10ConcreteProviderSelected
    caller_symbol: resolve_v3_relay_target_outcome
    caller_file: v3/crates/routecodex-v3-runtime/src/provider_failure_runtime_policy.rs
    callee_symbol: select_v3_target_with_session_then_global
    callee_file: v3/crates/routecodex-v3-runtime/src/provider_failure_runtime_policy.rs
    status: anchored
    owner_feature_id: v3.virtual_router_target_interpreter
    semantic_contract:
      - Initial Relay resolution selects from Target09 with session availability and the request-local exclusion set supplied by the owning runtime.
    resource_flow:
      consumes: [v3.target.candidate_set, v3.provider.availability_projection, v3.error.action_plan]
      produces: [v3.target.concrete_provider]
      side_channel_reads: [v3.provider.availability_projection, v3.error.action_plan]
      side_channel_writes: [v3.target.concrete_provider]
  - step_id: v3-rd-target-select-relay-reselection
    from_node: V3Target09CandidateSetExpanded
    to_node: V3Target10ConcreteProviderSelected
    caller_symbol: reselect_from_captured_target_plan
    caller_file: v3/crates/routecodex-v3-runtime/src/provider_failure_runtime_policy.rs
    callee_symbol: select_v3_target_with_session_then_global
    callee_file: v3/crates/routecodex-v3-runtime/src/provider_failure_runtime_policy.rs
    status: anchored
    owner_feature_id: v3.virtual_router_target_interpreter
    semantic_contract:
      - Relay failure handling expands only the captured route plan and reselects from Target09 without Router reentry.
      - Error03 request-local exclusions prevent reuse of a failed provider candidate.
    resource_flow:
      consumes: [v3.target.candidate_set, v3.provider.availability_projection, v3.error.action_plan]
      produces: [v3.target.concrete_provider]
      side_channel_reads: [v3.provider.availability_projection, v3.error.action_plan]
      side_channel_writes: [v3.target.concrete_provider]
