  - npm run verify:v3-rust-only
  - npm run verify:v3-module-boundaries
  build:
  - npm run install:v3
  notes:
  - No flag disables persistence regardless of config; --snap authorizes Relay only;
    --snapall authorizes Relay and Direct; blank stage selectors are rejected.
  - Server persists only Debug-redacted/budgeted copies, captures live Direct JSON/SSE
    without changing transport semantics, propagates filesystem scan/write/eviction
    failures, and retains at most 100 request directories per endpoint/port.
  - Live closure requires final no-flag restart after controlled --snap and --snapall
    replays.
