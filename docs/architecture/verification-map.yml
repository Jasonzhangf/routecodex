  contract:
  - docs/goals/v3-codex-sample-retention-snap-scope-test-design.md
  - docs/architecture/v3-function-map.yml
  - docs/architecture/v3-mainline-call-map.yml
  - docs/architecture/v3-resource-operation-map.yml
  - docs/architecture/v3-verification-map.yml
  integration:
  - cargo +stable test --manifest-path v3/Cargo.toml -p routecodex-v3-cli --test managed_lifecycle
  - cargo +stable test --manifest-path v3/Cargo.toml -p routecodex-v3-server --test
    multi_listener_server responses_direct_full_snap_scope_persists_live_json_and_sse_responses
  - cargo +stable test --manifest-path v3/Cargo.toml -p routecodex-v3-server --test
    multi_listener_server responses_direct_relay_only_snap_scope_writes_no_codex_sample
  smoke:
  - npm run verify:v3-debug-payload-budget
  - npm run test:v3-debug-payload-budget-red-fixtures
  - npm run verify:v3-resource-map
  - npm run verify:v3-mainline-caller-flow
  - npm run verify:function-map-compile-gate
