- feature_id: hub.chat_process_responses_continuation
  change_risk: high
  unit:
  - v3/crates/routecodex-v3-runtime/src/hub_v1/relay_request.rs
  - v3/crates/routecodex-v3-runtime/src/hub_v1/req_chat_process_04_governed.rs
  - v3/crates/routecodex-v3-runtime/src/hub_v1/resp_continuation_04_committed.rs
  - v3/crates/routecodex-v3-runtime/src/hub_v1/resp_outbound_05_client_semantic.rs
  - v3/crates/routecodex-v3-runtime/src/hub_v1/server_resp_outbound_06_client_frame.rs
  contract:
  - v3/crates/routecodex-v3-runtime/tests/hub_relay_request_semantics.rs
  - v3/crates/routecodex-v3-runtime/tests/hub_relay_tool_servertool_multiturn_parity.rs
  - v3/crates/routecodex-v3-runtime/tests/responses_relay_local_continuation_integration.rs
  - scripts/architecture/verify-responses-continuation-immutable-boundary.mjs
  - scripts/tests/responses-continuation-immutable-boundary-red-fixtures.mjs
  integration:
  - v3/crates/routecodex-v3-runtime/tests/responses_relay_local_continuation_integration.rs
  smoke:
  - npm run verify:responses-history-protocol-contract
  - npm run verify:responses-relay-continuation-writer-uniqueness
  - npm run verify:responses-continuation-immutable-boundary
  - npm run test:responses-continuation-immutable-boundary-red-fixtures
  - npm run verify:v3-relay-tool-servertool-multiturn-parity-closeout
  - npm run test:v3-relay-tool-servertool-multiturn-parity-closeout-red-fixtures
  - npm run verify:v3-module-boundaries
  - npm run verify:v3-mainline-caller-flow
  build:
  - npm run verify:v3-architecture-ci
  notes:
  - Validation must prove this continuation block is `/v1/responses`-only and is skipped
    by chat/messages/non-responses protocol paths.
  - 'Responses continuation is a Chat Process boundary block: request restore runs
    after `HubReqInbound02Standardized` and before `HubReqChatProcess03Governed`;
    response save runs after `HubRespChatProcess03Governed` and before `HubRespOutbound04ClientSemantic`.'
  - Req/Resp inbound and outbound are normalization/projection-only nodes; all continuation,
    tool governance, and semantic recovery must happen in Chat Process before save/restore.
  - 'Validation must prove the save->restore interval is immutable: no handler, bridge,
    req_inbound, resp_outbound, SSE, or store helper may clean, convert, reorder,
    patch, or otherwise mutate saved request/response history between canonical save
    and canonical restore.'
  - Validation must prove `MetadataCenter.continuation_context.responsesResume` selects
    the materialized Chat Process payload for repeated submit_tool_outputs capture,
    preserves model/base payload across rounds, and never replaces it with the raw
    HTTP tool_outputs body; non-Responses entrypoints must not capture this continuation
    state.
  - Validation must prove cross-boundary control state is carried by MetadataCenter
    families, not by request/response payload or history fields.
  - Tests must lock current-request explicit evidence, owner resolution, canonical
    restore, stopless CLI result restore, response schema judgment/projection, post-projection
    canonical save, stale transient request-id clearing, and released retained state.
  - 'Tests must lock response save request-id priority: the current active provider
    request label passed to the Rust record planner wins over stale `requestTruth.requestId`
    after request-executor rebind.'
  - 'Tests and residue gates must lock the complete Rust record effect contract: entryKind,
    continuationOwner, allowScopeContinuation, and optional scope/provider/route fields
    reach store IO unchanged; TS object reconstruction or field filtering must fail.'
  - Runtime-state effect tests must pair a valid object/null path with malformed array/scalar
    rejection in Rust; residue gates must reject TS `asRecord(runtimeStateWrite)`
    coercion or any malformed-to-null compatibility path.
  - SSE tests are not continuation gates. `handler-response-sse.ts` must not contain
    continuation probe, required_action detection, terminal repair, save/restore,
    tool injection, or stopless schema logic.
  - Handler response-store integration tests are stale continuation-owner evidence
    if they expect `sendPipelineResponse` or SSE transport to save continuation; migrate
    those assertions to bridge/Rust owner tests instead of reintroducing handler-side
    save logic.
