schema_version: 1
contract_id: v3.operation_runner.field_profiles
status: design_only_runtime_binding_pending
owner_feature_id: v3.unified_operation_runner_design
source_inventory: docs/architecture/reviews/v3-protocol-semantic-field-matrix.yml
implementation_truth: v3.operation_runner.field_operator_library
matrix_inventory: docs/architecture/reviews/v3-protocol-semantic-field-matrix.yml
production_baseline_authority: v3/crates/routecodex-v3-runtime/tables
coverage_rule: no path may be consumed by two operators in the same direction; unknown business fields and unmatched value shapes remain opaque with their original path, value, and inverse association. Duplicate operator ownership and invalid configuration fail compile, never an individual business request.
runtime_failure_class_rule: failure_class describes actual operator execution faults only; an unknown, conflicting, or unrepresentable business value takes the opaque preservation path and cannot trigger that class by itself.
business_unmatched_value:
  operator: routecodex.v3.field.lossless_preserve@1
  value_owner: chat_extension_opaque_record
  inverse_reference_owner: typed_request_inverse_context_or_response_provenance
  preserve: original_path_value_encoding_and_inverse_association
  admission: continue_request_or_response
  projection: return_to_same_client_protocol_without_semantic_rewrite
request_inverse_contract:
  owner: routecodex.v3.operation.normalize_request_losslessly@1
  forward_direction: client_request_to_chat
  inverse_method: inverse_to_entry
  inverse_operator: routecodex.v3.field.inverse_to_entry_from_provenance@1
  configuration_source: same_protocol_path_row_and_operator_as_forward
  context_content: typed_path_encoding_identity_and_inverse_association_only
  unknown_value_source: canonical_chat_extension_opaque_record
  admission: every_configured_forward_request_operator_must_declare_inverse_to_entry_at_compile
  output: typed_inverse_projection_reference_and_provenance_only; no request inverse view is authorized as a second normalization owner for current Direct or Relay consumers
  forbidden_reuse: [chat_to_provider, chat_to_client_response]
binding_contract:
  identity: one normalized protocol+path row may be consumed at most once per direction across standard and extension inventories
  row_shape:
    required_keys:
      - protocol
      - section
      - path
      - params
      - parent_owned
    allowed_source_inventories:
      - standard
      - extended_openai_chat_semantic_superset
    parent_owned_rule: |
      A structure_only row sets parent_owned true and owns the subtree structurally;
      it MUST NOT declare consumers. Child rows under a structure_only parent set
      parent_owned false and may declare their own leaf consumer only for an explicitly
      classified leaf such as an opaque tool payload path. No path may be consumed twice
      in the same direction.
    typed_discriminator_rule: |
      A Responses raw path record that is read differently by item type or content part
      type MUST declare typed_discriminator_cases. Each case carries one or more
      conjunctive predicates; every predicate names an exact raw source_inventory path and
      either an exact value or missing/present state. Branch cases stay inside the single
      raw path record; they are not repeated profile rows and do not create new raw paths.
      source_inventory is the only field existence authority; shape_children and branch
      cases cannot authorize a path that is not in the authoritative source inventory.
    responses_raw_item_type_rule: |
      Responses request/response item type values such as `message`, `function_call`,
      `custom_tool_call`, `function_call_output`, and `custom_tool_call_output` are
      values on the raw item `type` path. They are NOT object subpaths such as
      `request.input[].function_call.call_id` or `request.input[].function_call_output.call_id`. Raw
      field paths are the item object members (`request.input[].role`,
      `request.input[].call_id`, ...), and each row's typed_discriminator_cases maps
      which type_value branches may own that same object member for requesting and
      inverse projection. Any descendant path that is not in source_inventory stays
      unauthorized even if a union parent lists it in shape_children or a consumer row
      declares it.
  opaque_tool_payload_rule: |
    request/response tool `arguments` and `input` are opaque complete values. They are
    explicitly classified in field_walker.opaque_tool_payload_paths and consumed only by
    routecodex.v3.field.opaque_tool_payload@1. tool_identity_context and identity
    operators may record a typed path/encoding reference but MUST NOT consume the
    business arguments/input value.
  static_vs_runtime:
    static_config: operator, protocol, section, path, shape, semantics, transform_id, collision_policy, failure_class
    runtime_injected: typed control resources passed by the fixed runner, never serialized into payload
    forbidden_runtime_injected: request_origin_kind, invocationId, lease identity, and inverse provenance must never be serialized into request, response, provider, or client bodies, history values, protocol metadata, or debug snapshots
  typed_operator_profiles:
    routecodex.v3.field.lossless_preserve@1:
      client_request_to_chat:
        shape: enum(object,array,array_item,leaf,opaque_complete_value,inverse_projection,fold_merge,unrepresentable)
        semantics: enum(preserve_field,identity_preserve,extended_semantic)
        failure_class: enum(598,599)
      chat_to_provider:
        shape: enum(object,array,array_item,leaf,opaque_complete_value,inverse_projection,fold_merge,unrepresentable)
        semantics: enum(preserve_field,identity_preserve,extended_semantic)
        failure_class: enum(598,599)
