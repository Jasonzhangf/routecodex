    - id: v3.operation_runner.arc.execution_plan
      schema: Object
    - id: v3.operation_runner.arc.governed_request
      schema: Object
    - id: v3.operation_runner.arc.standard_provider_request
      schema: Object
    - id: v3.operation_runner.arc.compatible_provider_request
      schema: Object
    - id: v3.operation_runner.arc.provider_wire
      schema: Object
    - id: v3.operation_runner.arc.transport_request
      schema: Object
    - id: v3.operation_runner.arc.provider_raw
      schema: Object
    - id: v3.operation_runner.arc.compatible_provider_response
      schema: Object
    - id: v3.operation_runner.arc.canonical_response
      schema: Object
    - id: v3.operation_runner.arc.governed_response
      schema: Object
    - id: v3.operation_runner.arc.client_semantic_response
      schema: Object
    - id: v3.operation_runner.arc.client_frame
      schema: Object
    - id: v3.operation_runner.arc.source_failure
      schema: Object
    - id: v3.operation_runner.arc.error_source
