field_walker:
  owner: routecodex-v3-runtime
  registry_owner: v3.operation_runner.field_operator_library
  schema_registry_owner: v3.operation_runner.arc_schema_registry
  traversal: one exhaustive walk per direction, including nested object members and array items
  container_rule: container paths consume ownership of their child paths once; a leaf path is never consumed by both its container operator and a second leaf operator
  shape_contract:
    structure_only_shapes: [object, array, array_item]
    structure_only_shape_rule: |
      A structure_only row owns an actual container subtree and MUST declare
      params.shape as object, array, or array_item. A structure_only row that is
      also a scalar/object union (union_shape true) declares params.shape
      enum(leaf,object|array|array_item...) with at least one leaf branch and at
      least one concrete container branch proven by codec evidence, one
      scalar_consumer per applicable direction, and every shape_children leaf
      row that exists in the same protocol inventory, including descendant item
      sections such as request.input[] when the top-level field row lives under
      request_fields.
    union_shape_rule: |
      A union_shape row MUST set structure_only true, parent_owned true,
      scalar_consumer with a registered field operator for each applicable
      direction, and shape_children listing every child leaf row that consumes
      the object/array branch. Child rows MUST have parent_owned false, MUST
      start with the union parent path, and MUST NOT be consumed by the parent
      scalar_consumer. A union_shape row MAY declare one null_behavior:
      enum(preserve_null). null_behavior is
      not an operator param. A null value remains an original business value;
      current codec rejection or null-to-empty coercion is a defect to repair,
      not an accepted golden for the unified walker.
    object_shape_rule: |
      `[]` denotes an array-item segment only and never satisfies an object
      branch. A union_shape parent that declares an object container branch
      MUST list each object raw child path directly under the parent (no `[]`
      in that segment) in shape_children and path_consumers. The parent
      scalar_consumer is the shape branch discriminator only; it MUST NOT
      consume the object container or any child field.
    leaf_consumed_once_rule: |
      A scalar leaf MUST be consumed by exactly one registered field operator in
      each applicable direction. An object/array leaf value under a container is
      consumed by exactly one registered child row in each applicable direction.
    null_behavior_values: [preserve_null]
  tool_arguments_rule: tool `arguments`/`input` are opaque complete values, visited as one path and not parsed as JSON for mapping or field traversal
  opaque_tool_payload_paths:
    - protocol: responses
      section: input_fields
      path: request.input[].arguments
    - protocol: responses
      section: input_fields
      path: request.input[].input
    - protocol: responses
      section: input_fields
      path: request.input[].output
    - protocol: responses
      section: output_fields
      path: response.output[].arguments
    - protocol: responses
      section: output_fields
      path: response.output[].output
    - protocol: responses
      section: output_fields
      path: response.output[].input
    - protocol: openai_chat
      section: message_fields
      path: request.messages[].tool_calls[].function.arguments
    - protocol: openai_chat
      section: message_fields
      path: request.messages[].tool_calls[].custom.input
    - protocol: anthropic
      section: content_block_fields
      path: request.messages[].content[].input
    - protocol: anthropic
      section: content_block_fields
      path: request.messages[].content[].content
    - protocol: anthropic
      section: response_fields
      path: response.content[].input
    - protocol: anthropic
      section: response_fields
      path: response.content[].content
    - protocol: gemini
      section: content_part_fields
      path: request.contents[].parts[].functionCall.args
    - protocol: gemini
      section: content_part_fields
      path: request.contents[].parts[].functionResponse.response
    - protocol: gemini
      section: content_part_fields
      path: request.contents[].parts[].toolCall.args
    - protocol: gemini
      section: content_part_fields
      path: request.contents[].parts[].codeExecutionResult.output
    - protocol: gemini
      section: generation_config_fields
      path: request.generationConfig.responseSchema
    - protocol: gemini
      section: generation_config_fields
      path: request.generationConfig.responseJsonSchema
    - protocol: openai_chat_extension
      section: extended_superset
      path: request.messages.parts_items.tool_call.args
    - protocol: openai_chat_extension
      section: extended_superset
      path: request.messages_items.content_items.bash_code_execution_tool_result.content
    - protocol: openai_chat_extension
      section: extended_superset
      path: request.messages_items.content_items.code_execution_tool_result.content
    - protocol: openai_chat_extension
      section: extended_superset
      path: request.messages_items.content_items.text_editor_code_execution_tool_result.content
    - protocol: openai_chat_extension
      section: extended_superset
      path: request.messages_items.content_items.tool_search_tool_result.content
    - protocol: openai_chat_extension
      section: extended_superset
      path: request.messages_items.content_items.web_fetch_tool_result.content
    - protocol: openai_chat_extension
      section: extended_superset
      path: request.messages_items.content_items.web_search_tool_result.content
    - protocol: openai_chat_extension
      section: extended_superset
      path: request.messages[].tool_result.output
    - protocol: openai_chat_extension
      section: extended_superset
      path: response.tool_result.output
    - protocol: openai_chat_extension
      section: extended_superset
      path: response.output_items.custom_tool_call.input
  receipt_contract:
    fields:
      - path
      - direction
      - protocol
      - consumer_operator@version
      - fold_input_paths
      - finalize_operator@version
      - implementation_status
      - error_disposition
  error_contract:
    unknown_business_field: preserve opaque original path and value with inverse association
    unmatched_business_shape: preserve opaque original value and continue request or response
    duplicate_operator_ownership: compile failure before runtime admission
    missing_required_configuration: compile failure before runtime admission
    unrepresentable_request: preserve original path, value, and encoding in chat_extension_opaque_record; request inverse context stores only its typed reference and same-request association
    unrepresentable_response: preserve original path, value, and encoding in chat_extension_opaque_record; response provenance stores only its typed reference for client inverse projection
    external_status: preserve real external status
    local_projection_or_wire: never mutates provider health
directions:
  - id: client_request_to_chat
    consumer_operator: routecodex.v3.field.lossless_preserve@1
    params:
      failure_class: enum(598)
      semantics: enum(preserve_field)
  - id: chat_to_provider
    consumer_operator: routecodex.v3.field.standard_projection@1
    params:
      shape: leaf
      failure_class: enum(598)
      semantics: enum(preserve_field)
  - id: provider_response_to_chat
    consumer_operator: routecodex.v3.field.provider_normalization@1
    params:
      failure_class: enum(599)
      semantics: enum(preserve_field)
  - id: chat_to_client_response
    consumer_operator: routecodex.v3.field.inverse_client_projection@1
    params:
      failure_class: enum(599)
      semantics: enum(preserve_field)
extension_fields:
  contract: the semantic matrix extended_openai_chat_semantic_superset is the unique coverage owner
  rule: every extended field with direction request is consumed once by routecodex.v3.field.lossless_preserve@1 and once by routecodex.v3.field.standard_projection@1; every extended field with direction response is consumed once by routecodex.v3.field.provider_normalization@1 and once by routecodex.v3.field.inverse_client_projection@1
  duplicate_rule: |
    The standard `path_consumers` row is the consumption truth for any path that
    exists in the standard protocol inventory. An `extension_path_consumers` row
    with the same normalized protocol+path is an inventory alias only: it records
    the extended-superset provenance and must not declare a second consumer.
    A path present only in the extended inventory is consumed once by the
    extension row.
  status_rule: rows retain their matrix current_impl status; design does not relabel partial, extension_declared, shape_branch_gap, codec_shape_only, semantic_declared, or edge_only as covered
