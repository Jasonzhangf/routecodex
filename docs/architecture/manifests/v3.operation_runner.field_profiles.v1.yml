  - operator admission by non-empty description
  - unregistered fold transform
  - control truth carried in request/response/metadata/provider wire
field_operator_library:
  owner: routecodex-v3-runtime
  description: |
    The unique static reusable operator library that supplies the transformation
    implementation truth for the field walker. Per-protocol config supplies only
    explicit source-path -> registered field_operator@version + typed parameters.
    Stage consumer names from the DAGpipe graphs are NOT field operators and MUST
    NOT be referenced from path bindings. Each library entry binds an operator
    role, typed parameters, and the direction families the operator may serve.
  direction_roles:
    client_request_to_chat: field_operator
    chat_to_provider: field_operator
    provider_response_to_chat: field_operator
    chat_to_client_response: field_operator
  registered_at: operator_registry.field_operators
  typed_param_contract:
    required_keys:
      - shape
    allowed_shapes:
      - object
      - array
      - array_item
      - leaf
      - opaque_complete_value
      - inverse_projection
      - fold_merge
      - unrepresentable
    parameter_value_kind: typed_string_or_resource_or_number
arc_schema_registry:
  owner: routecodex-v3-runtime
  description: |
    Project-owned ARC schema registry that resolves every graph schema_ref to a
    concrete DAGpipe SDK ValueType. The gate validates each schema_ref against
    this registry. Only the source-request and client-json raw JSON ARC pair may
    use Any, because HTTP accepts any syntactically valid JSON value before the
    protocol owner decides whether its shape is valid. The schema id MUST
    match the schema_ref used in the DAGpipe graphs and node outputs.
  allowed_value_types:
    - Any
    - null
    - Boolean
    - Number
    - String
    - Array
    - ArrayOf
    - Object
  schemas:
    - id: v3.operation_runner.arc.source_request
      schema: Any
    - id: v3.operation_runner.arc.client_json
      schema: Any
    - id: v3.operation_runner.arc.canonical_request
