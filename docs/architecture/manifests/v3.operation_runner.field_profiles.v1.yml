fold_contract:
  fold_operator_admission: exact operator@version registered in compile()
  required_fields:
    - operator
    - operator_version
    - input_paths
    - params
    - finalize_operator
    - finalize_position
  forbidden:
    - multiple finalize operators in one direction
    - unknown operator or version
    - untyped parameters
    - cross-protocol codec/wire mix that bypasses the shared walker
  registered_folds:
    - operator: routecodex.v3.field.fold_role_developer_to_system
      operator_version: "1"
      direction: chat_to_provider
      input_paths:
        - request.messages[].role
      params:
        fold_kind: enum(role_developer_to_system)
        target_protocol: enum(anthropic,openai_chat,responses)
      finalize_operator: routecodex.v3.field.fold_finalize@1
      finalize_position: enum(after_all_fold_input_paths)
    - operator: routecodex.v3.field.fold_role_system_to_developer
      operator_version: "1"
      direction: provider_response_to_chat
      input_paths:
        - response.choices[].message.role
      params:
        fold_kind: enum(role_system_to_developer)
        target_protocol: enum(anthropic,openai_chat,responses)
      finalize_operator: routecodex.v3.field.fold_finalize@1
      finalize_position: enum(after_all_fold_input_paths)
