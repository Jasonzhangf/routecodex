lifecycle_id: vr.hit_log_projection.mainline
summary: "Virtual Router hit-log diagnostics: host effects collect the route
  decision context, runtime host calls Rust/NAPI hit-log projection directly,
  and host emits the formatted diagnostic line without owning formatting or
  telemetry semantics."
owner_feature_id: vr.route_host_effects
entrypoint:
  node_id: VrHitLog01RouteDecision
  wiki_page: null
  call_map_chain_id: vr.hit_log_projection.mainline
node_ids:
  - VrHitLog01RouteDecision
  - VrHitLog02NativeProjection
  - VrHitLog03HostEmission
  - VrHitLog04TelemetryProjection
edges:
  - step_id: vrh-01
    from_node: VrHitLog01RouteDecision
    to_node: VrHitLog02NativeProjection
    status: anchored
    owner_feature_id: vr.route_host_effects
    binding_pending: null
    split_binding_id: null
    resource_flow:
      consumes:
        - route.selection
        - metadata.runtime_control
      produces:
        - vr.hit_log_record
      side_channel_reads:
        - route.selection
        - metadata.runtime_control
      side_channel_writes: []
  - step_id: vrh-02
    from_node: VrHitLog02NativeProjection
    to_node: VrHitLog03HostEmission
    status: anchored
    owner_feature_id: vr.route_host_effects
    binding_pending: null
    split_binding_id: null
    resource_flow:
      consumes:
        - vr.hit_log_record
      produces:
        - vr.hit_log_record
      side_channel_reads: []
      side_channel_writes: []
  - step_id: vrh-03
    from_node: VrHitLog02NativeProjection
    to_node: VrHitLog04TelemetryProjection
    status: anchored
    owner_feature_id: vr.hit_log_projection
    binding_pending: null
    split_binding_id: null
    resource_flow:
      consumes:
        - vr.hit_log_record
        - metadata.runtime_control
      produces:
        - vr.telemetry_projection
      side_channel_reads:
        - metadata.runtime_control
      side_channel_writes: []
verification:
  required_gates:
    - npm run verify:architecture-mainline-call-map
    - npm run verify:architecture-mainline-manifest-sync
