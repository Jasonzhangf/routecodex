version: 1
lifecycle_id: v3.direct_sse_accept_skeleton.mainline
owner_feature_id: v3.direct_sse_accept_skeleton
commit_contract_owner_feature_id: v3.responses_direct_full_attempt_commit
status: source_controlled_runtime_pending_live_replay
implementation_symbols:
  - V3FrontSseAcceptSkeleton
  - v3_request_wants_sse
supporting_callers:
  - pending_endpoint_after_responses_admission
  - execute_responses_direct_server_outcome
entrypoint:
  node_id: V3DirectSseAccept01ClientChannel
  call_map_chain_id: v3.direct_sse_accept_skeleton
nodes:
  - V3DirectSseAccept01ClientChannel
  - V3DirectSseAccept02RuntimeWorker
  - V3DirectSseAccept03ProjectedClientFrame
edges:
  - step_id: v3-direct-sse-accept-skeleton-01
    from_node: V3DirectSseAccept01ClientChannel
    to_node: V3DirectSseAccept02RuntimeWorker
    owner_feature_id: v3.direct_sse_accept_skeleton
    status: anchored
    contract: client SSE headers and transport-only keepalive are established before provider execution completes
  - step_id: v3-direct-sse-accept-skeleton-02
    from_node: V3DirectSseAccept02RuntimeWorker
    to_node: V3DirectSseAccept03ProjectedClientFrame
    owner_feature_id: v3.direct_sse_accept_skeleton
    status: anchored
    contract: only the existing Direct or Relay runtime client projection or typed Error06 terminal frame is forwarded; provider raw SSE and reparsed HTTP JSON are never forwarded
supporting_edges:
  - step_id: v3-direct-sse-accept-skeleton-intent-01
    caller: pending_endpoint_after_responses_admission
    caller_file: v3/crates/routecodex-v3-server/src/endpoint_handlers.rs
    callee: v3_request_wants_sse
    callee_file: v3/crates/routecodex-v3-server/src/lib.rs
  - step_id: v3-direct-sse-accept-skeleton-intent-02
    caller: execute_responses_direct_server_outcome
    caller_file: v3/crates/routecodex-v3-server/src/responses_direct_server_outcome.rs
    callee: v3_request_wants_sse
    callee_file: v3/crates/routecodex-v3-server/src/lib.rs
commit_contract:
  client_transport_accept: may establish the HTTP/SSE channel and transport-only keepalive before provider completion
  client_semantic_commit: forbidden until one provider attempt has a complete, protocol-valid terminal event
  attempt_buffer: provider projected frames remain runtime-owned and are not exposed to the client while the attempt is pending
  failed_attempt_disposition: discard the failed attempt buffer, enter Error01 -> Error03 -> Error04 -> Error05, and reselect within the same request
return_path:
  precommit_provider_failure: Error01 -> Error03 -> Error04 -> Error05 -> reselect; client semantic channel remains uncommitted
  replacement_success: only the complete replacement attempt crosses V3DirectSseAccept03ProjectedClientFrame; no mixed-provider prefix is allowed
  candidate_exhaustion: Error06 client projection; no partial provider attempt is exposed
  inner_non_sse_contract_violation: internal response-stage Error01 -> Error06; Front never reparses HTTP JSON to infer provider or control state
  unexpected_post_commit_failure: only transport/client disconnect after semantic commit; provider failure after commit is forbidden by this lifecycle
forbidden_paths:
  - provider raw SSE -> client
  - direct accept layer -> provider semantic parser
  - direct accept layer -> routing
  - direct accept layer -> health
  - direct accept layer -> continuation
  - feature -> replacement of V3DirectSseAccept01ClientChannel
  - feature -> replacement of V3DirectSseAccept02RuntimeWorker
  - front -> protocol selection from request-stage execution plan
  - front -> HTTP JSON payload reparsing to reconstruct Error06 or provider state
canonical_docs:
  - docs/architecture/wiki/v3-direct-sse-accept-skeleton.md
  - docs/goals/v3-sse-transport-json-semantic-decoupling-audit.md
  - docs/architecture/v3-resource-operation-map.yml
  - docs/architecture/v3-function-map.yml
  - docs/architecture/v3-mainline-call-map.yml
  - docs/architecture/v3-verification-map.yml
verification_gates:
  - npm run verify:v3-direct-sse-accept-skeleton
  - npm run verify:v3-direct-sse-full-attempt-commit
  - cargo test --manifest-path v3/Cargo.toml -p routecodex-v3-runtime --lib direct_sse_guard_rejects_typed_responses_shape_before_client_commit -- --nocapture
  - cargo test --manifest-path v3/Cargo.toml -p routecodex-v3-runtime --lib direct_sse_full_attempt_commit -- --nocapture
  - cargo test --manifest-path v3/Cargo.toml -p routecodex-v3-server --lib direct_sse_http_projection_injects_keepalive_and_preserves_provider_bytes -- --nocapture
  - npm run verify:sse-architecture-boundary
  - git diff --check
