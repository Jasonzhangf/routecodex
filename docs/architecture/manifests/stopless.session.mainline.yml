lifecycle_id: stopless.session.mainline
summary: "Stopless three-round contract inside Chat Process boundary: every
  managed relay request injects stopless system guidance plus exactly one
  provider-facing/model-visible internal reasoningStop tool, Round-1/2 missing
  or invalid stops project a client-visible no-input CLI, the next provider
  request receives only a StoplessCenter state-machine-selected complete
  non-persistent ordinary user continuation guideline plus the fresh tool
  contract, and guard terminal stops without another CLI projection."
owner_feature_id: hub.servertool_stopless_cli_continuation
entrypoint:
  node_id: StoplessResp01StopDetected
  wiki_page: docs/architecture/wiki/stopless-session-mainline-source.md
  call_map_chain_id: stopless.session.mainline
node_ids:
