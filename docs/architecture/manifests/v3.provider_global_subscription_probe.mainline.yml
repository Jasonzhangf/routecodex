lifecycle_id: v3.provider_global_subscription_probe
entrypoint: spawn_v3_server_aggregate
return_path: V3ProviderHealthStore
owner_feature: v3.provider_global_subscription_probe
listener_isolation:
  identity: [server_id, bind, port]
  construction: V3ProviderFailureRuntimeHealth::from_manifest_for_listener
  routing_and_probe_handle: same_listener_handle
  aggregate_custody: all_listener_owners
  legacy_multiport_load: forbidden_without_port_origin
  canonical_graph: docs/architecture/dagpipe/graphs/provider-listener-health.graph.json
canonical_docs:
  - docs/goals/v3-provider-error-disposition-path-config-plan.md
  - docs/architecture/v3-resource-operation-map.yml
verification_gates:
  - npm run test:v3-port-local-provider-health
  - node scripts/run-v3-cargo-test.mjs -p routecodex-v3-error --lib
  - node scripts/run-v3-cargo-test.mjs -p routecodex-v3-provider-responses --test provider_global_subscription_probe_contract -- --nocapture
  - node scripts/run-v3-cargo-test.mjs -p routecodex-v3-server --test cooldown_manual_actions_managed -- --test-threads=1 --nocapture
  - node scripts/run-v3-cargo-test.mjs -p routecodex-v3-server --test fa22072_exec_probe_rollback -- --nocapture
  - node scripts/run-v3-cargo-test.mjs -p routecodex-v3-cli --test managed_lifecycle fa22072_probe_rollback -- --test-threads=1 --nocapture
  - node scripts/run-v3-cargo-test.mjs -p routecodex-v3-server --test fa22072_probe_fairness -- --nocapture
  - node scripts/run-v3-cargo-test.mjs -p routecodex-v3-runtime --lib provider_probe_fairness_tests -- --nocapture
  - node scripts/run-v3-cargo-test.mjs -p routecodex-v3-server --no-default-features
  - node scripts/run-v3-cargo-test.mjs -p routecodex-v3-runtime --lib runtime_policy_maps_account_and_recoverable_http_classes_to_global_health -- --nocapture
  - node scripts/run-v3-cargo-test.mjs -p routecodex-v3-runtime --lib configured_semantic_global_failure_keeps_manifest_cooldown_policy -- --nocapture
  - node scripts/run-v3-cargo-test.mjs -p routecodex-v3-config --test config_v3_contract -- --nocapture
nodes:
  - id: V3ProviderHealthStore
    owner: routecodex-v3-provider-responses
  - id: V3ProviderHealthProbePermit
    owner: routecodex-v3-provider-responses
  - id: V3ServerAggregateLifecycle
    owner: routecodex-v3-server
  - id: V3ServerProbeOwner
    owner: routecodex-v3-server
  - id: V3ProviderGlobalProbeExecution
    owner: routecodex-v3-runtime
  - id: V3ProviderProbeHttpStatus
    owner: routecodex-v3-provider-responses
  - id: V3ProviderGlobalSubscriptionFailureObservation
    owner: routecodex-v3-runtime
  - id: V3Error02Classified
    owner: routecodex-v3-error
  - id: V3Error01SourceRaised
    owner: routecodex-v3-error
  - id: V3ProviderFailureRuntimeHealth
    owner: routecodex-v3-runtime
  - id: V3ProviderProbeCancellationGuard
    owner: routecodex-v3-runtime
edges:
  - from: V3ProviderHealthStore
    to: V3ProviderHealthProbePermit
  - from: V3ServerAggregateLifecycle
    to: V3ServerProbeOwner
  - from: V3ServerProbeOwner
    to: V3ProviderGlobalProbeExecution
  - from: V3ProviderGlobalProbeExecution
    to: V3ProviderProbeHttpStatus
  - from: V3ProviderGlobalProbeExecution
    to: V3ProviderHealthStore
  - from: V3ProviderProbeCancellationGuard
    to: V3ProviderHealthStore
  - from: V3ProviderGlobalSubscriptionFailureObservation
    to: V3ProviderHealthStore
  - from: V3Error02Classified
    to: V3ProviderHealthStore
  - from: V3Error01SourceRaised
    to: V3Error02Classified
  - from: V3ProviderFailureRuntimeHealth
    to: V3ProviderGlobalSubscriptionFailureObservation
