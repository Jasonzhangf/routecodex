budget_contract:
  per_attempt: required
  per_request: required
  process_global: required
  residence_or_deadline: required
  shared_residence_deadline_wait: required
  local_expiry_source: RuntimeFailure
  provider_health_on_local_expiry: forbidden
  ready_provider_result_over_timer: preserve_source
  reserve_before_append_or_copy: true
  provider_attempt_and_client_replay_share_request_budget: true
  server_budget_construction: forbidden
  initial_storage: bounded_memory_only
  disk_spill: forbidden
residence_deadline_wait_binding:
  status: source_bound
  owner:
    file: v3/crates/routecodex-v3-runtime/src/execution_control.rs
    owner_feature_id: v3.execution_attempt_budget_store
    symbol: V3AttemptBudget::wait_with_residence_deadline
    symbol_lines: 274-287
    source_blob: d7e95c705a504a3ee10c691f554cb82d7e070668
    visibility: crate_private_reader
    binding_state: source_bound
    source_truth: The absolute Instant is owned by the existing V3AttemptBudgetInner.deadline and read through residence_deadline(); no caller reconstructs it from payload, Debug, configuration, or a second wall-clock value.
    wait_contract: tokio::select! with biased consumes an already ready pending result first, then races the caller Provider attempt timeout against sleep_until(residence_deadline()).
    ready_result_contract: A ready real Provider success or failure result returns as Ok(output) and is never overwritten because the current time is later.
    expiry_contract: Only local timer expiry returns Err(V3AttemptStoreError::LocalResourceExhausted); each caller maps it to its existing Runtime Error variant before Provider failure policy.
    provider_contract: A real Provider result keeps its original typed source, attempt identity, and already legal cooldown effect.
    future_contract: Local expiry drops only the pending request-owned future; it does not cancel shared recovery or probe or another request.
  callers:
  - {boundary: headers, caller_symbol: send_v3_responses_direct_attempt, caller_file: v3/crates/routecodex-v3-runtime/src/kernel/direct_runtime_helpers_stream.rs, caller_lines: 39-44, caller_blob: f64ae2ea6394f9469ab3f1483379dfb7c15814b9, invoked_by: execute_v3_responses_direct_runtime_kernel_core_resident}
