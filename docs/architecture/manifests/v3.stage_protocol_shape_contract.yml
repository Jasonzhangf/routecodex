schema_version: 1
contract_id: v3.stage_protocol_shape_contract
status: active
owner_feature_id: v3.protocol_stage_shape_lock
canonical_docs:
  - docs/design/pipeline-type-topology-and-module-boundaries.md
  - docs/design/v3-protocol-request-field-projection.md
  - docs/architecture/v3-mainline-call-map.yml
rules:
  direct_same_protocol:
    protocol_identity: same_as_entry
    forbidden:
      - canonical_chat_conversion
      - routecodex_chat_extension
      - hub_request_codec
      - hub_response_codec
  relay_conversion_points:
    request_inbound: V3HubReqInbound02Normalized
    request_outbound: ProviderReqCompat06ProviderCompat
    response_inbound: V3HubRespInbound02Normalized
    response_outbound: V3HubRespOutbound05ClientSemantic
  control_fields:
    carrier: typed_side_channel_only
    forbidden_in_payload:
      - metadata_center
      - routeHint
      - providerKey
      - continuationOwner
      - stoplessCenter
      - requestCapabilities
      - __rt
      - _debug
shape_contracts:
  source_request_wire:
    protocol_identity: entry_protocol
    field_registry: docs/architecture/reviews/v3-protocol-semantic-field-matrix.yml
  canonical_chat_request:
    protocol_identity: chat
    field_registry: docs/architecture/manifests/v3.protocol_request_field_projection.yml
    extension_registry: registered_chat_extensions_only
    forbidden: [raw_source_payload, control_fields]
  provider_request_semantic:
    protocol_identity: selected_provider_protocol
    field_registry: docs/architecture/reviews/v3-protocol-semantic-field-matrix.yml
    forbidden: [routecodex_chat_extension, source_protocol_fields, control_fields]
  provider_request_wire:
    protocol_identity: selected_provider_protocol
    field_registry: docs/architecture/reviews/v3-protocol-semantic-field-matrix.yml
    forbidden: [routecodex_chat_extension, control_fields]
  provider_response_wire:
    protocol_identity: selected_provider_protocol
    field_registry: docs/architecture/reviews/v3-protocol-semantic-field-matrix.yml
    forbidden: [routecodex_chat_extension, control_fields]
  canonical_chat_response:
    protocol_identity: chat
    field_registry: docs/architecture/reviews/v3-protocol-semantic-field-matrix.yml
    forbidden: [raw_provider_payload, control_fields]
  client_response_semantic:
    protocol_identity: entry_protocol
    field_registry: docs/architecture/reviews/v3-protocol-semantic-field-matrix.yml
    forbidden: [routecodex_chat_extension, provider_fields, control_fields]
  same_protocol_request:
    protocol_identity: same_as_entry
    field_registry: docs/architecture/reviews/v3-protocol-semantic-field-matrix.yml
    forbidden: [routecodex_chat_extension, control_fields]
  same_protocol_response:
    protocol_identity: same_as_entry
    field_registry: docs/architecture/reviews/v3-protocol-semantic-field-matrix.yml
    forbidden: [routecodex_chat_extension, control_fields]
chains:
  - chain_id: v3.relay.request.stage_shapes
    execution_mode: relay
    mainline_step_ids: [v3-hub-req-01, v3-hub-req-02, v3-hub-req-03, v3-hub-req-04, v3-hub-req-05, v3-hub-req-06, v3-hub-req-07, v3-hub-req-08, v3-hub-req-09]
    stages:
      - { node_id: V3HubReqInbound01ClientRaw, entry_shape: source_request_wire, exit_shape: source_request_wire, validator_owner: build_v3_hub_req_inbound_01_client_raw, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/req_inbound_01_client_raw.rs, validator_input_types: [Value, V3HubEntryProtocol, V3HubInvocationSource, V3HubTransportIntent], validator_output_type: V3HubReqInbound01ClientRaw }
      - { node_id: V3HubReqInbound02Normalized, entry_shape: source_request_wire, exit_shape: canonical_chat_request, validator_owner: build_v3_hub_req_inbound_02_result_from_v3_hub_req_inbound_01, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/req_inbound_02_normalized.rs, validator_input_types: [V3HubReqInbound01ClientRaw], validator_output_type: 'Result<V3HubReqInbound02Normalized, String>' }
      - { node_id: V3HubReqContinuation03Classified, entry_shape: canonical_chat_request, exit_shape: canonical_chat_request, validator_owner: build_v3_hub_req_continuation_03_from_v3_hub_req_inbound_02, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/req_continuation_03_classified.rs, validator_input_types: [V3HubReqInbound02Normalized, V3HubContinuationOwnership], validator_output_type: V3HubReqContinuation03Classified }
      - { node_id: V3HubReqChatProcess04Governed, entry_shape: canonical_chat_request, exit_shape: canonical_chat_request, validator_owner: build_v3_hub_req_chat_process_04_from_v3_hub_req_continuation_03, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/req_chat_process_04_governed.rs, validator_input_types: [V3HubReqContinuation03Classified], validator_output_type: V3HubReqChatProcess04Governed }
      - { node_id: V3HubReqExecution05Planned, entry_shape: canonical_chat_request, exit_shape: canonical_chat_request, validator_owner: build_v3_hub_req_execution_05_from_v3_hub_req_chat_process_04, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/req_execution_05_planned.rs, validator_input_types: [V3HubReqChatProcess04Governed, V3HubExecutionMode], validator_output_type: V3HubReqExecution05Planned }
      - { node_id: V3HubReqTarget06Resolved, entry_shape: canonical_chat_request, exit_shape: canonical_chat_request, validator_owner: build_v3_hub_req_target_06_from_v3_hub_req_execution_05, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/req_target_06_resolved.rs, validator_input_types: [V3HubReqExecution05Planned, V3HubTargetResolution, 'routecodex_v3_target::V3TargetCandidate'], validator_output_type: V3HubReqTarget06Resolved }
      - { node_id: V3HubReqOutbound07ProviderSemantic, entry_shape: canonical_chat_request, exit_shape: canonical_chat_request, validator_owner: build_v3_hub_req_outbound_07_from_v3_hub_req_target_06, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/req_outbound_07_provider_semantic.rs, validator_input_types: [V3HubReqTarget06Resolved, V3HubProviderWireProtocol], validator_output_type: V3HubReqOutbound07ProviderSemantic }
      - { node_id: ProviderReqCompat06ProviderCompat, entry_shape: canonical_chat_request, exit_shape: provider_request_semantic, validator_owner: build_provider_req_compat_06_from_v3_hub_req_outbound_07, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/provider_req_compat_06_provider_compat.rs, validator_input_types: [V3HubReqOutbound07ProviderSemantic], validator_output_type: 'Result<ProviderReqCompat06ProviderCompat, V3ProviderCompatError>' }
      - { node_id: V3ProviderReqOutbound08WirePayload, entry_shape: provider_request_semantic, exit_shape: provider_request_wire, validator_owner: build_v3_provider_req_outbound_08_from_provider_req_compat_06, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/provider_req_outbound_08_wire_payload.rs, validator_input_types: [ProviderReqCompat06ProviderCompat], validator_output_type: V3ProviderReqOutbound08WirePayload }
      - { node_id: V3ProviderReqOutbound09TransportRequest, entry_shape: provider_request_wire, exit_shape: provider_request_wire, validator_owner: build_v3_provider_req_outbound_09_from_v3_provider_req_outbound_08, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/provider_req_outbound_09_transport_request.rs, validator_input_types: [V3ProviderReqOutbound08WirePayload], validator_output_type: V3ProviderReqOutbound09TransportRequest }
  - chain_id: v3.relay.response.stage_shapes
    execution_mode: relay
    mainline_step_ids: [v3-hub-resp-01, v3-hub-resp-02, v3-hub-resp-03, v3-hub-resp-04, v3-hub-resp-05, v3-hub-resp-06]
    stages:
      - { node_id: V3ProviderRespInbound01Raw, entry_shape: provider_response_wire, exit_shape: provider_response_wire, validator_owner: build_v3_provider_resp_inbound_01_raw_with_compat_profile, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/provider_resp_inbound_01_raw.rs, validator_input_types: [Value, V3ProviderRespInbound01RawContext], validator_output_type: V3ProviderRespInbound01Raw }
      - { node_id: ProviderRespCompat02ProviderCompat, entry_shape: provider_response_wire, exit_shape: provider_response_wire, validator_owner: build_provider_resp_compat_02_from_v3_provider_resp_inbound_01, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/provider_resp_compat_02_provider_compat.rs, validator_input_types: [V3ProviderRespInbound01Raw], validator_output_type: 'Result<ProviderRespCompat02ProviderCompat, V3ProviderCompatError>' }
      - { node_id: V3HubRespInbound02Normalized, entry_shape: provider_response_wire, exit_shape: canonical_chat_response, validator_owner: build_v3_hub_resp_inbound_02_from_provider_resp_compat_02, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/resp_inbound_02_normalized.rs, validator_input_types: [ProviderRespCompat02ProviderCompat], validator_output_type: V3HubRespInbound02Normalized }
      - { node_id: V3HubRespChatProcess03Governed, entry_shape: canonical_chat_response, exit_shape: canonical_chat_response, validator_owner: build_v3_hub_resp_chat_process_03_from_v3_hub_resp_inbound_02, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/resp_chat_process_03_governed.rs, validator_input_types: [V3HubRespInbound02Normalized], validator_output_type: V3HubRespChatProcess03Governed }
      - { node_id: V3HubRespContinuation04Committed, entry_shape: canonical_chat_response, exit_shape: canonical_chat_response, validator_owner: commit_v3_hub_relay_response, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/resp_continuation_04_committed.rs, validator_input_types: [V3HubRespChatProcess03Outcome], validator_output_type: 'Result<V3HubRespContinuation04Outcome, V3HubRelayResponseError>' }
      - { node_id: V3HubRespOutbound05ClientSemantic, entry_shape: canonical_chat_response, exit_shape: client_response_semantic, validator_owner: build_v3_hub_resp_outbound_05_from_v3_hub_resp_continuation_04_with_client_payload, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/resp_outbound_05_client_semantic.rs, validator_input_types: [V3HubRespContinuation04Committed, Value], validator_output_type: V3HubRespOutbound05ClientSemantic }
      - { node_id: V3ServerRespOutbound06ClientFrame, entry_shape: client_response_semantic, exit_shape: client_response_semantic, validator_owner: build_v3_server_resp_outbound_06_from_v3_hub_resp_outbound_05, validator_source: v3/crates/routecodex-v3-runtime/src/hub_v1/server_resp_outbound_06_client_frame.rs, validator_input_types: [V3HubRespOutbound05ClientSemantic], validator_output_type: V3ServerRespOutbound06ClientFrame }
  - chain_id: v3.direct.same_protocol.stage_shapes
    execution_mode: direct
    protocol_identity: same_as_entry
    mainline_step_ids: [v3-rd-10, v3-rd-11, v3-rd-12, v3-rd-13, v3-rd-14]
    stages:
      - { node_id: V3ResponsesDirect11Policy, entry_shape: same_protocol_request, exit_shape: same_protocol_request, validator_owner: responses_direct_route_hook, validator_source: v3/crates/routecodex-v3-runtime/src/hooks.rs, validator_input_types: [V3Target10ConcreteProviderSelected, '&V3Req04StandardizedResponses'], validator_output_type: V3ResponsesDirect11Policy }
      - { node_id: V3Provider12ResponsesWirePayload, entry_shape: same_protocol_request, exit_shape: same_protocol_request, validator_owner: responses_direct_request_projection_hook, validator_source: v3/crates/routecodex-v3-runtime/src/hooks.rs, validator_input_types: ['&V3ResponsesDirect11Policy'], validator_output_type: 'Result<V3Provider12ResponsesWirePayload, V3Error01SourceRaised>' }
      - { node_id: V3Transport13ResponsesHttpRequest, entry_shape: same_protocol_request, exit_shape: same_protocol_request, validator_owner: responses_direct_provider_transport_hook, validator_source: v3/crates/routecodex-v3-runtime/src/hooks.rs, validator_input_types: [V3Provider12ResponsesWirePayload], validator_output_type: 'Result<V3Transport13ResponsesHttpRequest, V3Error01SourceRaised>' }
      - { node_id: V3ProviderResp14Raw, entry_shape: same_protocol_response, exit_shape: same_protocol_response, validator_owner: V3ProviderResp14Raw::from_json, validator_source: v3/crates/routecodex-v3-provider-responses/src/raw_response.rs, validator_impl: V3ProviderResp14Raw, validator_input_types: ['impl Into<String>', 'impl Into<String>', u16, 'Vec<V3ProviderResponseHeader>', 'Vec<u8>'], validator_output_type: Self }
      - { node_id: V3DirectResp14ProviderProjectionPrepared, entry_shape: same_protocol_response, exit_shape: same_protocol_response, validator_owner: responses_direct_response_projection_hook, validator_source: v3/crates/routecodex-v3-runtime/src/hooks.rs, validator_input_types: [V3ProviderResp14Raw], validator_output_type: ResponseProjectionFuture }
      - { node_id: V3DirectResp15ClientPayloadReady, entry_shape: same_protocol_response, exit_shape: same_protocol_response, validator_owner: execute_v3_responses_direct_runtime_kernel_core, validator_source: v3/crates/routecodex-v3-runtime/src/kernel.rs, validator_input_types: ["V3ResponsesDirectRuntimeCoreState<'_>", '&V3Config05ManifestPublished', V3Server03HttpRequestRaw, V3HookRegistry, '&T'], validator_output_type: V3ResponsesDirectRuntimeOutput }
verification_gates:
  - npm run verify:v3-stage-protocol-shapes
  - npm run test:v3-stage-protocol-shapes-red-fixtures
