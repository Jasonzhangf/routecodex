  holder: provider_lifecycle_observation_only
  request_admission: forbidden
  request_wait: forbidden
  observation_admission_operation: V3ProviderActionGate::try_admit_observation
  observation_due_operation: V3ProviderActionGate::observation_due_at
  release_operations:
    - provider_success
    - provider_failure
    - V3ProviderActionGate::release_observation
  wall_clock_expiry: forbidden
  admission_scope: exact_control_lane_only
downstream_projection:
  owner_crate: routecodex-v3-error
  source_operation: terminal_projection_for
  input_node: V3Error05ExecutionDecision
  output_node: V3Error06ClientProjected
