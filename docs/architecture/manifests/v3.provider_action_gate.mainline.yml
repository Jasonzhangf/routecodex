resources:
  - v3.error.execution_decision
  - v3.error.provider_action_gate
  - v3.provider.health_state
request_independence:
  business_scope: request_local
  health_scope: listener_provider_interface_model_auth_key
  session_group_admission: forbidden
  sibling_identity_delay_generation_mutation: forbidden
  health_state_owner: provider_health_store
object_flows:
  # This lifecycle has several terminal nodes (see return_path). It is therefore
  # NOT a single-entry/single-exit graph. SESE holds per actual flow below; each
  # flow has exactly one entry and one exit. Do not claim whole-lifecycle SESE.
  sese_scope: per_flow_only_whole_lifecycle_multi_terminal
  error_disposition:
    entry: source_failure
    exit: internal_error_outcome
    graph: docs/architecture/dagpipe/v3.operation_runner.error.graph.json
    note: Existing SESE Error01-06 graph; a real HTTP 429 is one source failure and the exit stays internal.
  request_recovery:
    entry: failed_request_recovery_witness
    exit: request_recovery_disposition
    note: Request-local retry pacing, healthy alternative, or a real exact-identity cooldown wait. A fresh independent request never enters this flow.
  fresh_request_attempt:
    entry: fresh_independent_request
    exit: request_attempt_disposition
    note: Reads current typed health eligibility and sends. Never consumes another request's active recovery lane, including a request in the same session.
error_return:
  hold_ms: 2000
  ownership: per_request
  shared_admission: forbidden
  health_recording: immediate_before_hold
  applies_to: lawful_final_error_transport_close
  recovery_actions_wait_for_hold: false
downstream_projection:
  owner_crate: routecodex-v3-error
  source_operation: terminal_projection_for
  input_node: V3Error05ExecutionDecision
  output_node: V3Error06ClientProjected
  provider_action_gate_witness: none
verification_gates:
  - npm run test:v3-provider-action-gate
  - npm run verify:v3-provider-action-gate
  - npm run test:v3-provider-action-gate-red-fixtures
  - npm run verify:v3-resource-map
  - npm run verify:v3-mainline-caller-flow
  - npm run test:v3-compile-fail
