resources:
  - v3.error.execution_decision
  - v3.error.provider_action_gate
  - v3.provider.health_state
terminal_transition:
  admission_operation: V3ProviderActionGate::record_failure_and_wait_for_terminal_projection
  atomic_commit_operation: V3ProviderActionGate::commit_terminal_admission
  waiter_outcome: typed_admitted_superseded_or_released_by_success_with_retained_ticket
  success_release_rearms_exact_generation: true
  next_generation_delay_ms: 5000
admission_permit:
  owner_type: V3ProviderActionPermit
  acquisition_operation: V3ProviderActionWaiter::wait
  release_operations:
    - provider_success
    - provider_failure
    - V3ProviderActionGate::commit_terminal_admission
    - V3ProviderActionGate::abandon_admission
  wall_clock_expiry: forbidden
  abandon_delay_ms: 5000
  abandon_increments_failure_count: false
  abandon_mutates_provider_health: false
  waiter_order: fifo_ticket
  fresh_request_consumes_active_recovery_lane: false
downstream_projection:
  owner_crate: routecodex-v3-error
  source_operation: terminal_projection_for
  input_node: V3Error05ExecutionDecision
  output_node: V3Error06ClientProjected
  provider_action_gate_witness: none
verification_gates:
  - npm run test:v3-provider-action-gate
  - npm run verify:v3-provider-action-gate
  - npm run test:v3-provider-action-gate-red-fixtures
  - npm run verify:v3-resource-map
  - npm run verify:v3-mainline-caller-flow
  - npm run test:v3-compile-fail
