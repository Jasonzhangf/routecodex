  required_contract:
  - Request image/media facts are normal request data and must enter V3RouterRequestFacts
    as multimodal/vision before pool matching.
  - Request tool facts include top-level tools and Responses additional_tools; Codex
    coding tools set coding, tool_search sets search, and web_search/web_search_preview
    set web_search before pool matching.
  - V3Router07OpaqueTargetHitOnce carries request route facts to Target as route/pool
    selection signals; route selection is not model capability filtering.
  - 'Target hard capability_mismatch is allowed only for capabilities the selected
    model/provider may genuinely lack: web_search/search and multimodal/vision.'
  - Target10 consumes RCC-owned request_input_tokens, validated candidate context_token_estimate_scale_bps, and candidate max_context_tokens
    as a control-side admission rule; below 90 percent preserves configured order,
    90 through 100 percent remains eligible after normal candidates, and above 100
    percent is filtered before provider transport.
  - Provider availability/health and request-local provider-failure exclusion remain
    explicit switch inputs after capability and context admission; provider errors
    and payload metadata cannot reconstruct request token truth.
  - Tools, tool_outputs, reasoning/thinking, coding, longcontext, remote_continuation,
    and local_materialization are route/protocol/continuation ownership signals; they
    may steer pool choice but must not mark a candidate as capability_mismatch.
  - 'Continuation is resolved by previous_response_id owner: direct remote records
    exact-pin to the same GPT-family provider/model/auth, while relay/local records
    restore through the local continuation store. It is not a model capability.'
  - OpenAI Responses request.reasoning is also exposed as the thinking route fact
    so configs using either vocabulary route the same request.
  - Target candidate dedupe preserves pool provenance, required capabilities, and
    default-pool membership; default's final compatible provider remains selectable
    under health cooldown.
  - Target09-to-Target10 selection first reads the session-scoped availability projection
    and request-local Error03 candidate exclusions; global availability may revive
    a multi-candidate plan only after no nonfailed session alternative remains.
  - A Server-preplanned Target10 is revalidated from its captured Target09 candidate
    set at Direct kernel entry, so a provider cooled between planning and transport
    cannot bypass a currently available same-session alternative.
  - For non-built-in requested model ids, explicit `match.models` pools declare inbound-model
    to target mapping and the provider-wire hook rewrites outbound `body.model` to
    the selected target wire model; only default/no-explicit-model paths are filtered
    by configured target model ids to prevent wrong-model default success, and provider
    aliases do not authorize runtime matching.
  runtime_status: owner_queryability_bound_to_existing_p5_source
