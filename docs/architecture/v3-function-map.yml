  notes:
  - Semantic owner remains StoplessCenterMetadataControl under MetadataCenter; Direct
    and Relay are separate adapter handles.
  - Direct stopless request control starts only after SameProtocolDirect decision
    so routing/capability selection is not polluted by injected reasoningStop.
  - Direct writes only V3ResponsesDirectStoplessControlState; zero Relay StoplessCenter
    write and zero Relay Chat Process re-entry for stopless.
  - Direct no-op CLI projection may commit a Direct remote locator for the provider-native
    response id so next previous_response_id remains Direct-owned.
  - SSE is transport only and never parses or rewrites stopless control frames; the
    legacy direct SSE stopless stream wrapper was physically removed.
  - StoplessCenter state never enters provider body, client body, CLI args/stdout,
    debug snapshot, or continuation payload/history; this does not prohibit registered
    Req04 current-turn Stopless protocol injection or matching Resp03 current-response
    stripping.
  - Data/control lock and inactive/missing-scope pass-through remain explicit contracts,
    not fallback success wrapping.
