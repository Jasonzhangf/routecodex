    derive from manifest model capabilities when a provider declares the visible/canonical
    model id.
  - gpt-5.6-* model ids and aliases must not be exposed through /v1/models until the
    gpt-5.6 client surface is explicitly enabled.
  - gpt-5.5 must not publish tool_mode=code_mode_only or use_responses_lite=true;
    Codex treats those fields as request/tool-surface selectors.
  - experimental_supported_tools must not be used as the apply_patch/web_search/tool_search
    surface; current Codex source only consumes recognized experimental names such
    as test_sync_tool.
