  - /v1/models is scoped by the current listener routing group; enabled provider models
    outside that route group must not be exposed to Codex.
  - Route group and forwarder expansion belongs to the config Manifest helper; Server
    only calls the helper and projects JSON, and must not interpret route targets
    directly.
