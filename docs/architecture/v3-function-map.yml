    the exact source string at the adjacent codec even when its contents are not parseable
    JSON; protocol targets that require structured argument values keep their own
    adjacent-codec fail-fast contract. No empty-object fallback, JSON-string rewrapping,
    MetadataCenter reconstruction, or provider reselect is allowed.
