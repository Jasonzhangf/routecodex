  notes:
  - Stopless response interception is gated by StoplessCenter MetadataCenter state
    machine same-turn `schema_guidance_active`. inactive state means pass-through
    without CLI projection; accepted canonical summary and accepted_stop_schema pass
    through; inactive state means no StoplessCenter write. Anthropic/provider validation
    exceptions keep the state inactive instead of forcing illegal guidance.
  - inactive state means pass-through
  - V3 StoplessCenter is enabled by default and can be disabled only via `[features].stopless_center
    = false`; disabled relay does not inject stopless guidance/tool and does not project
    stopless CLI.
  - 'Provider-facing guidance is a complete non-persistent current-turn guideline,
    not a terse `继续。`: Req04 must be transparent to the model by not mentioning no-op/CLI/client
    bridge/finish_reason/counters/budget/guard; it should continue from restored context,
    use tools when needed, require evidence before complete/blocked `reasoningStop`,
    and vary wording by StoplessCenter next_request_policy without exposing internal
    state.'
  - Allowed model-originated stop decision sources are only the internal `reasoningStop`
    tool-call arguments and canonical reasoning `summary` sibling `stop_schema` /
    `stopSchema` objects inspected at Resp03 after same-turn StoplessCenter schema_guidance_active
    state. Assistant visible text, fenced JSON, `<rcc_stop_schema>`, visible `next_step`,
    schemaFeedback, repeatCount/maxRepeats/triggerHint, and CLI stdout JSON are not
    StoplessCenter state sources.
  - Natural `finish_reason=stop` / `end_turn` without accepted canonical summary or
    accepted stop_schema updates StoplessCenter phase/consecutive_stop_count/need_continue
    policy only when the same provider turn had StoplessCenter schema_guidance_active
    state; without activation it passes through with no CLI projection and no StoplessCenter
    write. Before the guard an activated missing-evidence stop projects a no-input
    no-op `routecodex hook run reasoningStop`; at the guard it stops intercepting
    without another CLI or synthesized internal-state diagnostic.
  - Canonical reasoning summary or accepted stop_schema is the completion gate for
    stop/end_turn. Summary without a canonical stop_schema is accepted evidence and
    passes through. Summary with `stop_schema.finished=true` passes through without
    counting; summary with `stop_schema.blocked=true` plus blocked reason appends
    that reason to canonical summary and passes through; summary with `finished=false`/unfinished
    uses `nextStep`/`next_step` as a scoped `next_step_prompt` for the next Req04
    continuation and projects the no-op bridge only if same-turn StoplessCenter active
    state exists.
  - The no-op CLI command has no args, no JSON envelope, no scope, and no state. Req04
    consumes the current stopless call/output as current-turn evidence but never parses
    CLI stdout/args as StoplessCenter state.
  - StoplessCenter side-channel state is stored only in MetadataCenter/runtime_control,
    bound by entry endpoint + session + conversation + port + routing group. `V3ResponsesRelayStoplessControlState`
    and `V3ResponsesDirectStoplessControlState` are adapter runtime handles under
    `StoplessCenterMetadataControl`, not the semantic owner. Local continuation context/store
    must never carry stopless control fields.
  - 'Data/control lock: provider-bound current-turn payload may carry registered Stopless
    protocol artifacts injected by Req04, and Resp03 may strip their exact same-turn
    response counterparts. StoplessCenter state remains control_signal; CLI-carried
    scope/state, normal-payload control fields, continuation-context control state,
    debug/snapshot truth restore, history mutation, and undeclared cross-SOP access
    are forbidden.'
  - Central aggregation may call StoplessCenter only through the declared v3.servertool_hook_skeleton_lifecycle
    and v3.direct_stopless_metadata_center SOP nodes. Generic Hub closeout, server
    entry/output aggregate edges, provider-direct, provider runtime, SSE, debug, and
    continuation stores cannot claim StoplessCenter read/write ownership.
  - 'Tool injection preserves the original declaration surface: top-level `tools`
    stays top-level, Responses `input[].type=additional_tools.tools` stays embedded,
    and stopless only appends exactly one internal `reasoningStop` declaration.'
  - Responses protocol direct remains zero Relay StoplessCenter writes. Direct may
    write only Direct-scoped StoplessCenter control state through `V3ResponsesDirectStoplessControlState`
    after SameProtocolDirect decision; no-op projection may commit a Direct remote
    locator for the provider-native response id. Inactive/missing scope and `[features].stopless_center=false`
    pass through without Direct control write. Provider-direct and non-Responses direct
    remain zero stopless.
  - Stopless lifecycle docs are generated from `docs/architecture/manifests/v3.servertool_hook_skeleton_lifecycle.mainline.yml`;
    `docs/architecture/wiki/stopless-session-mainline-source.md` and `docs/architecture/wiki/html/stopless-session-mainline-source.html`
    must contain both the hook edge flowchart and StoplessCenter state transition
    diagram.
  runtime_status: controlled_runtime_slice_only
