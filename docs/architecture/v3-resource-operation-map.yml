      control_state_in_payload: forbidden
      secret_in_logs: forbidden
      secret_in_admin_response_body: forbidden_except_session_endpoint
      threat_boundary_note: The 0600 file mode is defence in depth, not the trust boundary. The enforced boundary is loopback reachability plus the browser same-origin policy (no CORS layer is registered). Any local process can read the token from GET /api/admin/session; a remote page cannot, because a rebound Host is rejected and a cross-origin read is blocked by SOP.
