version: 1
status: active
source_edge_scope: cargo_and_rust_imports
source_call_edge_registry: docs/architecture/v3-mainline-call-map.yml
source_modules:
  - module_id: crate.routecodex-v3-admin
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-admin
    allowed_dependencies: [routecodex-v3-config, routecodex-v3-config-mgmt]
  - module_id: crate.routecodex-v3-cli
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-cli
    allowed_dependencies: [routecodex-v3-config, routecodex-v3-config-mgmt, routecodex-v3-lifecycle, routecodex-v3-server]
  - module_id: crate.routecodex-v3-config
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-config
    allowed_dependencies: []
  - module_id: crate.routecodex-v3-config-mgmt
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-config-mgmt
    allowed_dependencies: [routecodex-v3-config]
  - module_id: crate.routecodex-v3-debug
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-debug
    allowed_dependencies: [routecodex-v3-config]
  - module_id: crate.routecodex-v3-error
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-error
    allowed_dependencies: [routecodex-v3-debug]
  - module_id: crate.routecodex-v3-lifecycle
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-lifecycle
    allowed_dependencies: [routecodex-v3-config, routecodex-v3-server]
  - module_id: crate.routecodex-v3-provider-responses
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-provider-responses
    allowed_dependencies: [routecodex-v3-config, routecodex-v3-error, routecodex-v3-sse]
  - module_id: crate.routecodex-v3-route-classifier
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-route-classifier
    allowed_dependencies: []
  - module_id: crate.routecodex-v3-runtime
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-runtime
    allowed_dependencies: [routecodex-v3-config, routecodex-v3-debug, routecodex-v3-error, routecodex-v3-provider-responses, routecodex-v3-route-classifier, routecodex-v3-sse, routecodex-v3-target, routecodex-v3-virtual-router]
  - module_id: crate.routecodex-v3-server
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-server
    allowed_dependencies: [routecodex-v3-config, routecodex-v3-debug, routecodex-v3-error, routecodex-v3-runtime, routecodex-v3-sse]
  - module_id: crate.routecodex-v3-sse
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-sse
    allowed_dependencies: []
  - module_id: crate.routecodex-v3-target
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-target
    allowed_dependencies: [routecodex-v3-config, routecodex-v3-provider-responses, routecodex-v3-virtual-router]
  - module_id: crate.routecodex-v3-virtual-router
    owner_feature_id: v3.module_decomposition
    owned_path: v3/crates/routecodex-v3-virtual-router
    allowed_dependencies: [routecodex-v3-config, routecodex-v3-route-classifier]
modules:
  - module_id: v3-global-binary-install
    owner_feature_id: v3.global_binary_install
    owned_paths:
      - scripts/install-v3-cli.mjs
      - scripts/ensure-cli-command-shim.mjs
      - scripts/install-global.sh
      - tests/scripts/v3-cli-distribution.spec.mjs
      - tests/scripts/install-v3-cli-target-cleanup.spec.mjs
      - v3/crates/routecodex-v3-config/src/lib.rs
    allowed_dependencies:
      - v3/crates/routecodex-v3-cli
      - dist/bin/rccv3
      - ~/.local/bin/rccv3
    forbidden_paths:
      - src
      - sharedmodule
      - ~/.rcc/install
    required_gates:
      - npm run test:v3-cli-distribution
      - npm run test:install-v3-target-cleanup
      - npm run verify:v3-resource-map
      - npm run verify:v3-module-boundaries

  - module_id: v3-build-test-artifact-budget
    owner_feature_id: v3.build_test_artifact_budget
    owned_paths:
      - .cargo/config.toml
      - v3/Cargo.toml
      - scripts/run-v3-cargo-test.mjs
      - scripts/cargo-test-artifact-runner.mjs
      - scripts/architecture/verify-v3-build-test-artifact-budget.mjs
      - scripts/architecture/verify-v3-architecture-ci.mjs
      - scripts/tests/v3-build-test-artifact-budget-red-fixtures.mjs
      - docs/goals/v3-build-test-artifact-budget-test-design.md
      - docs/architecture/manifests/v3.build_test_artifact_budget.mainline.yml
      - docs/architecture/wiki/v3-build-test-artifact-budget.md
    allowed_dependencies:
      - node:child_process
      - node:fs
      - node:path
      - node:url
    forbidden_paths:
      - v3/crates
      - src
      - sharedmodule
      - ~/.rcc
    required_gates:
      - npm run verify:v3-build-test-artifact-budget
      - npm run test:v3-build-test-artifact-budget-red-fixtures

  - module_id: v3-debug-error-foundation
    owner_feature_id: v3.debug_error_foundation
    owned_paths:
      - v3/crates/routecodex-v3-error/src
    allowed_dependencies:
      - v3/crates/routecodex-v3-error
      - v3/crates/routecodex-v3-debug
      - v3/crates/routecodex-v3-provider-responses
      - v3/crates/routecodex-v3-runtime
      - v3/crates/routecodex-v3-server
      - docs/architecture
    forbidden_paths:
      - request.normal_payload
      - provider.wire_payload
      - response.client_payload
      - ~/.rcc
    allowed_edges:
      - Error01SourceRaised -> Error02Classified
      - Error02Classified -> Error03TargetLocalAction
      - Error03TargetLocalAction -> Error04TargetExhaustionDecision
      - Error04TargetExhaustionDecision -> Error05ExecutionDecision
      - Error05ExecutionDecision -> Error06ClientProjected
    resources:
      - v3.error.source
      - v3.error.classified
      - v3.error.action_plan
      - v3.error.exhaustion_decision
      - v3.error.execution_decision
      - v3.error.client_projection
    required_gates:
      - npm run test:v3-error-contract
      - npm run verify:v3-module-boundaries
      - npm run verify:v3-resource-map
      - npm run verify:v3-rust-only
      - npm run verify:v3-cargo-fmt
      - npm run verify:v3-clippy
      - npm run test:v3-workspace

  - module_id: v3-compaction-request-routing
    owner_feature_id: v3.compaction_request_routing
    owned_paths:
      - v3/crates/routecodex-v3-server/src/compaction_request.rs
      - v3/crates/routecodex-v3-server/src/endpoint_handlers.rs
      - v3/crates/routecodex-v3-server/src/executors.rs
      - v3/crates/routecodex-v3-server/src/lib.rs
      - v3/crates/routecodex-v3-server/src/responses_direct_server_outcome.rs
      - v3/crates/routecodex-v3-runtime/src/nodes.rs
      - v3/crates/routecodex-v3-runtime/src/hooks.rs
      - v3/crates/routecodex-v3-route-classifier/src/route.rs
      - v3/crates/routecodex-v3-virtual-router/src/lib.rs
      - v3/crates/routecodex-v3-provider-responses/src/wire.rs
      - v3/crates/routecodex-v3-provider-responses/src/transport.rs
      - v3/crates/routecodex-v3-config/src/defaults.rs
      - v3/crates/routecodex-v3-config/src/entry_protocol_validation.rs
    allowed_dependencies:
      - routecodex-v3-config
      - routecodex-v3-provider-responses
      - routecodex-v3-route-classifier
      - routecodex-v3-runtime
      - routecodex-v3-server
      - routecodex-v3-virtual-router
    forbidden_paths:
      - src
      - sharedmodule
      - MetadataCenter
      - request.normal_payload.purpose
    allowed_edges:
      - V3Server03HttpRequestRaw -> V3Req04StandardizedResponses
      - V3Req04StandardizedResponses -> V3Router05RequestClassified
      - V3Router05RequestClassified -> V3Router06RoutePoolResolved
      - V3Provider12ResponsesWirePayload -> V3Transport13ResponsesRequest
    resources:
      - v3.request.compaction_purpose
      - v3.route.request_facts
      - v3.route.selection_plan
    required_gates:
      - npm run test:v3-compaction-request-routing
      - npm run verify:v3-resource-map
      - npm run verify:v3-module-boundaries
      - npm run verify:v3-architecture-docs
      - npm run verify:v3-cargo-fmt
