extended_openai_chat_semantic_superset:
  contract: Chat Process protocol is OpenAI Chat plus extension fields. The canonical semantic id is the same string as
    fields[].extended_openai_chat_field. OpenAI Chat native request/response fields keep their exact OpenAI Chat field
    paths, including [] item notation; only semantics absent from OpenAI Chat receive protocol-neutral top-level
    request./response./edge. extension fields. Every source protocol field is mapped exactly once or explicitly
    classified as edge_only / unsupported_blocked. Runtime does not read this audit artifact.
  standard_protocol: openai_chat
  coverage_rule: all source_inventory fields across Responses, OpenAI Chat, Anthropic, and Gemini must appear exactly once
    under fields[].equivalent_fields.<protocol>; every OpenAI Chat source field must also appear exactly as
    fields[].extended_openai_chat_field and semantic_id; native OpenAI Chat rows must use mapping_status=mapped, not
    extension_added
  duplicate_rule: fields[].semantic_id and fields[].extended_openai_chat_field must be unique and equal per row; OpenAI
    Chat native fields must not be renamed; extension field names must not contain source protocol namespaces; business
    payload owners must not be MetadataCenter/raw payload dump or chat.extensions.openai_chat
  mapping_status_values:
    - mapped
    - extension_added
    - edge_only
    - unsupported_blocked
