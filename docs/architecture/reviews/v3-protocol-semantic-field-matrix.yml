outbound_projection_contract:
  owner_feature_id: v3.protocol_conversion_field_parity
  projector_owner: adjacent_outbound_codec
  projectors:
    openai_chat_and_responses: v3/crates/routecodex-v3-runtime/src/hub_v1/request_outbound_format.rs
    anthropic: v3/crates/routecodex-v3-runtime/src/hub_v1/anthropic_codec.rs
    gemini: v3/crates/routecodex-v3-runtime/src/hub_v1/gemini_codec.rs
  legacy_outbound_consumption_statuses:
    mapped: Source field is emitted under an equivalent target field.
    transformed: Source field is emitted through an adjacent codec shape conversion.
    consumed_by_transform: Source field is read only to produce another emitted target field and must not be forwarded raw.
    target_unsupported: Source field has no equivalent in the target protocol and must raise UnmappedOutboundFields before provider send.
    control_forbidden: RouteCodex-owned internal control fields must raise ControlFieldLeak with exact JSON paths before provider send; payload-owned underscore fields such as `_id` remain data-plane.
  projection_class_bridge:
    mapped: mapped_exact
    transformed: Every transformed field must separately declare mapped_exact or mapped_compatible_registered; shape conversion alone never proves compatibility and never authorizes silent consumption.
    consumed_by_transform: mapped_compatible_registered only when a named target-default or compatibility contract records the consumed source value, semantic delta, and tests; otherwise unsupported.
    target_unsupported: unsupported
    control_forbidden: outside_projection_classes_control_field_leak
  fail_fast_errors:
    unmapped: UnmappedOutboundFields
    control: ControlFieldLeak
  forbidden_behaviors:
    - recursive automatic strip
    - private `_` key deletion
    - unknown source field ignore
    - raw forwarding of unmapped fields
  initial_rows:
    - source_protocol: responses
      target_protocol: openai_chat
      status: target_unsupported
      fields:
        - request.include
        - request.background
        - request.context_management
        - request.conversation
        - request.prompt_cache_options.*
        - request.prompt_cache_retention
        - request.service_tier
        - request.truncation
    - source_protocol: responses
      target_protocol: openai_chat
      status: transformed
      fields:
        - request.client_metadata.user_id -> request.metadata.user_id -> OpenAI Chat target metadata validation
        - request.prompt_cache_key -> request.prompt_cache_key
        - request.store -> request.store
        - request.text.verbosity -> request.verbosity
        - request.text.format -> request.response_format
        - request.tools[].type[custom] -> request.tools[].type[custom] with exact free-form/grammar format -> response.output[].custom_tool_call
        - request.tools[].type[web_search|web_search_preview] + request.tools[].search_content_types[text] -> request.web_search_options
        - request.tools[].type[tool_search] -> request.tools[].type[function,name=tool_search]
    - source_protocol: responses
      target_protocol: openai_chat
      status: consumed_by_transform
      fields:
        - request.client_metadata[session_id|thread_id|turn_id|x-codex-installation-id|x-codex-turn-metadata|x-codex-window-id] -> local request context only
    - source_protocol: responses
      target_protocol: openai_chat
      status: target_unsupported
      fields:
        - request.reasoning.summary[auto|concise|detailed]
        - request.client_metadata[unknown_keys]
        - request.tools[].type[web_search|web_search_preview].search_content_types[image]
    - source_protocol: openai_chat
      target_protocol: responses
      status: target_unsupported
      fields:
        - request.audio
        - request.modalities
        - request.web_search_options
        - request.prediction
        - request.prompt_cache_options.*
        - request.prompt_cache_retention
    - source_protocol: openai_chat
      target_protocol: responses
      status: transformed
      fields:
        - request.metadata -> request.metadata
        - request.prompt_cache_key -> request.prompt_cache_key
        - request.store -> request.store
        - request.reasoning_effort -> request.reasoning.effort
    - source_protocol: anthropic
      target_protocol: any_cross_protocol_outbound
      status: target_unsupported
      fields:
        - request.container
        - request.output_config.format
        - request.cache_control
        - request.user_profile_id
    - source_protocol: responses
      target_protocol: anthropic
      status: transformed
      fields:
        - request.reasoning.effort[low|medium|high|xhigh|max] -> request.output_config.effort
        - request.client_metadata.user_id -> request.metadata.user_id
        - request.text.format.json_schema -> request.output_config.format.json_schema
    - source_protocol: responses
      target_protocol: anthropic
      status: consumed_by_transform
      fields:
        - request.metadata[non_user_id] -> response.metadata before RespChatProcess
        - request.client_metadata[session_id|thread_id|turn_id|x-codex-installation-id|x-codex-turn-metadata|x-codex-window-id] -> local request context only
        - request.prompt_cache_key[non_empty_string] -> local cache hint only
        - request.reasoning.summary[auto|concise|detailed] -> local response-shaping policy only
        - request.reasoning.generate_summary[auto|concise|detailed] -> local response-shaping policy only
        - request.store[false]
        - request.text.verbosity[low|medium|high] -> local style hint only
    - source_protocol: responses
      target_protocol: anthropic
      status: target_unsupported
      fields:
        - request.reasoning.effort[none|minimal]
        - request.reasoning.context
        - request.reasoning.mode
        - request.client_metadata[unknown_keys]
        - request.prompt_cache_key[malformed]
        - request.store[true]
        - request.text.format.strict=false
    - source_protocol: gemini
      target_protocol: any_cross_protocol_outbound
      status: target_unsupported
      fields:
        - request.safetySettings
        - request.contents[].parts[].thoughtSignature
        - response.candidates[].groundingMetadata
        - response.candidates[].citationMetadata
        - request.generationConfig.*
        - response.usageMetadata.*
    - source_protocol: routecodex_internal
      target_protocol: all_provider_outbound
      status: control_forbidden
      fields:
        - metadata_center
        - __rt
        - _debug
