canonical_chat_semantics:
  model.identity:
    response_restore: preserve source model if target response protocol supports model; otherwise keep in extension block.
  system.instructions:
    response_restore: source system/developer instructions stay request-side only; no response projection unless protocol carries it.
  turn.messages:
    response_restore: preserve role/content/tool ordering; tool identity governance remains Req04/Resp03.
  message.content_parts:
    response_restore: text/image/binary/file need typed content parts; no lossy string concat before Chat Process.
  tool.declarations:
    response_restore: top-level and embedded tool declarations need one canonical list plus original_surface pointer.
  tool.calls:
    response_restore: call_id/name/arguments/input must preserve function vs custom distinction.
  tool.result:
    response_restore: tool output must bind by call_id and content; pairing governance not in codec normalization.
  reasoning.request_fields:
    response_restore: preserve each registered reasoning request semantic independently; never reconstruct one field from another.
  reasoning.visible_content:
    response_restore: visible reasoning summary/thinking maps to canonical reasoning item.
  reasoning.encrypted_payload:
    response_restore: opaque encrypted/redacted reasoning never enters visible text.
  sampling.max_output_tokens:
    response_restore: keep aliases and source protocol field name for reverse projection.
  transport.intent:
    response_restore: edge-only stream/json; Chat Process may see intent but not parse SSE semantics.
  usage.tokens:
    response_restore: normalize prompt/input and completion/output aliases plus provider-specific cache counters.
  response.finish_reason:
    response_restore: normalize stop/tool/max/error/safety, keep original protocol enum in extension block.
protocol_specific_chat_extensions:
  responses:
    lifecycle_and_storage:
      field_paths:
        - request.background
        - request.context_management
        - request.conversation
        - request.store
        - request.previous_response_id
      extension_owner: chat.extensions.responses.lifecycle
