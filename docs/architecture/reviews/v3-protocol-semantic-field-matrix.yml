      - response.usageMetadata.cachedContentTokenCount
      - response.usageMetadata.thoughtsTokenCount
      - response.usageMetadata.toolUsePromptTokenCount
      - response.usageMetadata.promptTokensDetails
      - response.usageMetadata.candidatesTokensDetails
      - response.usageMetadata.cacheTokensDetails
      - response.usageMetadata.serviceTier
      - response.modelVersion
      - response.responseId
      - response.modelStatus.modelStage
      - response.modelStatus.retirementTime
      - response.modelStatus.message
chat_semantic_translation_groups:
  - group_id: identity.request_model
    standard_chat_field: request.model
    chat_fields:
      - request.model
    direction: request
    standard_semantic_meaning: Client requested model identity before routing/provider target replacement. It is selector
      data, not provider health or route state.
    chat_shape_rule: Chat keeps the requested model at top-level `request.model`; provider wire may later overwrite only at
      Provider08 with selected wire model.
    protocol_mappings:
      responses:
        request_fields:
          - request.model
        response_fields: []
        transform: Copy model selector into Chat request model, then Provider08 may replace with selected upstream model.
      anthropic:
        request_fields:
          - request.model
        response_fields: []
        transform: Copy Anthropic model into Chat request model as selector only.
      gemini:
        request_fields:
          - request.model
        response_fields: []
        transform: Gemini model may come from path or request model; normalize to Chat request.model as selector.
    chat_extension_fields: []
    current_impl: covered
    gap: none
  - group_id: turn.message_array
    standard_chat_field: request.messages
    chat_fields:
      - request.messages
    direction: request
    standard_semantic_meaning: Ordered conversation turn container. Carries role/content/tool-call/tool-result items in client order.
    chat_shape_rule: Chat uses one ordered `messages[]` list; role-specific semantics are interpreted inside each message,
      not by parallel history arrays.
    protocol_mappings:
      responses:
        request_fields:
          - request.input
          - request.input[].message.content
        response_fields: []
        transform: Responses input items become ordered Chat messages; message/status/id are item metadata and must not reorder
          content.
      anthropic:
        request_fields:
          - request.messages
          - request.messages[].content
        response_fields: []
        transform: Anthropic messages are already ordered but system is top-level; system becomes system/developer Chat message
          before user/assistant turns.
      gemini:
        request_fields:
          - request.contents
        response_fields: []
        transform: Gemini contents become ordered Chat messages; Gemini model role maps to assistant, user role maps to user.
    chat_extension_fields:
      - request.messages
    current_impl: partial
    gap: system/top-level and role availability require explicit transform per protocol
  - group_id: turn.role
    standard_chat_field: request.messages[].role
    chat_fields:
      - request.messages[].role
    direction: request
    standard_semantic_meaning: "Participant role for one turn: system/developer/user/assistant/tool. It controls how
      content/tool fields are interpreted."
    chat_shape_rule: Chat uses role inside each message; `tool` role plus `tool_call_id` means tool result, assistant plus
      `tool_calls` means model tool request.
    protocol_mappings:
      responses:
        request_fields:
          - request.input[].message.role
        response_fields: []
        transform: Responses message.role maps to Chat role; function_call_output items synthesize Chat role=tool.
      anthropic:
        request_fields:
          - request.messages[].role
          - request.system
          - request.messages[].content[].mid_conv_system.content
        response_fields: []
        transform: Anthropic user/assistant roles map directly; top-level or mid-conversation system blocks synthesize Chat
          system/developer messages.
      gemini:
        request_fields:
          - request.contents[].role
          - request.systemInstruction.role
        response_fields: []
        transform: Gemini role=user maps to user; role=model maps to assistant; systemInstruction becomes system/developer Chat
          message.
    chat_extension_fields: []
    current_impl: partial
    gap: Gemini/Anthropic system roles are not one-to-one Chat message fields
  - group_id: content.text_string
    standard_chat_field: request.messages[].content
    chat_fields:
      - request.messages[].content
    direction: request
    standard_semantic_meaning: Simple textual message content when Chat uses string form rather than content-part array.
    chat_shape_rule: Chat string content is only text payload. It must not absorb images/files/tool results/reasoning metadata.
    protocol_mappings:
      responses:
        request_fields:
          - request.input[].input_text.text
        response_fields:
          - response.output_text
        transform: Responses input_text/output_text text maps to Chat string content only when no sibling non-text parts require
          array form.
      anthropic:
        request_fields:
          - request.messages[].content[].text.text
        response_fields:
          - response.content[].text
        transform: Anthropic text blocks map to Chat text string or text parts; citations remain separate extension semantics.
      gemini:
        request_fields:
          - request.contents[].parts[].text
        response_fields:
          - response.candidates[].content.parts
        transform: Gemini text parts map to Chat text content; non-text Part variants remain separate groups.
    chat_extension_fields: []
    current_impl: covered
    gap: none
  - group_id: content.text_part
    standard_chat_field: request.messages[].content[].text
    chat_fields:
      - request.messages[].content[].text
    direction: request
    standard_semantic_meaning: Text part inside Chat content-part array for multimodal messages.
    chat_shape_rule: When a message has mixed text/image/file/audio parts, each text block is a `content[].text` item, not a
      top-level string merge.
    protocol_mappings:
      responses:
        request_fields:
          - request.input[].input_text.text
        response_fields:
          - response.output[].output_text.text
        transform: Responses text item becomes one Chat text content part; response output_text text maps to response message
          content.
      anthropic:
        request_fields:
          - request.messages[].content[].text.text
        response_fields:
          - response.content[].text
        transform: Anthropic text block becomes one Chat text part; citations are not merged into text.
      gemini:
        request_fields:
          - request.contents[].parts[].text
        response_fields:
          - response.candidates[].content.parts
        transform: Gemini text Part becomes one Chat text part.
    chat_extension_fields: []
    current_impl: covered
    gap: none
  - group_id: content.image_url
    standard_chat_field: request.messages[].content[].image_url.url
    chat_fields:
      - request.messages[].content[].image_url.url
    direction: request
    standard_semantic_meaning: Externally reachable image URL in a Chat image content part.
    chat_shape_rule: Only URL-like image references map here. File ids, inline bytes, MIME type, and file URI metadata are
      separate semantics.
    protocol_mappings:
      responses:
        request_fields:
          - request.input[].input_image.image_url
        response_fields: []
        transform: Responses image_url maps to Chat image_url.url; detail maps to detail group, file_id does not map here.
      anthropic:
        request_fields:
          - request.messages[].content[].image.source
        response_fields: []
        transform: Anthropic image.source maps here only for URL source variants; base64/source metadata belongs to media source
          extensions.
      gemini:
        request_fields: []
        response_fields: []
        transform: Gemini inlineData/fileData are not Chat image_url.url unless a protocol-owned URL source is explicitly present.
        missing_or_extension: Gemini inline bytes/file URI are extension groups, not image_url.url.
    chat_extension_fields: []
    current_impl: shape_branch_gap
    gap: Anthropic image.source inventory is shape-unexpanded; runtime must branch by source.type
    shape_branch_cases:
      positive:
        - protocol: responses
          source_condition: request.input[].input_image.image_url is a URL string or object.url
          maps_to: request.messages[].content[].image_url.url
          owner_file: v3/crates/routecodex-v3-runtime/src/hub_v1/responses_openai_codec.rs
          required_test: responses_input_image_url_maps_only_to_chat_image_url_url
        - protocol: anthropic
          source_condition: request.messages[].content[].image.source.type == "url"
          maps_to: request.messages[].content[].image_url.url
          owner_file: v3/crates/routecodex-v3-runtime/src/hub_v1/anthropic_codec.rs
          required_test: anthropic_image_source_url_maps_only_to_chat_image_url_url
      negative:
        - protocol: anthropic
          forbidden_source: request.messages[].content[].image.source.type == "base64"
          must_not_map_to: request.messages[].content[].image_url.url
          owner_file: v3/crates/routecodex-v3-runtime/src/hub_v1/anthropic_codec.rs
          required_test: anthropic_image_base64_does_not_collapse_to_chat_image_url_url
        - protocol: gemini
          forbidden_source: request.contents[].parts[].inlineData.data or inlineData.mimeType or fileData.fileUri
          must_not_map_to: request.messages[].content[].image_url.url
          owner_file: v3/crates/routecodex-v3-runtime/src/hub_v1/gemini_codec.rs
          required_test: gemini_inline_or_file_data_does_not_collapse_to_chat_image_url_url
  - group_id: content.image_detail
    standard_chat_field: request.messages[].content[].image_url.detail
    chat_fields:
      - request.messages[].content[].image_url.detail
    direction: request
    standard_semantic_meaning: Image fidelity/detail hint for image understanding.
    chat_shape_rule: Detail is an option for an image URL/reference, not the image bytes or URL itself.
    protocol_mappings:
      responses:
        request_fields:
          - request.input[].input_image.detail
        response_fields: []
        transform: Responses detail maps to Chat image_url.detail.
      anthropic:
        request_fields: []
        response_fields: []
        transform: Anthropic has no direct detail field in current inventory.
      gemini:
        request_fields:
          - request.contents[].parts[].mediaResolution.level
          - request.generationConfig.mediaResolution
        response_fields: []
        transform: Gemini mediaResolution is similar but not exact; keep as declared extension unless runtime contract defines
          value mapping.
    chat_extension_fields: []
    current_impl: partial
    gap: Gemini mediaResolution value mapping is not equivalent yet
  - group_id: content.image_file_id
    standard_chat_field: request.messages[].content[].image_file.file_id
    chat_fields:
      - request.messages[].content[].image_file.file_id
    direction: request
    standard_semantic_meaning: Provider file identifier for an image input when the image is not represented by URL or inline bytes.
    chat_shape_rule: Added Chat extension because OpenAI Chat image_url.url cannot safely carry provider file ids.
    protocol_mappings:
      responses:
        request_fields:
          - request.input[].input_image.file_id
        response_fields: []
        transform: Responses input_image.file_id maps to image_file.file_id extension.
      anthropic:
        request_fields: []
        response_fields: []
        transform: Anthropic image.source may contain file/base64 variants but inventory is not split; branch under media source
