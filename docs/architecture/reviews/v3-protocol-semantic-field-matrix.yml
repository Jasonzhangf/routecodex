matrix_version: 1
owner_feature_id: v3.protocol_conversion_field_parity
audit_truth_contract:
  canonical_text_doc: docs/architecture/reviews/v3-protocol-semantic-matrix-review.md
  request_field_projection_doc: docs/design/v3-protocol-request-field-projection.md
  request_field_projection_manifest: docs/architecture/manifests/v3.protocol_request_field_projection.yml
  generated_review_surface: docs/architecture/wiki/html/v3-protocol-semantic-field-matrix.html
  closeout_goal_doc: docs/goals/v3-protocol-semantic-field-gap-closeout-plan.md
  gate: npm run verify:v3-protocol-conversion-field-parity
  red_fixture_gate: npm run test:v3-protocol-conversion-field-parity-red-fixtures
  truth_statement: OpenAI Chat is the Chat Process base protocol; the V3 audit truth is OpenAI Chat native fields plus
    protocol-neutral request/response/edge extension fields, with Responses, Anthropic Messages, and Gemini grouped by
    semantic meaning and explicit transform rules.
  forbidden_truth_sources:
    - MetadataCenter
    - raw payload dump
    - SSE transport
    - server handler
    - provider transport
  status_legend:
    covered: Runtime/test owner currently implements the audited semantic for the named path.
    covered_but_target_dependent: Runtime implements the field only where the target protocol legally supports it;
      target-incompatible projection must be rejected by the adjacent outbound codec.
    runtime_conformance_pending: Design and owner are fixed, but positive/negative runtime and live evidence have not passed.
    partial: Some runtime path or direction is covered, but cross-protocol or value-shape parity is incomplete.
    extension_declared: The OpenAI Chat extension field and semantic owner are declared, but runtime conversion closeout is not claimed.
    source_inventory_only: The source field is inventoried and searchable, but no runtime semantic mapping is claimed.
    shape_branch_gap: The mapping requires branch-specific transform logic by source type/value shape before runtime closeout.
    codec_shape_only: Current codec validates or preserves the protocol shape but does not yet implement full semantic conversion.
    edge_only: Transport or request/response edge state; it must not become business semantic payload truth.
    semantic_declared: The OpenAI Chat native field or protocol-neutral extension has a manual semantic owner and transform
      rule, but runtime conversion closeout is not claimed.
  projection_status_legend:
    mapped_exact: Source and target preserve the same semantics, possibly through a validated field rename or value intersection.
    mapped_compatible_registered: Target uses a registered wrapper with an explicit semantic delta and a required reverse projection.
    unsupported: No exact or registered compatible projection preserves the required behavior; adjacent outbound codec fails explicitly.
  audited_status_counts:
    covered: 160
    covered_but_target_dependent: 0
    runtime_conformance_pending: 5
    partial: 111
    extension_declared: 220
    source_inventory_only: 0
    shape_branch_gap: 18
    codec_shape_only: 14
    edge_only: 3
    semantic_declared: 50
  gap_audit:
    - gap_id: gap.client_metadata.target_dependent
      category: runtime_closeout
      affected_statuses:
        - runtime_conformance_pending
      affected_count: 5
      evidence: OpenAI Responses/Chat metadata accepts at most 16 bounded string pairs; Anthropic metadata declares only user_id, so only exact client_metadata.user_id may map to provider metadata. Registered Codex client-local keys may be consumed before provider wire as request-local context; unknown keys must fail.
      required_owner: docs/goals/v3-protocol-conversion-field-parity-test-design.md
      closeout_status: runtime_conformance_pending
      closeout_rule: Keep target-dependent provider-wire behavior explicit in the adjacent outbound codec; never use MetadataCenter, generic silent strip, or fallback.
    - gap_id: gap.runtime_extension_declared
      category: runtime_closeout
      affected_statuses:
        - extension_declared
      affected_count: 220
      evidence: Long-tail semantics now have protocol-neutral OpenAI Chat extension fields and owners, but no runtime
        conversion completion claim.
      required_owner: v3 protocol codec owner selected per field family
      closeout_status: needs_runtime_goal
      closeout_rule: Add red fixture, implement adjacent codec/Chat Process owner, add source/blackbox/live evidence before
        changing status to covered or partial.
    - gap_id: gap.semantic_declared_runtime_closeout
      category: runtime_closeout
      affected_statuses:
        - semantic_declared
      affected_count: 50
      evidence: These fields now have manual semantic owners and transform rules, but no runtime conversion completion
        evidence yet.
      required_owner: v3 protocol codec owner selected per field family
      closeout_status: needs_runtime_goal
      closeout_rule: Add field-family red tests and implement adjacent Rust codec owner before changing semantic_declared to
        covered, partial, or unsupported_blocked.
    - gap_id: gap.partial_cross_protocol_semantics
      category: runtime_closeout
      affected_statuses:
        - partial
      affected_count: 111
      evidence: Main protocol paths cover some directions, but not all equivalent request/response transforms across
        Responses, OpenAI Chat, Anthropic, and Gemini.
      required_owner: v3/crates/routecodex-v3-runtime/src/hub_v1 protocol codec files
      closeout_status: needs_runtime_goal
      closeout_rule: Close request and response directions together; no server/SSE/provider-transport repair owner.
    - gap_id: gap.source_inventory_only
      category: semantic_owner_closeout
      affected_statuses:
        - source_inventory_only
      affected_count: 0
      evidence: All previously source_inventory_only fields now have manual semantic owner groups, explicit transform rules,
        and non-runtime completion status.
      required_owner: docs/architecture/reviews/v3-protocol-semantic-field-matrix.yml
      closeout_status: closed_as_semantic_declared
      closeout_rule: Keep source_inventory_only at zero; new source fields must be classified into semantic_declared,
        edge_only, covered, partial, or unsupported_blocked before runtime edits.
    - gap_id: gap.shape_branch_transform
      category: transform_closeout
      affected_statuses:
        - shape_branch_gap
      affected_count: 18
      evidence: Media/tool/content fields need branch rules such as URL vs file id vs inline bytes vs MIME before a legal
        provider-wire shape exists. Gemini inlineData/fileData request branches now have source tests in
        hub_gemini_codec_characterization.rs, but the rows stay open until every protocol branch has equivalent owner
        evidence.
      required_owner: request/response protocol codec for the specific adjacent edge
      closeout_status: needs_red_tests
      closeout_rule: Test every shape branch positively and negatively; do not collapse distinct semantics into nearby fields.
    - gap_id: gap.gemini_codec_shape_only
      category: runtime_closeout
      affected_statuses:
        - codec_shape_only
      affected_count: 14
      evidence: Gemini codec now extracts toolConfig.functionCallingConfig mode/allowedFunctionNames semantics, but remaining
        generationConfig/safety/citation/grounding/usage semantics are not fully expanded.
      required_owner: v3/crates/routecodex-v3-runtime/src/hub_v1/gemini_codec.rs and gemini_relay_runtime.rs
      closeout_status: needs_runtime_goal
      closeout_rule: Implement Gemini semantic mapping as protocol extensions or explicit unsupported rows; do not treat the
        subtree as raw payload truth.
    - gap_id: gap.edge_only_transport_state
      category: non_runtime_business_gap
      affected_statuses:
        - edge_only
      affected_count: 3
      evidence: Edge rows describe stream/event transport state and must stay outside Chat Process business payload semantics.
      required_owner: SSE/edge transport docs and gate only
      closeout_status: no_business_runtime_closeout
      closeout_rule: Keep edge fields out of provider/client normal payload; do not reclassify them as Chat semantic fields.
