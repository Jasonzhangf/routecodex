- feature_id: v3.build_test_artifact_budget
  status: source_active
  change_risk: medium
  owner_kind: build_tooling
  owner_scope: Canonical V3 Cargo test execution, test-owned artifact release, reusable
    dependency retention, and the 2 GiB steady-state debug budget.
  owner_modules:
  - v3-build-test-artifact-budget
  contract:
  - docs/goals/v3-build-test-artifact-budget-test-design.md
  - docs/architecture/v3-build-tool-module-registry.yml
  - docs/architecture/manifests/v3.build_test_artifact_budget.mainline.yml
  - docs/architecture/wiki/v3-build-test-artifact-budget.md
  required_positive:
  - Passing and failing tests both release invocation-owned test artifacts.
  - Reusable dependency artifacts remain when the post-cleanup cache is within 2 GiB.
  - An idle retained cache above 2 GiB is evicted through Cargo test-profile cleanup
    and remeasured.
  required_negative:
  - Raw package-script V3 Cargo tests cannot bypass the wrapper.
  - Cleanup cannot touch runtime source, installed releases, payloads, control resources,
    or unrelated dependency artifacts.
  - Active external V3 builders prevent cache eviction and produce an explicit failure.
  - PID reuse cannot preserve a stale canonical-test lock because ownership also requires
    the recorded process-start identity.
  - Post-eviction allocation above 2 GiB fails explicitly.
  required_gates:
  - npm run verify:v3-build-test-artifact-budget
  - npm run test:v3-build-test-artifact-budget-red-fixtures
  - npm run verify:v3-resource-map
  - npm run verify:function-map-compile-gate
  completion_rule:
    source: Wrapper behavior, red fixtures, profile contract, package-script wiring,
      maps, and diff check pass.
    runtime: No install or live request replay is required because this owner cannot
      enter runtime or payload paths.
