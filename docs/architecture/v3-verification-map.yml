  required_unit:
  - Responses request to OpenAI Chat provider wire maps max_output_tokens to max_completion_tokens and preserves OpenAI Chat data-plane metadata/stop, tool schema, tool_choice,
    user, sampling, response_format, token fields, and projects Responses reasoning
    config to `reasoning_effort` while rejecting non-standard client_metadata and
    the raw Responses `reasoning` object from provider wire.
  - OpenAI Chat provider response to Responses projection preserves model, created
    timestamp, reasoning, text, tool calls, finish_reason, and usage fields.
  - Anthropic Messages request to Responses provider semantic preserves system, image/text
    blocks, tool_use/tool_result, tool schema, tool_choice, metadata, sampling, top_k,
    token, stop, stream, and thinking fields.
  - Anthropic request thinking.type, thinking.budget_tokens, and thinking.display decode into separate registered Chat fields; no raw thinking object crosses Chat
    Process and none is compressed to effort.
  - Responses reasoning.effort reaches Anthropic `output_config.effort` only for the exact shared value domain; none/minimal fail explicitly and no effort value invents
    `thinking.budget_tokens`.
  - Responses reasoning.summary, reasoning.context, and reasoning.mode remain separate Chat payload extensions and round-trip to Responses; OpenAI Chat and Gemini reject
    them when the target has no equivalent request policy, while Anthropic consumes
    a valid summary policy only as a registered local response-shaping hint with no
    provider-wire field. A response reasoning field never authorizes reconstructing
    the source request policy.
  - Anthropic thinking.budget_tokens and Gemini thinkingBudget share the numeric budget
    extension only after target constraint validation; OpenAI targets reject numeric
    budget rather than compressing it into qualitative effort.
  - Anthropic thinking.display, Gemini includeThoughts, and OpenAI reasoning.summary
    remain separate source-roundtrip semantics and are never reconstructed from each
    other.
  - Responses metadata and client_metadata remain distinct registered Chat request
    fields through inbound, Chat canonicalization, and Responses outbound. Public
    metadata retains 16-pair/64-key/512-value validation; client_metadata does not
    inherit those limits. OpenAI Chat and Anthropic outbound project exact client_metadata.user_id,
    consume registered Codex client-local keys only at provider-wire build, and reject
    unknown keys. Arbitrary public Responses metadata remains in a typed same-request
    response projection context, stays absent from Anthropic wire, and is restored
    before RespChatProcess/continuation save without MetadataCenter, headers, or outbound
    repair.
  - Responses text.verbosity remains output verbosity. Anthropic consumes valid low/medium/high
    values only as a registered local style hint; it never maps them to output_config.effort
    because that field is reasoning effort, not verbosity.
  - ? Responses custom tool declarations map exactly to native OpenAI Chat custom
      tools. Anthropic uses the registered `v3.custom_tool.anthropic_string_input_wrapper.v1`
      compatibility projection
    : exact raw input becomes `tool_use.input={"input":raw}`, declaration description/schema
      carries free-form or exact grammar information without claiming native enforcement,
      and reverse projection requires governed custom declaration identity plus the
      exact wrapper shape. Responses web_search/web_search_preview maps to OpenAI
      Chat web_search_options only for the text-only target subset, while image content
      requests fail. Client-executed tool_search uses its separately audited function
      compatibility transform and projects back to Responses tool_search_call.
  - Malformed function-call arguments use the separate registered `v3.function_call.anthropic_raw_argument_wrapper.v1`
    compatibility projection. It preserves exact raw argument text in `tool_use.input={"input":raw}`
    without relabeling the call as custom; valid JSON arguments remain on the native
    object path, and missing/non-string arguments fail without `{}` repair, result
    deletion, provider failure classification, or provider switch.
  - Structured Anthropic system blocks normalize into request.anthropic_system_blocks;
    Anthropic outbound alone may reconstruct system, while Responses/OpenAI Chat/Gemini
    fail explicitly instead of flattening block-local cache semantics.
  - Anthropic provider JSON/SSE thinking response maps to Responses reasoning.summary/encrypted_content
    before Stopless governance.
  - Responses provider response to Anthropic client projection preserves ordered thinking/text/tool_use,
    usage, stop_reason, and rejects malformed function arguments.
  - Paired and unpaired malformed Responses function-call argument text is preserved exactly at the adjacent OpenAI Chat field projector without JSON-string rewrapping, MetadataCenter reconstruction, provider failure, or reselect.
  - Valid Responses function-call argument JSON remains unchanged on OpenAI Chat wire.
  - OpenAI Chat same-protocol Relay preserves request and response field families
    without cross-protocol repair.
  - OpenAI Chat outbound maps exact client_metadata.user_id to public metadata.user_id,
    consumes registered Codex client-local keys before provider send, and rejects
    unknown client_metadata keys plus reasoning-summary policy before provider send.
  - Responses Direct kernel preserves same-protocol Responses input/include/tool history
    through production Direct provider wire while applying selected provider model
    binding and never synthesizing Chat messages.
  - Direct parity test is a verification binding over existing Direct mainline edges `v3-rd-09-direct-policy` and `v3-rd-10`; it must not create a second protocol-parity
    owner edge for those production nodes.
