  - local continuation context never carries StoplessCenter control fields
  - StoplessCenter persists through MetadataCenter control state without local continuation
    storage
  - no-op CLI stdout is never parsed for prompt/state
  - no-op CLI carries no request/session/conversation scope, no empty JSON envelope,
    and no StoplessCenter state
  - missing or request-fallback session scope disables stopless projection/guidance/control
    writes and lets provider stop pass through
  - Req04 provider-facing continuation is a complete non-persistent guideline that is transparent to the model: it
      must not expose no-op/CLI/client bridge/finish_reason/counters/budget/guard,
      must cover restored-context continuation, tool-use progress, and completion/blocked
      evidence requirements; a single terse `继续。` prompt fails
  - Req04 provider-facing continuation text changes by StoplessCenter policy for default
    continue, stronger continue, needs-evidence, and blocked/wait-user states without
    exposing counters, guard, budget, CLI, no-op, or client bridge internals
  - guard exhaustion does not project another no-op and does not synthesize internal
    state diagnostics; it stops intercepting so the current provider finish_reason=stop
    response passes through
  - response-side stopless intercept requires same-turn StoplessCenter `schema_guidance_active`
    state from Req04; inactive state means stop/end_turn passes through without CLI
    projection or StoplessCenter write
  - stop/end_turn with same-turn StoplessCenter active state and no accepted canonical
    reasoning summary or accepted stop_schema projects no-op and can count toward
    guard
  - stop/end_turn with accepted canonical reasoning summary passes through when no
    unfinished accepted schema overrides it
  - stop/end_turn with canonical reasoning summary and `stop_schema.finished=true`
    passes through without no-op or counter increment
  - stop/end_turn with canonical reasoning summary and unfinished `stop_schema.nextStep`
    projects no-op, stores the nextStep only as scoped StoplessCenter `next_step_prompt`,
    and Req04 carries it into the next provider-facing continuation prompt
  - stop/end_turn with canonical reasoning summary and `stop_schema.blocked=true`
    plus blocked reason appends the blocked reason to canonical summary and passes
    through without no-op or counter increment
  - provider request preserves original tool declaration surface and appends exactly
    one internal reasoningStop
  - Direct-to-Relay Req04 consumes only the exact current-turn stopless CLI call/output
    identified by same-turn request/scope/declaration/call provenance; historical
    stopless or business payload remains byte-for-byte immutable before Anthropic
    wire projection
  - Responses protocol direct stays zero Relay StoplessCenter write; Direct may write
    only Direct-scoped StoplessCenter via V3ResponsesDirectStoplessControlState after
    SameProtocolDirect. With inactive/missing scope or stopless_center=false, completed
    no-summary responses pass through unchanged; with active Direct state, summary/schema
    decides pass-through vs no-op projection while Direct owner remains Direct
  - '`[features].stopless_center = false` disables relay stopless injection and projection'
  - architecture resource-control gate rejects StoplessCenter state modeled as CLI
    args/stdout, local continuation context/store, provider/client normal payload,
    debug/snapshot truth, generic Hub closeout, or server-entry aggregate ownership
