  status: source_and_controlled_transport_lifecycle_verified
  change_risk: high
  owner_kind: rust_v3_provider_transport_runtime
  owner_scope: Provider-owned WebSocket v2 connection/session guard, incremental event
    framing, cancellation, terminal reuse, and fail-closed discard lifecycle
  owner_modules:
