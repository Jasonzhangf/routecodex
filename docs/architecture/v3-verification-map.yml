  required_contract:
  - each V3 Hub contract node has exactly one split owner file and the adjacent builder/parser
    lives in that target node file
  - hub_v1.rs is only the module declaration/reexport surface and may not own node
    structs/builders/parsers
  - shared helper files have explicit owner boundaries and may not hide node-local
    transitions
  - provider compat numbering is branch-local contract numbering and must stay documented/gated
  - one fixed request chain and one fixed response chain
  - entry protocol continuation ownership execution mode and provider wire protocol
    are independent typed axes
  - routed and pinned target resolution merge into one typed target node
  - local context save and restore are owned only by response and request Chat Process
    boundaries
  - immutable interval permits only round-trip-equivalent normalization scope validation
    storage transport expiry and release
  - static Rust hook slots exist for every adjacent node and missing hooks fail explicitly
  - Config publishes declarations and capabilities but never a request-specific branch
    decision
  - P6 remains frozen until Hub v1 Direct equivalence cutover then is physically deleted
  - Relay and new protocols fill hooks without changing or renumbering the skeleton
  - servertool followup Dry Run JSON SSE retry and Error paths use existing hook slots
    and the sole response exit
  required_gates:
