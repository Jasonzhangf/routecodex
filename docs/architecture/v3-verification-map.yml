features:
- feature_id: v3.global_binary_install
  status: source_active_live_verification_required
  change_risk: high
  owner_kind: build_and_runtime_install_control
  owner_scope: Direct publication of the self-contained Rust V3 binary and its local
    command aliases.
  owner_modules:
  - v3-global-binary-install
  contract:
  - docs/architecture/v3-resource-operation-map.yml
  - docs/architecture/v3-function-map.yml
  - docs/architecture/v3-mainline-call-map.yml
  required_positive:
  - Installed rccv3 path is ~/.local/bin/rccv3 and reports the embedded RouteCodex
    build version.
  - routecodex and rcc execute the same installed binary.
  - Aggregate restart and every configured listener health endpoint succeed after
    installation.
  required_negative:
  - Installation does not create ~/.rcc/install/current or ~/.rcc/install/releases.
  - Command aliases do not fall back to a repository build, npm global package, or
    release snapshot.
  - Installation state never enters request, response, provider wire, MetadataCenter,
    or Error payloads.
  - Direct binary installation is not blocked by unrelated in-progress provider/runtime
    feature gates; full architecture CI remains required by the build chain.
  required_gates:
  - npm run test:v3-cli-distribution
  - npm run test:install-v3-target-cleanup
  - npm run verify:v3-resource-map
  - npm run verify:v3-module-boundaries
  completion_rule:
    source: Distribution and owned-target tests plus architecture gates pass.
    runtime: Direct global install, aggregate restart, all-listener health, command
      path, version, and absence of ~/.rcc/install are verified.
- feature_id: v3.managed_server_lifecycle
  status: source_controlled_and_live_5555_release_rollover_verified
  change_risk: high
  owner_kind: rust_project_v3
  owner_scope: Managed process control for one V3 aggregate instance; request/response
    Runtime remains the only business lifecycle.
  owner_modules:
  - v3/crates/routecodex-v3-lifecycle
  - v3/crates/routecodex-v3-cli
  - v3/crates/routecodex-v3-server/src/lib.rs
  - v3/crates/routecodex-v3-config/src/store.rs
  design:
  - docs/goals/v3-managed-live-server-lifecycle-plan.md
  - docs/goals/v3-managed-server-lifecycle-test-design.md
  contract:
  - docs/architecture/manifests/v3.managed_server_lifecycle.mainline.yml
  - docs/architecture/v3-resource-operation-map.yml
  - docs/architecture/v3-mainline-call-map.yml
  - docs/architecture/wiki/v3-managed-server-lifecycle.md
  required_unit:
  - Config-owned source identity is stable, source-sensitive, deterministic, and secret-free
  - deterministic identity and strict state schema
  - exclusive operation lock and auth-handle preflight
  - no resolved secret in lifecycle projection
  - wrong identity, stale state, duplicate-start takeover, explicit listener PID force
    release, foreign managed multi-port port-scoped release, and already-stopped failures
  - terminal same-config release executable rollover succeeds while running or missing-terminal
    rollover fails without reaping
  - top-level start without -c resolves ~/.rcc/config.v3.toml and --snap forces snapshots
  - foreground start forces startup and common HTTP request console even when config
    log_console is false
  - routecodex dev shim may enable snap/debug by default while rcc/rccv3 stable shims
    require explicit --snap/--debug and restart.plan.json remains previous-release
    compatible
  required_integration:
  - actual CLI start/status/duplicate-start/restart/stop on temporary aggregate listeners
  - foreground startup emits the standard minimal human status line instead of raw
    debug JSON, while Relay/Direct requests emit colorized old-production request
    monitor output; human server logs persist the same ANSI-colored monitor lines;
    scoped prefix is `[port:entry:sessionID:<data>][project][provider.model][route]`;
    started/route/terminal/error lines after target selection use Runtime observability
    provider.model/route, not request payload model, pre-route pending scope, or SSE
    transport bytes; terminal failed lines are ANSI red; route hit uses `[virtual-router-hit]
    req=... route=... target=provider[key].wire_model reason=...`; usage uses `usage_in/usage_out/usage_cache/usage_total`
    or `usage=unreported`, `time_i/time_e/time_t`, and `finish_reason=...`; all data
    values are highlighted as whole values, not digit-by-digit.
  - stable instance identity, preserved PID, refreshed start nonce, same-binary executable
    preservation, explicit new-release executable republish across restart, and port-scoped
    foreign managed listener release when a configured listener is already owned by
    another managed instance
  - release-a stop followed by release-b start preserves the instance ID and republishes
    the canonical executable path; release-a running restart from release-b execs
    in place into the new executable
  - all listeners close on one stop
  - lifecycle state, argv, log, and evidence contain no resolved secret
  - live managed 5555 restart with concurrent V2 health and real JSON/SSE Responses
  required_gates:
  - npm run verify:v3-managed-server-lifecycle
  - npm run test:v3-managed-server-lifecycle-red-fixtures
  - npm run test:v3-managed-server-lifecycle
  - npm run verify:v3-architecture-docs
  - npm run verify:v3-resource-map
  - npm run verify:v3-module-boundaries
  - npm run verify:v3-rust-only
  - npm run verify:v3-cargo-fmt
  - npm run verify:v3-clippy
  - npm run test:v3-workspace
  - npm run build:v3-cli
  completion_rule:
    source: Lifecycle whitebox, negative, CLI blackbox, architecture/resource/module,
      fmt, Clippy, workspace, and secret/broad-kill gates pass.
    runtime: 5555 is owned by the managed instance rather than an agent exec session;
      managed restart preserves real JSON/SSE Responses, releases only overlapping
      foreign managed listener ports when needed, and leaves V2 5520/10000/4444 healthy.
    forbidden_claim: Do not claim completion from source or temporary-port evidence
      alone; no broad kill, fallback, second supervisor, SSE/continuation/Anthropic
      ownership, or secret persistence is allowed. Start takeover may only signal
      explicit PIDs listening on the configured listener set.
