    servertool_followup_reenter: false
    global_install_restart: false
  notes:
  - 'Stopless response interception is gated by MetadataCenter StoplessCenter state
    machine same-turn schema_guidance_active: inactive state means no CLI projection
    and no StoplessCenter write; accepted canonical summary or accepted_stop_schema
    is evidence; missing both continues only when active. StoplessCenter state machine,
    schema_guidance_active, inactive state, accepted canonical summary, accepted_stop_schema,
    and Anthropic exception handling are all explicit contract terms.'
  - inactive state means pass-through
  - Old V3 stop schema/fence/CLI JSON continuation is not an allowed runtime source.
